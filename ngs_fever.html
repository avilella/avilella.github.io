// Staff training: a conference (fee + a few days away), a webinar (free, a few hours off the bench) or an article from
// Albert Vilella's Substack newsletter (free, instant once its link is opened). All three give the same level-up.
// The build embeds the newsletter's latest posts (NGS_DATA.substack); links carry utm_* tags so the newsletter's
// stats can tell game visits apart.
const NEWSLETTER = NGS_DATA.substack || { name: 'Rhymes with Haystack', author: 'Albert Vilella', url: 'https://albertvilella.substack.com', posts: [] };
const TRAIN_MAX = 5;               // training levels per person
const TRAIN_COOLDOWN = 7 * 24;     // game hours before the same person can train again
const TRAIN_GAIN = { speed: 1.06, care: 0.92, stamina: 0.94 };   // per level: faster, fewer failed runs, tires more slowly
// Month (0–11) each meeting usually takes place; the next one is offered. Fee includes travel; × salary multiplier.
const CONFERENCES = [
  { key: 'AGBT', name: 'AGBT General Meeting', month: 1, days: 4, fee: 3200 },
  { key: 'AACR', name: 'AACR Annual Meeting', month: 3, days: 4, fee: 2800 },
  { key: 'London Calling', name: 'London Calling', month: 4, days: 3, fee: 2200 },
  { key: 'ESHG', name: 'ESHG Conference', month: 5, days: 4, fee: 2400 },
  { key: 'ISMB', name: 'ISMB', month: 6, days: 4, fee: 2300 },
  { key: 'ESMO', name: 'ESMO Congress', month: 9, days: 4, fee: 3000 },
  { key: 'ASHG', name: 'ASHG Annual Meeting', month: 10, days: 4, fee: 2900 },
];
const WEBINARS = ['Getting the most out of every flow cell', 'Library QC without tears', 'Multiplexing like a pro', 'Long reads 101',
  'Beating index hopping', 'Liquid-handler scripting for beginners', 'Single-cell library prep tips', 'Sample tracking that scales',
  'Faster secondary analysis on GPUs', 'Troubleshooting low-yield runs'];
const READ_KEY = 'ngsfever.read', NEWEST_KEY = 'ngsfever.newest';

function trainLevel(p) { return p.level || 0; }
// Why p cannot train right now ('' when they can).
function trainBlock(p) {
  if (trainLevel(p) >= TRAIN_MAX) return `${p.name} is fully trained (level ${TRAIN_MAX}).`;
  if (p.training) return p.training.kind === 'conference' ? `${p.name} is away at ${p.training.name}.` : `${p.name} is signed up for a webinar.`;
  if (p.trainedAt !== undefined && S.t - p.trainedAt < TRAIN_COOLDOWN) return `${p.name} is still digesting the last training: ready again ${fmtWhen(p.trainedAt + TRAIN_COOLDOWN)}.`;
  return '';
}
function trainGainText() {
  return `+${Math.round((TRAIN_GAIN.speed - 1) * 100)}% speed, ${Math.round((1 - TRAIN_GAIN.care) * 100)}% fewer failed runs, tires ${Math.round((1 - TRAIN_GAIN.stamina) * 100)}% more slowly`;
}
function nextConference() {
  const d = gameDate(S.t), m = d.getUTCMonth(), y = d.getUTCFullYear();
  const c = CONFERENCES.find(x => x.month > m) || CONFERENCES[0];
  return { ...c, year: c.month > m ? y : y + 1, cost: Math.round(c.fee * S.settings.salary / 100) * 100 };
}

// ---------- the newsletter ----------
function newsletterLink(url, campaign, content = '') {
  try {
    const u = new URL(url);
    u.searchParams.set('utm_source', 'ngs_fever'); u.searchParams.set('utm_medium', 'game'); u.searchParams.set('utm_campaign', campaign);
    if (content) u.searchParams.set('utm_content', content);
    return u.toString();
  } catch { return url; }
}
const subscribeLink = where => newsletterLink(NEWSLETTER.url + '/subscribe', 'subscribe', where);
function readArticles() { try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch { return new Set(); } }
function markArticleRead(url) {
  const s = readArticles(); s.add(url);
  try { localStorage.setItem(READ_KEY, JSON.stringify([...s].slice(-100))); } catch { /* private mode */ }
}
// The article to suggest for p: the newest one this browser has not opened yet (a write-up of the conference on offer
// first), skipping the ones p already read. Without posts in the build, the newsletter's home page.
function articleFor(p, conf) {
  const posts = (NEWSLETTER.posts || []).filter(a => !(p.read || []).includes(a.url));
  if (!NEWSLETTER.posts?.length) return { title: NEWSLETTER.name, subtitle: `${NEWSLETTER.author}'s newsletter on NGS and multiomics`, url: NEWSLETTER.url, home: true };
  if (!posts.length) return null;
  const seen = readArticles();
  const about = conf && posts.find(a => !seen.has(a.url) && (a.title + ' ' + a.subtitle).toUpperCase().includes(conf.key.toUpperCase()));
  return about || posts.find(a => !seen.has(a.url)) || posts[0];
}

// ---------- the three routes ----------
function levelUp(p, kind, name) {
  p.traits.speed = +(p.traits.speed * TRAIN_GAIN.speed).toFixed(3);
  p.traits.care = +(p.traits.care * TRAIN_GAIN.care).toFixed(3);
  p.traits.stamina = +(p.traits.stamina * TRAIN_GAIN.stamina).toFixed(3);
  p.level = trainLevel(p) + 1; p.trainedAt = S.t; p.training = null;
  (p.trainLog = p.trainLog || []).push({ kind, name, t: S.t });
  S.stats.trainings = (S.stats.trainings || 0) + 1;
  const how = { conference: `is back from ${name}`, webinar: `finished the webinar “${name}”`, substack: `read “${name}”` }[kind];
  notify('🎓', `${p.name} ${how}: training level ${p.level}! ${trainGainText()}.`, 'good', null, () => select({ type: 'staff', id: p.id }));
  sfx('chime');
}
function trainWithArticle(p, url) {
  markArticleRead(url);
  S.stats.articles = (S.stats.articles || 0) + 1;
  const why = p ? trainBlock(p) : 'Nobody to train';
  if (why) return { ok: false, reason: why };
  const a = (NEWSLETTER.posts || []).find(x => x.url === url);
  if (a) (p.read = p.read || []).push(url);
  levelUp(p, 'substack', a ? a.title : NEWSLETTER.name);
  return { ok: true };
}
function sendToConference(p) {
  const why = trainBlock(p);
  if (why) return { ok: false, reason: why };
  const c = nextConference();
  if (S.money < c.cost) return { ok: false, reason: `Not enough money for ${c.key} (${fmtMoney(c.cost)})` };
  addMoney(-c.cost, 'training');
  p.training = { kind: 'conference', name: `${c.key} ${c.year}`, until: S.t + c.days * 24 };
  if (p.state !== 'off') goLeave(p);
  notify('✈️', `${p.name} is off to ${c.name} ${c.year}: ${fmtMoney(c.cost)}, back in ${c.days} days.`, '', null, () => select({ type: 'staff', id: p.id }));
  return { ok: true };
}
function startWebinar(p) {
  const why = trainBlock(p);
  if (why) return { ok: false, reason: why };
  p.training = { kind: 'webinar', name: pick(WEBINARS), left: +rand(2, 3).toFixed(1) };
  if (inLabNow(p)) goWebinar(p);
  notify('🎧', `${p.name} signed up for the webinar “${p.training.name}” (${fmtHours(p.training.left)}${inLabNow(p) ? '' : ', next shift'}).`, '', null, () => select({ type: 'staff', id: p.id }));
  return { ok: true };
}
// Sit somewhere quiet (a sofa or table if there is one) and follow the webinar; no lab work meanwhile.
function goWebinar(p) {
  if (p.taskId) { const t = S.tasks.find(t => t.id === p.taskId); if (t) releaseTask(t); p.taskId = null; }
  p.hasCup = false;
  const seats = breakSpots('seat'), sp = seats.length ? pick(seats) : null;
  if (sp && setPath(p, [[sp.x, sp.z]])) { p.breakSpot = sp; p.state = 'toWebinar'; }
  else { p.breakSpot = null; p.path = []; p.state = 'webinar'; }
  p.stateT = 0;
}
const WEBINAR_FROM = ['idle', 'break', 'toBreak', 'coffee', 'toCoffee', 'analysing', 'toDesk'];
// Called for every staff member each step, before their shift logic. Returns true when it handled them.
// Webinars pause at the end of the shift and resume the next working day.
function updateTraining(p, dt, shouldWork) {
  const tr = p.training;
  if (!tr) return false;
  if (tr.kind === 'conference') {
    if (S.t >= tr.until) { levelUp(p, 'conference', tr.name); return false; }
    if (p.state === 'exit') { if (moveAlong(p, dt)) { p.state = 'off'; p.walking = false; } }
    else if (p.state !== 'off') goLeave(p);
    return true;
  }
  if (!shouldWork) return false;
  if (WEBINAR_FROM.includes(p.state)) goWebinar(p);
  if (p.state === 'toWebinar') {
    if (moveAlong(p, dt)) { p.state = 'webinar'; p.stateT = 0; if (p.breakSpot?.objId) faceObject(p, S.objects[p.breakSpot.objId]); }
    return true;
  }
  if (p.state === 'webinar') {
    tr.left -= dt;
    p.energy = clamp(p.energy - 2 * p.traits.stamina * dt, 0, 100);
    if (tr.left <= 0) { p.breakSpot = null; p.state = 'idle'; p.idleT = 0; levelUp(p, 'webinar', tr.name); }
    return true;
  }
  return false;
}

// Every few weeks (09:00 on a working day) suggest training whoever has trained least.
function trainingOffer() {
  if (S.preview || !S.settings.trainOffers || !S.staff.length || !isWorkday(S.t)) return;
  if (S.nextTrainOffer === undefined) { S.nextTrainOffer = S.t + 3 * 24; return; }
  if (S.t < S.nextTrainOffer || !$('#modal').classList.contains('hidden')) return;
  const ready = S.staff.filter(p => !trainBlock(p));
  if (!ready.length) return;
  S.nextTrainOffer = S.t + rand(20, 35) * 24;
  const lo = Math.min(...ready.map(trainLevel));

}

// ===== 25_forecast.js =====
// Forecasts: when queued work will happen, when an order will be ready, and whether an offer pays.

const hasWetStaff = () => S.staff.some(p => ROLES[p.role].wet);
// Earliest time >= t when the wet-lab team is on shift (loading, unloading and prep need hands).
function nextWorkTime(t) {
  const st = S.settings.shiftStart, en = S.settings.shiftEnd;
  for (let k = 0; k < 24 * 21; k++) {
    const tt = k === 0 ? t : Math.floor(t) + k;
    const h = hourOfDay(tt);
    if (isWorkday(tt) && h >= st && h < en) return tt;
  }
  return t;
}
// Advance from t by `hours` of hands-on work, counting only shift hours.
function addWorkHours(t, hours) {
  for (let guard = 0; hours > 1e-6 && guard < 500; guard++) {
    t = nextWorkTime(t);
    const take = Math.min(S.settings.shiftEnd - hourOfDay(t), hours);
    t += take; hours -= take;
    if (hours > 1e-6) t += 1e-3;
  }
  return t;
}
function analysisHours(gb) { const cap = computeCapacity(); return cap > 0 ? gb / cap + 0.25 : 12; }

// Projected timeline of every run, mirroring the dispatcher (queue order, free positions, staff hours).
// Each entry: cStart/cEnd = conditioning, start/end = sequencing, slot (+ cslot on a duo's conditioning unit).
let _sched = null;

// Book one batch on an instrument timeline {free, cfree}: staff load it, it is conditioned, then sequenced and unloaded.
function bookRun(tl, def, kitIdx, readyAt) {
  const cH = condHours(def, kitIdx), sH = seqHours(def, kitIdx);
  const i = minIdx(tl.free);
  if (!isFinite(tl.free[i])) return null;
  if (def.duo) {
    const k = minIdx(tl.cfree);
    if (!isFinite(tl.cfree[k])) return null;
    const cStart = nextWorkTime(Math.max(tl.cfree[k], readyAt)) + 0.5, cEnd = cStart + cH;
    const start = Math.max(cEnd, tl.free[i]), end = start + sH;
    tl.cfree[k] = start;                      // unit 1 holds the batch until unit 2 takes it
    tl.free[i] = nextWorkTime(end) + 0.25;
    return { cslot: k, slot: i, cStart, cEnd, start, end };
  }
  const cStart = nextWorkTime(Math.max(tl.free[i], readyAt)) + 0.5, cEnd = cStart + cH, end = cEnd + sH;
  tl.free[i] = nextWorkTime(end) + 0.25;
  return { slot: i, cStart, cEnd, start: cEnd, end };
}
function schedule() {
  if (_sched && _sched.t === S.t) return _sched;
  const runs = new Map(), timelines = new Map();
  for (const inst of Object.values(S.objects)) {
    if (inst.kind !== 'inst') continue;
    const def = INST[inst.key];
    const from = inst.broken ? Math.max(S.t, inst.repairAt) : inst.plug ? S.t : Infinity;
    const loadAt = () => nextWorkTime(isFinite(from) ? from : S.t) + 0.5;
    const put = (r, p) => runs.set(r.id, { instId: inst.id, status: r.status, ...p });
    const free = inst.slots.map((rid, i) => {
      const r = rid !== null ? runById(rid) : null;
      if (!r) return from;
      if (r.status === 'done') { put(r, { slot: i, cStart: r.cStart, cEnd: r.cEnd, start: r.start, end: r.end }); return nextWorkTime(S.t) + 0.25; }
      let p;
      if (r.status === 'queued') { const c = loadAt(); p = { cStart: c, cEnd: c + condHours(def, r.kitIdx) }; p.start = p.cEnd; }
      else p = { cStart: r.cStart, cEnd: r.cEnd, start: r.status === 'conditioning' ? r.cEnd : r.start };
      p.end = r.status === 'running' ? r.end : p.start + seqHours(def, r.kitIdx);
      put(r, { slot: i, ...p });
      return nextWorkTime(p.end) + 0.25;

    if (def.duo) {
      // batches already on the conditioning unit move to a sequencing position in the order they finish conditioning
      const onUnit1 = [];
      tl.cfree = inst.cslots.map((rid, k) => {
        const r = rid !== null ? runById(rid) : null;
        if (!r) return from;
        const cStart = r.status === 'queued' ? loadAt() : r.cStart;
        const cEnd = r.status === 'queued' ? cStart + condHours(def, r.kitIdx) : r.cEnd;
        onUnit1.push({ r, k, cStart, cEnd });
        return Infinity;
      });
      for (const b of onUnit1.sort((a, c) => a.cEnd - c.cEnd)) {
        const i = minIdx(tl.free);
        const start = Math.max(b.cEnd, tl.free[i], S.t), end = start + seqHours(def, b.r.kitIdx);
        put(b.r, { cslot: b.k, slot: isFinite(start) ? i : undefined, cStart: b.cStart, cEnd: b.cEnd, start, end });
        tl.cfree[b.k] = start;
        if (isFinite(end)) tl.free[i] = nextWorkTime(end) + 0.25;
      }
    }
    for (const r of waitingRuns(inst.id)) {
      if (r.held) { put(r, { held: true, status: 'held', start: Infinity, end: Infinity }); continue; }
      const b = bookRun(tl, def, r.kitIdx, S.t);
      if (!b) { put(r, { status: 'waiting', start: Infinity, end: Infinity, stuck: true }); continue; }
      put(r, { status: 'waiting', ...b });
    }
    timelines.set(inst.id, tl);
  }
  _sched = { t: S.t, runs, timelines };

}
// When the instrument's last scheduled batch finishes (Infinity if blocked), for "busy until".
function busyUntil(inst) {
  const sch = schedule();
  let end = 0;
  for (const p of sch.runs.values()) if (p.instId === inst.id && !p.held) end = Math.max(end, p.end);
  return end;
}

// When will order o's libraries be prepped (and QC'd)?
function prepReadyAt(o) {
  if (o.status !== 'offer' && o.stage !== 'prep') return S.t;
  const stations = Object.values(S.objects).filter(x => EQUIP[x.key]?.role === 'prep' && (!o.bsl || EQUIP[x.key].bsl) && powered(x) && !x.broken);
  const wet = S.staff.filter(p => ROLES[p.role].wet);
  if (!stations.length || !wet.length) return Infinity;
  // automated stations only need an operator for part of each batch, so one person can keep several busy
  const handsOn = stations.reduce((a, x) => a + handsOnShare(x), 0) / stations.length;
  const lanes = Math.max(1, Math.min(stations.length, wet.length / handsOn));
  const speed = stations.reduce((a, x) => a + EQUIP[x.key].speed, 0) / stations.length * wet.reduce((a, p) => a + p.traits.speed, 0) / wet.length * labBoost('prep', o);
  const t = orderType(o);
  const myKey = o.status === 'offer' ? (o.rush ? -1e7 : 0) + (S.settings.edf ? S.t + o.days * 24 : S.t) : taskKey({ orderId: o.id, created: 0 });
  let ahead = 0, mine = 0, myBatches = 0;
  for (const tk of S.tasks) {
    if (tk.kind !== 'prep' && tk.kind !== 'qc') continue;
    const rem = Math.max(0, tk.hours - tk.progress);
    if (tk.orderId === o.id) { mine += rem; if (tk.kind === 'prep') myBatches++; }
    else if (tk.kind === 'qc' || taskKey(tk) <= myKey) ahead += rem;
  }
  if (o.status === 'offer') {
    const qc = Object.values(S.objects).some(x => EQUIP[x.key]?.role === 'qc');
    myBatches = o.prepTotal;
    mine = o.prepTotal * (t.prepH + (qc ? 0.8 : 0));
  }
  const work = ahead / (lanes * speed) + mine / (Math.max(1, Math.min(lanes, myBatches)) * speed);
  // the hands-on part waits for shift hours; the walk-away part runs around the clock
  return addWorkHours(S.t, work * handsOn) + work * (1 - handsOn);
}

// When would `gb` of order o finish sequencing on inst with kit kitIdx, if libraries are ready at readyAt?
// `out` (optional) collects the batches it would book, for the queue preview: {pool: runId} or a bookRun() result.
function forecastSeq(o, inst, kitIdx, readyAt, gb, out = null) {
  if (!isFinite(readyAt)) return Infinity;
  const sch = schedule(), def = INST[inst.key], kit = def.kits[kitIdx];
  const t0 = sch.timelines.get(inst.id);
  if (!t0 || !t0.free.length) return Infinity;
  const tl = { free: t0.free.slice(), cfree: t0.cfree.slice() };
  let end = readyAt, left = gb;
  // libraries can ride on queued runs with the same kit (multiplexing)
  for (const r of S.runs) {
    if (left <= 1e-6) break;
    if (r.status !== 'waiting' || r.instId !== inst.id || r.kitIdx !== kitIdx || r.held) continue;
    const room = kit.yieldGb - (runGb(r) - partGb(r, o));
    if (room <= 1e-6) continue;
    const p = sch.runs.get(r.id);
    end = Math.max(end, p && p.cStart >= readyAt ? p.end : readyAt + condHours(def, kitIdx) + seqHours(def, kitIdx));
    if (out) out.push({ pool: r.id, gb: Math.min(room, left) });
    left -= Math.min(room, left);
  }
  const runs = Math.ceil(Math.max(0, left) / kit.yieldGb - 1e-9);
  for (let k = 0; k < runs; k++) {
    const b = bookRun(tl, def, kitIdx, readyAt);
    if (!b) return Infinity;
    if (out) out.push({ ...b, gb: Math.min(kit.yieldGb, left - k * kit.yieldGb) });
    end = Math.max(end, b.end);
  }
  return end;
}
// The batches order o would add to inst's queue with kit kitIdx (queue preview).
function previewBatches(o, inst, kitIdx) {
  const out = [];
  const gb = o.status === 'offer' ? o.gb : gbToSequence(o);
  const end = forecastSeq(o, inst, kitIdx, prepReadyAt(o), gb, out);
  return { batches: out, end, ready: isFinite(end) ? end + analysisHours(o.gb) : Infinity };
}

// Expected outcome of doing order o on inst with option opt (from kitOptions).
function forecastOption(o, inst, opt, libs = prepReadyAt(o)) {
  const gb = o.status === 'offer' ? o.gb : gbToSequence(o);
  const seqEnd = forecastSeq(o, inst, opt.kitIdx, libs, gb);
  const ready = isFinite(seqEnd) ? seqEnd + analysisHours(o.gb) : Infinity;
  const due = o.status === 'offer' ? S.t + o.days * 24 : o.due;
  const lateH = ready - due;
  const cancelled = !isFinite(ready) || lateH > Math.max(o.days * 24, 7 * 24);
  const lateDays = Math.max(0, lateH / 24);
  const factor = cancelled ? 0 : lateDays > 0 ? Math.max(0.5, 1 - 0.05 * Math.ceil(lateDays)) : 1;
  const est = orderCostEstimate(o, opt);
  const revenue = Math.round(o.price * factor);
  const profit = revenue - est.reagent - est.prep - est.cloud;
  return { inst, opt, libs, ready, due, lateDays, cancelled, factor, revenue, reagent: est.reagent, prep: est.prep, cloud: est.cloud, profit, margin: profit / Math.max(1, o.price) };
}
// Every workable (instrument, kit) choice for o, best expected profit first.
function allOptions(o, perInst = 3) {
  const libs = prepReadyAt(o);
  const out = [];
  for (const inst of Object.values(S.objects)) {
    if (inst.kind !== 'inst') continue;
    for (const opt of kitOptions(o, inst).slice(0, perInst)) out.push(forecastOption(o, inst, opt, libs));
  }
  const score = f => f.profit - (isFinite(f.ready) ? (f.ready - S.t) * 0.5 : 1e7);
  return out.sort((a, b) => score(b) - score(a));
}
function offerVerdict(f, o) {
  if (!f) return { cls: 'none', icon: '🚫', text: "Can't do it yet" };
  if (!isFinite(f.ready)) {
    const why = !hasWetStaff() ? 'hire lab staff' : o && o.bsl && !Object.values(S.objects).some(x => EQUIP[x.key]?.bsl) ? 'needs a biosafety cabinet'
      : !Object.values(S.objects).some(x => EQUIP[x.key]?.role === 'prep' && powered(x)) ? 'no working prep station' : 'sequencer unavailable';
    return { cls: 'none', icon: '🚫', text: 'Blocked — ' + why };
  }
  if (f.profit < 0) return { cls: 'loss', icon: '📉', text: 'Loss' };
  if (f.margin < 0.12) return { cls: 'thin', icon: '⚠️', text: 'Thin margin' };
  return { cls: 'good', icon: '✅', text: 'Profitable' };
}
function deadlineVerdict(f, o) {
  const span = (f ? f.due : S.t + o.days * 24) - S.t;
  if (!f || !isFinite(f.ready)) return { cls: 'none', icon: '⏱️', text: `due in ${fmtDays(Math.max(0, span) / 24)}` };
  const d = Math.max(0, f.ready - S.t) / 24;
  if (f.cancelled) return { cls: 'late', icon: '💔', text: `~${fmtDays(d)} — too late, they'd cancel` };
  if (f.lateDays > 0) return { cls: 'late', icon: '🐢', text: `ready ~${fmtDays(d)} · ${Math.ceil(f.lateDays)} d late (−${Math.round((1 - f.factor) * 100)}%)` };
  const tight = (f.due - f.ready) < 0.15 * span;
  return { cls: tight ? 'tight' : 'ok', icon: '⏱️', text: `ready ~${fmtDays(d)} of ${fmtDays(span / 24)}` };
}
// Projected completion of an accepted order.
function orderReadyAt(o) {
  if (o.stage === 'analysis') {
    const left = S.analysis.filter(j => j.orderId === o.id).reduce((a, j) => a + j.left, 0);
    return S.t + (left > 0 ? analysisHours(left) : 0);
  }
  const runs = S.runs.filter(r => runHas(r, o));
  if (o.stage === 'seq') {
    if (!runs.length) return o.instId ? S.t + analysisHours(o.gb) : Infinity;
    const sch = schedule();
    let end = S.t;
    for (const r of runs) { const p = sch.runs.get(r.id); if (!p || !isFinite(p.end)) return Infinity; end = Math.max(end, p.end); }
    return end + analysisHours(o.gb);
  }
  if (!o.instId) return Infinity;
  const end = forecastSeq(o, S.objects[o.instId], o.kitIdx, prepReadyAt(o), gbToSequence(o));
  return isFinite(end) ? end + analysisHours(o.gb) : Infinity;
}

// ---------- sequencers ----------
function buildInstrument(def) {
  const g = new THREE.Group();
  const v = VENDORS[def.vendor] || { body: '#f2f2f2', accent: '#7c5cff', accent2: '#333' };
  let [W, D, H] = def.dims.map(x => x / 100);
  const parts = { screens: [], strips: [], leds: [], cleds: [], spin: [], arms: [], H };
  g.userData.parts = parts;
  const body = v.body;
  const dark = isDark(body);
  const glass = dark ? '#0d1218' : '#26313d';
  const trim = dark ? shade(body, 0.12) : shade(body, -0.08);
  const stripMat = () => umat(v.accent, { emissive: v.accent, ei: 0.6 });
  const addLeds = (n, y, z, width, perRow = 12) => {
    const rows = Math.ceil(n / perRow), cols = Math.min(n, perRow);
    const step = Math.min(0.045, width / (cols + 1));
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / perRow), c = i % perRow;
      const led = sph(0.011, umat('#6b7c8f', { emissive: '#000000' }), undefined, 8);
      at(led, (c - (cols - 1) / 2) * step, y - r * 0.03, z);
      led.castShadow = false;
      g.add(led); parts.leds.push(led);
    }
  };

  const look = def.look && LOOKS[def.look];
  if (look) look(lookKit(g, def, parts, W, D, H, v));
  else switch (def.model) {
    case 'usb': {
      W = Math.max(W, 0.13); D = Math.max(D, 0.06); H = Math.max(H, 0.035);
      const dev = at(rb(W, H, D, body === '#203039' ? '#2b3c47' : body, 0.012), 0.12, H / 2, 0.02);
      g.add(dev);
      const lid = at(bx(W * 0.7, 0.004, D * 0.6, v.accent, { emissive: v.accent, ei: 0.3 }), 0.12, H + 0.002, 0.02);
      g.add(lid); parts.strips.push(lid); lid.material = stripMat();
      // laptop
      const base = at(rb(0.3, 0.018, 0.21, '#c8ced6', 0.008), -0.07, 0.009, 0.02);
      const lidG = new THREE.Group();
      lidG.position.set(-0.07, 0.018, -0.085);
      lidG.rotation.x = -0.32;
      lidG.add(at(rb(0.3, 0.2, 0.012, '#c8ced6', 0.006), 0, 0.1, 0));
      const scr = makeScreen(0.27, 0.17, v.accent);
      at(scr, 0, 0.1, 0.0065); lidG.add(scr); parts.screens.push(scr);
      g.add(base, lidG);
      addLeds(def.slots, H + 0.012, 0.02 + D / 2 - 0.01, W * 0.8);
      parts.leds.forEach(l => l.position.x += 0.12);
      parts.H = 0.25;
      break;
    }
    case 'tablet': {
      const bh = H * 0.8;
      g.add(at(rb(W, bh, D, body, 0.05), 0, bh / 2, 0));
      const oval = mesh(geo('circ', () => new THREE.CircleGeometry(0.5, 40)), umat(v.accent, { emissive: v.accent, ei: 0.35, opacity: 0.9 }), false);
      oval.scale.set(W * 0.32, bh * 0.62, 1);
      at(oval, 0, bh * 0.48, D / 2 + 0.004);
      g.add(oval); parts.strips.push(oval);
      g.add(at(bx(W * 0.9, 0.012, 0.01, trim), 0, 0.03, D / 2 + 0.002));
      const tab = new THREE.Group();
      tab.position.set(0, bh + 0.02, D * 0.12);
      tab.rotation.x = -0.35;
      tab.add(at(rb(W * 0.62, H * 0.34, 0.035, dark ? '#2a2f38' : '#e9edf2', 0.015), 0, H * 0.17, 0));
      const scr = makeScreen(W * 0.56, H * 0.28, v.accent);
      at(scr, 0, H * 0.17, 0.019); tab.add(scr); parts.screens.push(scr);
      g.add(tab);
      g.add(at(cyl(0.02, 0.03, 0.04, trim), 0, bh + 0.02, D * 0.12));
      addLeds(def.slots, bh - 0.04, D / 2 + 0.006, W * 0.5);

    }
    case 'tower': {
      const foot = 0.04;
      g.add(at(rb(W, H - foot, D, body, 0.06), 0, foot + (H - foot) / 2, 0));
      for (const [sx, sz] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) g.add(at(cyl(0.03, 0.035, foot, '#555b63', 10), sx * (W / 2 - 0.08), foot / 2, sz * (D / 2 - 0.08)));
      const pill = rb(W * 0.2, H * 0.42, 0.025, stripMat(), 0.05);
      at(pill, 0, H * 0.42, D / 2 + 0.006); g.add(pill); parts.strips.push(pill);
      const scr = makeScreen(W * 0.5, H * 0.14, v.accent);
      at(scr, 0, H * 0.8, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      g.add(at(bx(W * 0.98, 0.04, D * 0.98, v.accent2 || trim), 0, H - 0.02, 0));
      for (let i = 0; i < 4; i++) g.add(at(bx(0.004, 0.02, D * 0.6, trim), W / 2 + 0.001, H * 0.25 + i * 0.05, 0));
      addLeds(def.slots, H * 0.7, D / 2 + 0.008, W * 0.5);
      break;
    }
    case 'wide': {
      g.add(at(rb(W, H, D, body, 0.06), 0, H / 2, 0));
      const nWin = W > 2 ? 3 : 2;
      for (let i = 0; i < nWin; i++) {
        const wx = (i - (nWin - 1) / 2) * W / (nWin + 0.3) - W * 0.06;
        g.add(at(bx(W / (nWin + 1), H * 0.32, 0.01, glass, { rough: 0.15, metal: 0.4 }), wx, H * 0.55, D / 2 + 0.003));
        const disc = cyl(H * 0.12, H * 0.12, 0.012, '#c9d3dd', 28, { metal: 0.8, rough: 0.2 });
        disc.rotation.x = Math.PI / 2;
        at(disc, wx, H * 0.55, D / 2 + 0.012); g.add(disc); parts.spin.push(disc);
        const dot = at(bx(H * 0.05, H * 0.012, 0.004, v.accent, { emissive: v.accent }), H * 0.06, 0, 0.008);
        disc.add(dot); dot.rotation.x = -Math.PI / 2;
      }
      const strip = bx(W * 0.95, 0.025, 0.012, stripMat());
      at(strip, 0, 0.12, D / 2 + 0.006); g.add(strip); parts.strips.push(strip);
      const scr = makeScreen(Math.min(0.5, W * 0.18), Math.min(0.32, H * 0.16), v.accent);
      at(scr, W / 2 - Math.min(0.32, W * 0.12), H * 0.84, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      addLeds(def.slots, H * 0.3, D / 2 + 0.008, W * 0.3);
      break;
    }
    case 'mega': {
      g.add(at(bx(W, 0.06, D, '#dfe5ec'), 0, 0.03, 0));
      const post = '#9aa6b2';
      const nx = Math.max(2, Math.round(W / 1.2)), nz = Math.max(2, Math.round(D / 1.2));
      for (let i = 0; i <= nx; i++) for (const sz of [-1, 1]) g.add(at(bx(0.05, H, 0.05, post), -W / 2 + i * W / nx, H / 2, sz * D / 2));
      for (let j = 1; j < nz; j++) for (const sx of [-1, 1]) g.add(at(bx(0.05, H, 0.05, post), sx * W / 2, H / 2, -D / 2 + j * D / nz));
      for (const sz of [-1, 1]) g.add(at(bx(W, 0.05, 0.05, post), 0, H, sz * D / 2));
      for (const sx of [-1, 1]) g.add(at(bx(0.05, 0.05, D, post), sx * W / 2, H, 0));
      const glassM = mat('#bfe6ff', { opacity: 0.16, rough: 0.05, double: true });
      for (const sz of [-1, 1]) { const p = plane(W, H * 0.92, glassM); at(p, 0, H * 0.5, sz * D / 2); g.add(p); }
      for (const sx of [-1, 1]) { const p = plane(D, H * 0.92, glassM); p.rotation.y = Math.PI / 2; at(p, sx * W / 2, H * 0.5, 0); g.add(p); }
      const strip = bx(W, 0.03, 0.03, stripMat());
      at(strip, 0, H + 0.04, D / 2); g.add(strip); parts.strips.push(strip);
      // modules inside
      const cols = Math.max(2, Math.floor(W / 0.9));
      for (let i = 0; i < cols; i++) for (const sz of [-1, 1]) {
        const mh = rand(0.7, 1.5);
        const mx = -W / 2 + (i + 0.5) * W / cols;
        const mod = rb(W / cols * 0.75, mh, D * 0.28, i % 2 ? body : shade(body, -0.05), 0.04);
        at(mod, mx, 0.06 + mh / 2, sz * D * 0.3); g.add(mod);
        g.add(at(bx(W / cols * 0.5, 0.06, 0.01, glass), mx, 0.06 + mh * 0.7, sz * D * 0.3 - sz * D * 0.14 - sz * 0.003));
      }
      // robot arm on a rail
      const arm = new THREE.Group();
      arm.add(at(cyl(0.12, 0.15, 0.14, '#f4f6f8'), 0, 0.13, 0));
      const a1 = new THREE.Group(); a1.position.y = 0.2; arm.add(a1);
      a1.add(at(rb(0.1, 0.7, 0.1, '#f4f6f8', 0.04), 0, 0.35, 0));
      const a2 = new THREE.Group(); a2.position.y = 0.7; a2.rotation.z = 1.1; a1.add(a2);
      a2.add(at(rb(0.08, 0.55, 0.08, '#f4f6f8', 0.035), 0, 0.27, 0));
      a2.add(at(bx(0.12, 0.06, 0.12, v.accent, { emissive: v.accent, ei: 0.4 }), 0, 0.56, 0));
      arm.userData.a1 = a1; arm.userData.a2 = a2;
      g.add(arm); parts.arms.push(arm);
      g.add(at(bx(W * 0.9, 0.04, 0.1, '#7d8a97'), 0, 0.08, 0));
      // kiosk outside the glass
      const kx = W / 2 - 0.4, kz = D / 2 + 0.22;
      g.add(at(cyl(0.04, 0.06, 1.0, '#9aa6b2', 10), kx, 0.5, kz));
      const kiosk = new THREE.Group(); kiosk.position.set(kx, 1.15, kz); kiosk.rotation.x = -0.4;
      kiosk.add(at(rb(0.5, 0.34, 0.04, '#2a2f38', 0.02), 0, 0, 0));
      const scr = makeScreen(0.46, 0.3, v.accent); at(scr, 0, 0, 0.021); kiosk.add(scr); parts.screens.push(scr);
      g.add(kiosk);
      addLeds(def.slots, H + 0.1, D / 2 + 0.02, W * 0.3);
      break;
    }
    case 'rack': {
      g.add(at(rb(W, H, D, body, 0.025), 0, H / 2, 0));
      const n = def.slots;
      const cols = Math.min(n, Math.max(1, Math.round(n / Math.max(1, Math.round(n / 12)))));
      const rows = Math.ceil(n / cols);
      const bw = W * 0.86 / cols, bh = H * 0.7 / rows;
      for (let i = 0; i < n; i++) {
        const r = Math.floor(i / cols), c = i % cols;
        const bay = at(bx(bw * 0.8, bh * 0.7, 0.008, '#0b1015'), -W * 0.43 + (c + 0.5) * bw, H * 0.85 - (r + 0.5) * bh, D / 2 + 0.003);
        g.add(bay);
        const led = sph(Math.min(0.01, bw * 0.18), umat('#6b7c8f'), undefined, 8);
        at(led, bay.position.x, bay.position.y - bh * 0.25, D / 2 + 0.01); led.castShadow = false;
        g.add(led); parts.leds.push(led);
      }
      const strip = bx(W * 0.92, 0.012, 0.008, stripMat());
      at(strip, 0, H * 0.94, D / 2 + 0.004); g.add(strip); parts.strips.push(strip);
      const sw = Math.min(0.22, W * 0.4), sh = Math.min(0.14, H * 0.6);
      const scr = makeScreen(sw, sh, v.accent);
      if (H > 0.3) { at(scr, 0, H * 0.12 + sh / 2, D / 2 + 0.004); }
      else { scr.rotation.x = -Math.PI / 2; at(scr, W / 2 - sw / 2 - 0.02, H + 0.002, -D / 2 + sh / 2 + 0.02); }
      g.add(scr); parts.screens.push(scr);
      break;
    }
    case 'cube': {
      g.add(at(rb(W, H, D, body, 0.04), 0, H / 2, 0));
      const ring = mesh(geo('circ', () => new THREE.CircleGeometry(0.5, 40)), umat(v.accent, { emissive: v.accent, ei: 0.6 }), false);
      ring.scale.set(Math.min(W, H) * 0.55, Math.min(W, H) * 0.55, 1);
      at(ring, 0, H * 0.48, D / 2 + 0.003); g.add(ring); parts.strips.push(ring);
      for (const sx of [-1, 1]) g.add(at(bx(0.006, H * 0.96, 0.006, shade(body, -0.12)), sx * W * 0.32, H / 2, D / 2 + 0.002));
      const scr = makeScreen(W * 0.32, H * 0.13, v.accent);
      at(scr, 0, H * 0.86, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      addLeds(def.slots, H * 0.12, D / 2 + 0.006, W * 0.3);
      break;
    }
    default: { // 'box'
      g.add(at(rb(W, H, D, body, 0.035), 0, H / 2, 0));
      g.add(at(bx(W * 0.78, H * 0.42, 0.01, glass, { rough: 0.2, metal: 0.3 }), -W * 0.05, H * 0.32, D / 2 + 0.003));
      const strip = bx(W * 0.86, 0.016, 0.01, stripMat());
      at(strip, 0, H * 0.6, D / 2 + 0.005); g.add(strip); parts.strips.push(strip);
      const scr = makeScreen(W * 0.34, H * 0.22, v.accent);
      at(scr, W * 0.22, H * 0.82, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      g.add(at(bx(W * 0.98, 0.012, D * 0.98, trim), 0, H - 0.004, 0));
      addLeds(def.slots, H * 0.82, D / 2 + 0.006, W * 0.35);
      parts.leds.forEach(l => l.position.x -= W * 0.22);
    }
  }
  // DNA helix that spins above running instruments
  const helix = buildHelix(v.accent);
  helix.position.y = parts.H + 0.32;
  helix.visible = false;
  mergeStatic(helix);
  g.add(helix); parts.helix = helix;
  return mergeStatic(g, dynamicParts(parts));
}
function buildHelix(color) {
  const h = new THREE.Group();
  const a = mat(color, { emissive: color, ei: 0.5 }), b = mat('#ffc23d', { emissive: '#ffc23d', ei: 0.4 }), rung = mat('#ffffff');
  for (let i = 0; i < 10; i++) {
    const t = i / 10 * Math.PI * 2, y = i * 0.035;
    const s1 = sph(0.022, a, undefined, 8), s2 = sph(0.022, b, undefined, 8);
    s1.position.set(Math.cos(t) * 0.07, y, Math.sin(t) * 0.07);
    s2.position.set(-Math.cos(t) * 0.07, y, -Math.sin(t) * 0.07);
    s1.castShadow = s2.castShadow = false;
    const r = bx(0.12, 0.006, 0.006, rung); r.castShadow = false;
    r.position.set(0, y, 0); r.rotation.y = -t;
    h.add(s1, s2, r);
  }
  return h;
}

    const { W, D, H, front, v } = c;
    c.add(rb(W, H, D, '#f3f5f8', Math.min(0.04, W * 0.1)), 0, H / 2, 0);
    if (W < 0.25) {   // palm-sized (VolTRAX): a lid band and a status light
      c.glow(c.add(bx(W * 0.9, 0.006, D * 0.5, c.glowMat(v.accent, 0.6)), 0, H + 0.003, 0));
      c.add(bx(W * 0.5, H * 0.4, 0.004, '#26313d'), 0, H * 0.5, front + 0.002);
      return;
    }
    c.add(rb(W * 0.58, H * 0.56, Math.min(0.02, D * 0.1), mat('#1d2633', { rough: 0.15, metal: 0.3 }), Math.min(0.02, W * 0.05)), -W * 0.14, H * 0.42, front + 0.004);
    c.add(bx(W * 0.4, H * 0.08, 0.004, '#9fb3cc'), -W * 0.14, H * 0.3, front + 0.012);
    c.glow(c.add(bx(W * 0.96, Math.min(0.02, H * 0.06), 0.008, c.glowMat(v.accent, 0.55)), 0, H * 0.84, front + 0.003));
    c.screen(W * 0.26, H * 0.24, W * 0.3, H * 0.5, front + 0.003);
  },
  // dispenser / pipettor: open stage with a plate, a back column and an overhead dispense head
  lab_dispenser(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H * 0.3, D, '#eef1f5', 0.02), 0, H * 0.15, 0);
    c.add(rb(W * 0.3, H * 0.7, D * 0.3, '#e2e7ed', 0.02), -W * 0.32, H * 0.65, -D * 0.33);
    c.add(rb(W * 0.85, H * 0.14, D * 0.32, '#e2e7ed', 0.02), 0, H * 0.92, -D * 0.12);
    c.add(rb(W * 0.16, H * 0.18, D * 0.16, mat(v.accent, { emissive: v.accent, ei: 0.25 }), 0.01), W * 0.1, H * 0.76, D * 0.05);
    c.add(rb(W * 0.32, 0.03, D * 0.22, PLATE_COLORS[2], 0.008), W * 0.1, H * 0.31, D * 0.1);
    c.glow(c.add(bx(W * 0.8, 0.012, 0.008, c.glowMat(v.accent, 0.5)), 0, H * 0.27, front + 0.003));
    c.screen(W * 0.2, H * 0.16, -W * 0.32, H * 0.75, -D * 0.33 + D * 0.15 + 0.003);
  },
  // robot arm (EVA) or a whole automated bench with modules and an arm (LINQ)
  lab_arm(c) {
    const { W, D, H, v } = c;
    let y0 = 0;
    if (W > 1.2) {
      c.add(rb(W, 0.05, D, '#f4f1ea', 0.012), 0, H * 0.75, 0);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) c.add(bx(0.05, H * 0.74, 0.05, '#aab4bf'), sx * (W / 2 - 0.05), H * 0.37, sz * (D / 2 - 0.06));
      for (let i = 0; i < 3; i++) c.add(rb(W * 0.2, 0.25, D * 0.6, ['#e9edf1', '#d9e2ec', '#eef1f5'][i], 0.02), -W * 0.32 + i * W * 0.22, H * 0.78 + 0.125, -D * 0.1);
      y0 = H * 0.78;
    }
    const x0 = W > 1.2 ? W * 0.38 : 0;
    c.add(cyl(0.09, 0.11, 0.1, '#f4f6f8', 18), x0, y0 + 0.05, 0);
    const a1 = new THREE.Group(); a1.position.set(x0, y0 + 0.1, 0); a1.rotation.z = 0.35;
    a1.add(at(rb(0.08, 0.42, 0.08, '#f4f6f8', 0.035), 0, 0.21, 0));
    const a2 = new THREE.Group(); a2.position.y = 0.42; a2.rotation.z = -1.4; a1.add(a2);
    a2.add(at(rb(0.07, 0.34, 0.07, '#f4f6f8', 0.03), 0, 0.17, 0));
    a2.add(at(bx(0.1, 0.05, 0.1, mat(v.accent, { emissive: v.accent, ei: 0.3 })), 0, 0.35, 0));
    c.g.add(a1);
    c.parts.H = Math.max(H, y0 + 0.6);
  },
  // Covaris-style focused-ultrasonicator: water-bath window, dark lid
  lab_shear(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H * 0.78, D, '#f4f6f8', 0.02), 0, H * 0.39, 0);
    c.add(rb(W * 0.94, H * 0.22, D * 0.9, '#3d4b5c', 0.02), 0, H * 0.88, -D * 0.02);
    c.glow(c.add(bx(W * 0.42, H * 0.36, 0.01, c.glowMat('#56c3f0', 0.35)), -W * 0.2, H * 0.42, front + 0.003));
    c.add(cyl(0.012, 0.012, H * 0.3, '#ffffff', 8), -W * 0.2, H * 0.45, front + 0.012);
    c.add(bx(W * 0.42, 0.012, 0.006, v.accent), -W * 0.2, H * 0.66, front + 0.003);
    c.screen(W * 0.3, H * 0.22, W * 0.25, H * 0.5, front + 0.003);
  },
  // Pippin / SageELF: low box, open lid, glowing agarose cassette
  lab_sizesel(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H * 0.55, D, '#eef1f5', 0.02), 0, H * 0.275, 0);
    c.glow(c.add(bx(W * 0.6, 0.015, D * 0.42, c.glowMat('#3fa7ff', 0.45)), 0, H * 0.555, D * 0.05));
    const lid = new THREE.Group(); lid.position.set(0, H * 0.55, -D * 0.45); lid.rotation.x = -0.9;
    lid.add(at(rb(W * 0.95, 0.03, D * 0.9, '#2f3a48', 0.01), 0, 0, D * 0.45));
    c.g.add(lid);
    c.add(bx(W * 0.9, 0.012, 0.006, v.accent), 0, H * 0.48, front + 0.003);
    c.screen(W * 0.36, H * 0.24, W * 0.22, H * 0.25, front + 0.003);
    c.parts.H = H * 1.05;
  },
  // fractionation / clean-up box with a chip slot
  lab_fraction(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H, D, '#f2f4f7', 0.025), 0, H / 2, 0);
    c.add(bx(W * 0.4, 0.02, 0.01, '#2b3440'), -W * 0.2, H * 0.62, front + 0.003);
    c.add(bx(W * 0.3, 0.008, 0.18, '#d9e3ee'), -W * 0.2, H * 0.62, front + 0.06);
    c.glow(c.add(bx(W * 0.9, 0.014, 0.008, c.glowMat(v.accent, 0.5)), 0, H * 0.88, front + 0.003));
    c.screen(W * 0.32, H * 0.3, W * 0.24, H * 0.55, front + 0.003);
  },
  // capillary / tape electrophoresis (Fragment Analyzer, TapeStation, LabChip GX, FemtoPulse): screen + sample drawer
  lab_electro(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H, D, '#f2f4f7', 0.025), 0, H / 2, 0);
    c.add(rb(W * 0.96, H * 0.42, 0.02, '#26313d', 0.012), 0, H * 0.72, front + 0.002);
    c.screen(W * 0.42, H * 0.34, -W * 0.2, H * 0.72, front + 0.013);
    c.add(rb(W * 0.4, H * 0.08, 0.12, '#e3e8ee', 0.01), W * 0.18, H * 0.2, front + 0.04);
    for (let i = 0; i < 6; i++) c.add(cyl(0.008, 0.008, 0.02, PLATE_COLORS[i], 6), W * 0.05 + i * W * 0.05, H * 0.25, front + 0.05);
    c.glow(c.add(bx(W * 0.9, 0.012, 0.006, c.glowMat(v.accent, 0.5)), 0, H * 0.46, front + 0.003));
  },
  // microplate reader: plate carrier sticking out of the front
  lab_reader(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H, D, '#e9edf2', 0.025), 0, H / 2, 0);
    c.add(bx(W * 0.98, H * 0.2, 0.01, '#3a4553'), 0, H * 0.45, front + 0.002);
    c.add(bx(W * 0.42, 0.02, 0.16, '#c9d2dc'), -W * 0.1, H * 0.42, front + 0.08);
    c.add(rb(W * 0.36, 0.022, 0.12, PLATE_COLORS[(c.def.name || '').length % 6], 0.006), -W * 0.1, H * 0.44, front + 0.09);
    c.glow(c.add(bx(W * 0.2, 0.01, 0.006, c.glowMat(v.accent, 0.6)), W * 0.3, H * 0.75, front + 0.003));
    c.screen(W * 0.24, H * 0.16, W * 0.3, H * 0.62, front + 0.003);
  },
  // benchtop fluorometer: small box, tube lid, tilted screen
  lab_fluoro(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H, D, '#f7f7f7', 0.02), 0, H / 2, 0);
    c.add(cyl(Math.min(W, D) * 0.15, Math.min(W, D) * 0.15, 0.02, v.accent, 16), 0, H + 0.005, -D * 0.25);
    c.screen(W * 0.75, D * 0.38, 0, H + 0.003, D * 0.12, -Math.PI / 2 + 0.3);
  },
  // spectrophotometer: small box with a pedestal arm and a screen
  lab_spectro(c) {
    const { W, D, H, front, v } = c;
    c.add(rb(W, H * 0.7, D, '#f2f4f7', 0.02), 0, H * 0.35, 0);
    const arm = cyl(0.02, 0.02, Math.min(0.12, D * 0.4), '#9aa6b2', 10); arm.rotation.x = Math.PI / 2 - 0.5;
    c.add(arm, -W * 0.22, H * 0.78, -D * 0.1);
    c.add(cyl(0.015, 0.015, 0.01, v.accent, 10), -W * 0.22, H * 0.71, D * 0.05);
    c.screen(W * 0.42, D * 0.42, W * 0.18, H * 0.7 + 0.004, D * 0.08, -Math.PI / 2 + 0.25);
  },
};

// ---------- lab kit & furniture ----------
function buildEquip(key) {
  const d = EQUIP[key];
  const g = new THREE.Group();
  const parts = { screens: [], strips: [], leds: [], spin: [], arms: [], H: (d.h || 50) / 100 };
  g.userData.parts = parts;
  const W = (d.w || 40) / 100, D = (d.d || 40) / 100, H = (d.h || 40) / 100;
  const lab = d.model && LAB_MODELS[d.model];
  if (lab) lab(lookKit(g, d, parts, W, D, H, { accent: vendorAccent(d.vendor), body: '#f2f4f7' }));
  else switch (key) {
    case 'bench': case 'bench1': {
      const top = BENCH_H;
      g.add(at(rb(W, 0.05, D, '#f4f1ea', 0.012), 0, top - 0.025, 0));
      g.add(at(bx(W, 0.012, D, '#d9d2c3'), 0, top - 0.056, 0));
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) g.add(at(bx(0.05, top - 0.06, 0.05, '#aab4bf', { metal: 0.5, rough: 0.35 }), sx * (W / 2 - 0.04), (top - 0.06) / 2, sz * (D / 2 - 0.05)));
      const nCab = Math.max(1, Math.round(W / 0.6));
      const pastel = ['#b8e1ff', '#ffd6e5', '#d6f5e3', '#fff0c2'];
      for (let i = 0; i < nCab; i++) {
        if (W > 1.2 && i === Math.floor(nCab / 2)) continue; // knee space
        const cx = -W / 2 + (i + 0.5) * W / nCab;
        g.add(at(rb(W / nCab - 0.04, 0.62, D * 0.8, pastel[i % 4], 0.02), cx, 0.38, -D * 0.06));
        for (let k = 0; k < 3; k++) g.add(at(bx(0.12, 0.012, 0.012, '#7d8a97'), cx, 0.18 + k * 0.2, D * 0.34 + 0.01));
      }
      g.add(at(bx(W, 0.1, 0.02, '#e8e2d6'), 0, top + 0.05, -D / 2 + 0.01));
      break;
    }
    case 'cycler': {
      g.add(at(rb(W, H * 0.75, D, '#eef1f5', 0.02), 0, H * 0.375, 0));
      const lid = at(rb(W * 0.92, H * 0.28, D * 0.85, '#3d4b5c', 0.03), 0, H * 0.84, -D * 0.04);
      g.add(lid);
      const scr = makeScreen(W * 0.5, H * 0.3, '#ff8a5b'); at(scr, 0, H * 0.4, D / 2 + 0.002); g.add(scr); parts.screens.push(scr);
      const led = sph(0.01, umat('#6b7c8f'), undefined, 8); at(led, W * 0.38, H * 0.6, D / 2 + 0.004); g.add(led); parts.leds.push(led);
      break;
    }
    case 'liquid': {
      g.add(at(rb(W, 0.1, D, '#e7ecf2', 0.02), 0, 0.05, 0));
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) g.add(at(bx(0.03, H - 0.1, 0.03, '#b7c2cd'), sx * (W / 2 - 0.03), 0.1 + (H - 0.1) / 2, sz * (D / 2 - 0.03)));
      g.add(at(bx(W, 0.04, D, '#cfd8e1'), 0, H - 0.02, 0));
      const gl = mat('#cfeaff', { opacity: 0.2, double: true });
      const fp = plane(W - 0.06, H - 0.14, gl); at(fp, 0, 0.1 + (H - 0.14) / 2, D / 2 - 0.02); g.add(fp);
      const colors = ['#ff6fa5', '#2f8cff', '#ffc23d', '#19b394', '#7c5cff', '#ff8a5b'];
      for (let i = 0; i < 6; i++) g.add(at(bx(0.12, 0.03, 0.085, colors[i]), -W / 2 + 0.14 + (i % 3) * 0.33, 0.115, (i < 3 ? -1 : 1) * D * 0.18));
      const gantry = new THREE.Group(); gantry.position.y = H - 0.08;
      gantry.add(at(bx(0.06, 0.05, D - 0.08, '#7d8a97'), 0, 0, 0));
      const head = at(bx(0.08, 0.16, 0.08, '#7c5cff', { emissive: '#7c5cff', ei: 0.2 }), 0, -0.1, 0);
      gantry.add(head);
      for (let i = 0; i < 4; i++) gantry.add(at(cyl(0.004, 0.002, 0.08, '#ffffff', 6), -0.024 + i * 0.016, -0.22, 0));
      gantry.userData.liquid = true;
      g.add(gantry); parts.arms.push(gantry);
      const scr = makeScreen(0.2, 0.1, '#7c5cff'); at(scr, W / 2 - 0.14, 0.05, D / 2 + 0.002); g.add(scr); parts.screens.push(scr);
      break;
    }
    case 'bsc': {
      g.add(at(rb(W, 0.75, D, '#e9edf1', 0.02), 0, 0.375, 0));
      g.add(at(rb(W, H - 0.75, D, '#f4f6f8', 0.03), 0, 0.75 + (H - 0.75) / 2, 0));
      g.add(at(bx(W * 0.9, 0.55, 0.02, mat('#bfe6ff', { opacity: 0.35, rough: 0.05 })), 0, 1.1, D / 2 + 0.01));
      g.add(at(bx(W * 0.9, 0.5, D * 0.6, '#d6f0ff', { emissive: '#bfe6ff', ei: 0.25 }), 0, 1.08, -D * 0.1));
      const strip = bx(W * 0.8, 0.03, 0.01, umat('#4dd0e1', { emissive: '#4dd0e1', ei: 0.4 })); at(strip, 0, 1.66, D / 2 + 0.006); g.add(strip); parts.strips.push(strip);
      const scr = makeScreen(0.22, 0.09, '#00acc1'); at(scr, W / 2 - 0.18, 1.78, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      break;
    }
    case 'qubit': {
      g.add(at(rb(W, H, D, '#f7f7f7', 0.03), 0, H / 2, 0));
      const scr = makeScreen(W * 0.7, H * 0.4, '#2f8cff'); scr.rotation.x = -Math.PI / 2 + 0.3; at(scr, 0, H + 0.002, D * 0.1); g.add(scr); parts.screens.push(scr);
      g.add(at(cyl(0.025, 0.025, 0.02, '#2b3440'), 0, H + 0.005, -D * 0.25));
      break;
    }
    case 'fragan': {
      g.add(at(rb(W, H, D, '#f0f3f6', 0.03), 0, H / 2, 0));
      g.add(at(bx(W * 0.6, H * 0.2, 0.01, '#2b3440'), 0, H * 0.35, D / 2 + 0.002));
      const strip = bx(W * 0.8, 0.012, 0.008, umat('#19b394', { emissive: '#19b394', ei: 0.5 })); at(strip, 0, H * 0.62, D / 2 + 0.004); g.add(strip); parts.strips.push(strip);
      const scr = makeScreen(W * 0.4, H * 0.18, '#19b394'); at(scr, W * 0.2, H * 0.82, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      break;
    }
    case 'centrifuge': {
      g.add(at(rb(W, H * 0.8, D, '#eef1f5', 0.04), 0, H * 0.4, 0));
      const lid = cyl(W * 0.36, W * 0.4, H * 0.22, '#5c6bc0', 28); at(lid, 0, H * 0.88, -D * 0.05); g.add(lid); parts.spin.push(lid);
      const scr = makeScreen(W * 0.4, H * 0.22, '#5c6bc0'); at(scr, 0, H * 0.45, D / 2 + 0.002); g.add(scr); parts.screens.push(scr);
      break;
    }
    case 'freezer': case 'fridge': {
      const col = key === 'freezer' ? '#f8fbff' : '#eef3f7';
      g.add(at(rb(W, H, D, col, 0.04), 0, H / 2, 0));
      if (key === 'fridge') {
        g.add(at(bx(W * 0.82, H * 0.78, 0.012, mat('#cfeaff', { opacity: 0.45, rough: 0.05 })), 0, H * 0.48, D / 2 + 0.004));
        const cols = ['#ff6fa5', '#2f8cff', '#ffc23d', '#19b394', '#7c5cff'];
        for (let s = 0; s < 4; s++) for (let i = 0; i < 5; i++) g.add(at(cyl(0.025, 0.025, 0.12, cols[(i + s) % 5], 8), -W * 0.3 + i * W * 0.15, 0.25 + s * 0.38, D * 0.25));
      } else {
        g.add(at(bx(0.03, 0.4, 0.03, '#9aa6b2', { metal: 0.6 }), W * 0.38, H * 0.55, D / 2 + 0.02));
        const scr = makeScreen(0.2, 0.08, '#2f8cff'); at(scr, 0, H * 0.86, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      }
      break;
    }
    case 'server': {
      g.add(at(rb(W, H, D, '#1f2530', 0.02), 0, H / 2, 0));
      for (let i = 0; i < 10; i++) {
        g.add(at(bx(W * 0.86, 0.12, 0.01, '#2e3744'), 0, 0.2 + i * 0.165, D / 2 + 0.002));
        for (let k = 0; k < 3; k++) {
          const led = sph(0.008, umat('#33ff99', { emissive: '#33ff99' }), undefined, 6);
          at(led, W * 0.3 - k * 0.03, 0.2 + i * 0.165, D / 2 + 0.008); led.castShadow = false; g.add(led); parts.leds.push(led);
        }
      }
      parts.blinky = true;
      break;
    }
    case 'ups': {
      g.add(at(rb(W, H, D, '#3c4450', 0.03), 0, H / 2, 0));
      const scr = makeScreen(W * 0.5, H * 0.16, '#ffc23d'); at(scr, 0, H * 0.78, D / 2 + 0.003); g.add(scr); parts.screens.push(scr);
      for (let i = 0; i < 4; i++) { const led = sph(0.012, umat('#ffc23d', { emissive: '#ffc23d' }), undefined, 8); at(led, -W * 0.2 + i * W * 0.13, H * 0.55, D / 2 + 0.006); led.castShadow = false; g.add(led); parts.leds.push(led); }
      break;
    }
    case 'socket': case 'socket_hp': {
      const hp = key === 'socket_hp';
      const plate = rb(hp ? 0.14 : 0.16, hp ? 0.16 : 0.09, 0.025, hp ? '#2f6fd6' : '#fbfbfb', 0.01);
      at(plate, 0, 0, 0.012); g.add(plate);
      const holes = hp ? [[0, 0]] : [[-0.04, 0], [0.04, 0]];
      for (const [x, y] of holes) g.add(at(cyl(hp ? 0.035 : 0.022, hp ? 0.035 : 0.022, 0.01, hp ? '#1b3f80' : '#d5dbe3', 14), x, y, 0.026).rotateX(Math.PI / 2));
      parts.H = 0.2;
      break;
    }
    case 'pillar': {
      g.add(at(rb(W * 0.7, H, D * 0.7, '#cfd8e1', 0.03), 0, H / 2, 0));
      for (let i = 0; i < 4; i++) {
        const s = at(rb(0.12, 0.08, 0.02, '#fbfbfb', 0.008), 0, H * 0.75, D * 0.35 + 0.012);
        const holder = new THREE.Group(); holder.rotation.y = i * Math.PI / 2; holder.add(s); g.add(holder);
      }
      g.add(at(bx(W * 0.72, 0.04, D * 0.72, '#ffc23d'), 0, H - 0.02, 0));
      break;
    }
    case 'coffee': {
      g.add(at(rb(W, H, D, '#a9744f', 0.02), 0, H / 2, 0));
      g.add(at(bx(W + 0.02, 0.03, D + 0.02, '#f4f1ea'), 0, H + 0.015, 0));
      const m = new THREE.Group(); m.position.set(-W * 0.18, H + 0.03, -D * 0.05);
      m.add(at(rb(0.3, 0.38, 0.3, '#2b2f36', 0.04), 0, 0.19, 0));
      m.add(at(rb(0.26, 0.06, 0.06, '#c0c7cf', 0.02, { metal: 0.6 }), 0, 0.27, 0.16));
      m.add(at(cyl(0.035, 0.03, 0.07, '#ffffff', 12), 0, 0.04, 0.12));
      const led = sph(0.012, umat('#ff6fa5', { emissive: '#ff6fa5' }), undefined, 8); at(led, 0.1, 0.33, 0.151); m.add(led); parts.leds.push(led);
      g.add(m);
      const mugCols = ['#ff6fa5', '#ffc23d', '#19b394', '#2f8cff'];
      for (let i = 0; i < 4; i++) g.add(at(cyl(0.03, 0.026, 0.07, mugCols[i], 12), W * 0.12 + i * 0.075, H + 0.065, D * 0.12));
      g.add(at(cyl(0.06, 0.05, 0.1, '#e6d5b8', 12), W * 0.32, H + 0.08, -D * 0.2));
      parts.H = H + 0.4;
      break;
    }
    case 'sofa': {
      const c = '#8fb8ff';
      g.add(at(rb(W, 0.22, D, shade(c, -0.15), 0.05), 0, 0.17, 0));
      for (let i = 0; i < 3; i++) g.add(at(rb(W / 3 - 0.03, 0.12, D * 0.7, c, 0.05), -W / 3 + i * W / 3, 0.34, D * 0.1));
      g.add(at(rb(W, 0.42, 0.2, shade(c, -0.08), 0.08), 0, 0.45, -D / 2 + 0.1));
      for (const sx of [-1, 1]) g.add(at(rb(0.16, 0.36, D, shade(c, -0.08), 0.07), sx * (W / 2 - 0.08), 0.3, 0));
      g.add(at(rb(0.22, 0.18, 0.08, '#ffc23d', 0.05), -W * 0.3, 0.48, -D * 0.2).rotateZ(0.2));
      break;
    }
    case 'table': {
      g.add(at(cyl(W * 0.4, W * 0.4, 0.04, '#f4e1c1', 28), 0, H, 0));
      g.add(at(cyl(0.04, 0.05, H, '#9aa6b2', 10), 0, H / 2, 0));
      g.add(at(cyl(0.2, 0.22, 0.03, '#9aa6b2', 18), 0, 0.015, 0));
      const cols = ['#ff6fa5', '#2f8cff', '#19b394'];
      for (let i = 0; i < 3; i++) {
        const a = i / 3 * Math.PI * 2 + 0.5;
        g.add(at(cyl(0.12, 0.12, 0.05, cols[i], 16), Math.cos(a) * W * 0.42, 0.45, Math.sin(a) * W * 0.42));
        g.add(at(cyl(0.02, 0.02, 0.42, '#9aa6b2', 6), Math.cos(a) * W * 0.42, 0.21, Math.sin(a) * W * 0.42));
      }
      g.add(at(cyl(0.05, 0.05, 0.03, '#ffffff', 14), 0.08, H + 0.03, 0.04));
      const donut = at(sph(0.035, '#d9a066', undefined, 10), -0.1, H + 0.04, -0.05);
      donut.scale.set(1, 0.4, 1);
      g.add(donut);
      break;
    }
    case 'plant': {
      g.add(at(cyl(0.16, 0.12, 0.3, '#e07a5f', 16), 0, 0.15, 0));
      g.add(at(cyl(0.165, 0.165, 0.04, '#c8644b', 16), 0, 0.3, 0));
      const leaf = ['#6bd06b', '#4cb84c', '#82e082'];
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2;
        const l = sph(rand(0.1, 0.15), leaf[i % 3], undefined, 10);
        at(l, Math.cos(a) * 0.1, 0.5 + rand(0, 0.45), Math.sin(a) * 0.1); g.add(l);
      }
      g.add(at(sph(0.14, '#5fc45f', undefined, 12), 0, 0.98, 0));
      break;
    }
    case 'arcade': {
      g.add(at(rb(W, H, D, '#7c5cff', 0.03), 0, H / 2, 0));
      const scr = makeScreen(W * 0.7, H * 0.3, '#ff6fa5'); scr.rotation.x = -0.2; at(scr, 0, H * 0.68, D / 2 + 0.02); g.add(scr); parts.screens.push(scr);
      g.add(at(bx(W * 0.9, 0.06, 0.25, '#2b2f36'), 0, H * 0.48, D / 2 + 0.08));
      g.add(at(sph(0.025, '#ff5a5f', undefined, 10), -0.1, H * 0.53, D / 2 + 0.12));
      g.add(at(sph(0.02, '#ffc23d', undefined, 10), 0.05, H * 0.52, D / 2 + 0.12));
      g.add(at(bx(W * 0.9, 0.1, 0.02, '#ffc23d', { emissive: '#ffc23d', ei: 0.6 }), 0, H - 0.08, D / 2 + 0.005));
      parts.arcade = true;
      break;
    }
    default:
      g.add(at(rb(W, H, D, '#dddddd'), 0, H / 2, 0));
  }
  return mergeStatic(g, dynamicParts(parts));
}

function buildPerson(look, role = 'tech') {
  const g = new THREE.Group();
  const coat = role === 'engineer' ? '#2f6fd6' : '#fbfbfb';

  p.legR = p.legL.clone(); p.legR.position.x = 0.08;
  g.add(p.legL, p.legR);
  // body (lab coat) + shirt
  p.body = new THREE.Group(); p.body.position.y = 0.5;
  p.body.add(at(rb(0.36, 0.56, 0.26, coat, 0.11), 0, 0.28, 0));
  p.body.add(at(rb(0.12, 0.28, 0.02, look.shirt, 0.01), 0, 0.42, 0.125));
  if (role !== 'engineer') for (const y of [0.18, 0.3]) p.body.add(at(sph(0.012, '#c9d1db', undefined, 6), 0.04, y, 0.132));
  p.body.add(at(bx(0.06, 0.04, 0.01, look.shirt), -0.1, 0.42, 0.13));
  g.add(p.body);
  // arms
  const armM = mat(coat);
  const mkArm = (sx) => {
    const a = new THREE.Group(); a.position.set(sx * 0.22, 1.0, 0);
    a.add(at(rb(0.1, 0.42, 0.11, armM, 0.045), 0, -0.2, 0));
    a.add(at(sph(0.055, look.skin, undefined, 10), 0, -0.43, 0));
    return a;
  };
  p.armL = mkArm(-1); p.armR = mkArm(1);
  g.add(p.armL, p.armR);
  // coffee cup in right hand
  p.cup = new THREE.Group();
  p.cup.add(at(cyl(0.04, 0.034, 0.09, '#ff6fa5', 12), 0, 0, 0));
  p.cup.add(at(cyl(0.041, 0.041, 0.012, '#ffffff', 12), 0, 0.035, 0));
  p.cup.position.set(0, -0.46, 0.05); p.cup.visible = false;
  p.armR.add(p.cup);
  // head
  p.head = new THREE.Group(); p.head.position.y = 1.32;
  p.head.add(at(sph(0.25, look.skin, undefined, 20), 0, 0, 0));
  const eye = mat('#222831');
  for (const sx of [-1, 1]) {
    p.head.add(at(sph(0.035, eye, undefined, 10), sx * 0.09, 0.0, 0.225));
    p.head.add(at(sph(0.011, '#ffffff', undefined, 6), sx * 0.09 + 0.012, 0.014, 0.255));
    const ch = at(sph(0.035, mat('#ff9eb5', { opacity: 0.6 }), undefined, 8), sx * 0.15, -0.06, 0.2);
    ch.scale.set(1, 0.55, 0.4); ch.castShadow = false; p.head.add(ch);
  }
  const mouth = at(bx(0.06, 0.012, 0.01, '#8a3b3b'), 0, -0.09, 0.238); p.head.add(mouth);
  addHair(p.head, look);
  if (look.glasses || look.goggles) {
    const gm = look.goggles ? mat('#bfe6ff', { opacity: 0.55 }) : mat('#2b2f36');
    for (const sx of [-1, 1]) {
      const ring = mesh(geo('torus', () => new THREE.TorusGeometry(0.05, 0.009, 6, 16)), gm, false);
      at(ring, sx * 0.09, 0.0, 0.245); p.head.add(ring);
    }
    p.head.add(at(bx(0.06, 0.01, 0.01, look.goggles ? '#bfe6ff' : '#2b2f36'), 0, 0.005, 0.25));
  }
  if (role === 'engineer') {
    p.head.add(at(cyl(0.26, 0.27, 0.1, '#ffc23d', 18), 0, 0.17, 0));
    p.head.add(at(bx(0.3, 0.02, 0.16, '#ffc23d'), 0, 0.13, 0.2));
    const wrench = at(bx(0.04, 0.22, 0.03, '#9aa6b2', { metal: 0.7 }), 0, -0.52, 0.06);
    p.armR.add(wrench);
  }
  g.add(p.head);
  // status bubble
  p.bubble = emojiSprite('☕', 0.36); p.bubble.position.y = 1.95; p.bubble.visible = false;
  g.add(p.bubble);
  g.userData.p = p;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  for (const limb of [p.head, p.body, p.legL, p.legR, p.armL, p.armR]) mergeStatic(limb, new Set([p.cup]));
  return g;
}
function addHair(head, look) {
  const hm = mat(look.hair);
  const cap = mesh(geo('haircap', () => new THREE.SphereGeometry(0.265, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55)), hm);
  cap.rotation.x = -0.25; head.add(cap);
  switch (look.style) {
    case 'bob': head.add(at(rb(0.56, 0.3, 0.42, hm, 0.14), 0, -0.02, -0.06)); break;
    case 'bun': head.add(at(sph(0.11, hm, undefined, 12), 0, 0.27, -0.1)); break;
    case 'pony': { const t = at(cyl(0.06, 0.03, 0.3, hm, 10), 0, -0.05, -0.3); t.rotation.x = 0.5; head.add(t); break; }
    case 'curly': for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; head.add(at(sph(0.08, hm, undefined, 8), Math.cos(a) * 0.2, 0.12 + Math.sin(i) * 0.05, Math.sin(a) * 0.2 - 0.03)); } break;
    case 'spiky': for (let i = 0; i < 6; i++) { const s = mesh(geo('spike', () => new THREE.ConeGeometry(0.05, 0.14, 6)), hm); at(s, (i - 2.5) * 0.07, 0.27, -0.02 + (i % 2) * 0.05); s.rotation.z = (i - 2.5) * 0.15; head.add(s); } break;
    case 'long': head.add(at(rb(0.52, 0.5, 0.2, hm, 0.1), 0, -0.14, -0.15)); break;
    default: break;
  }
}

// ---------- thumbnails for the shop ----------
const THUMB = { renderer: null, scene: null, camera: null, cache: new Map() };
function thumbnail(kind, key, px = null) {
  const id = kind + ':' + key;
  if (!px && THUMB.cache.has(id)) return THUMB.cache.get(id);
  try {
    if (!THUMB.renderer) {
      THUMB.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      THUMB.renderer.setSize(220, 160);
      THUMB.renderer.outputColorSpace = THREE.SRGBColorSpace;
      THUMB.scene = new THREE.Scene();
      THUMB.scene.add(new THREE.HemisphereLight('#ffffff', '#c9b79c', 1.6));
      const dl = new THREE.DirectionalLight('#ffffff', 1.6); dl.position.set(3, 5, 4); THUMB.scene.add(dl);
      THUMB.camera = new THREE.PerspectiveCamera(30, 220 / 160, 0.01, 100);
    }
    const [tw, th] = px || [220, 160];
    THUMB.renderer.setSize(tw, th); THUMB.camera.aspect = tw / th; THUMB.camera.updateProjectionMatrix();
    const model = kind === 'inst' ? buildInstrument(INST[key]) : buildEquip(key);
    if (model.userData.parts?.helix) model.remove(model.userData.parts.helix);
    THUMB.scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const r = Math.max(size.x, size.y, size.z) * 0.62 + 0.01;
    const dist = r / Math.tan(THREE.MathUtils.degToRad(15));
    THUMB.camera.position.set(c.x + dist * 0.55, c.y + dist * 0.42, c.z + dist * 0.75);
    THUMB.camera.lookAt(c);
    THUMB.renderer.setClearColor(0x000000, 0);
    THUMB.renderer.render(THUMB.scene, THUMB.camera);
    const url = THUMB.renderer.domElement.toDataURL('image/png');
    THUMB.scene.remove(model);
    if (!px) THUMB.cache.set(id, url);
    return url;
  } catch (e) {
    console.warn('thumbnail', key, e && e.message);
    THUMB.cache.set(id, null);
    return null;
  }
}

  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.025;
  scene.add(sun, sun.target);
  R.sun = sun;
  // ceiling lights at night: a spot that only covers the lab footprint
  R.labLight = new THREE.SpotLight('#fff1d6', 0, 0, 0.8, 0.45, 0);

  R.ghostMat = new THREE.MeshBasicMaterial({ color: '#3ddc84', transparent: true, opacity: 0.5, depthWrite: false });

  buildOutdoor();

  frameCamera(true);
  window.addEventListener('resize', onResize);

function onResize() {
  R.camera.aspect = window.innerWidth / window.innerHeight;
  R.camera.updateProjectionMatrix();
  R.renderer.setSize(window.innerWidth, window.innerHeight, false);
}
function labCenter() { const L = S.lab; return { x: (L.x0 + L.w / 2) * GRID, z: (L.z0 + L.h / 2) * GRID }; }
function frameCamera(instant = false) {
  const c = labCenter(), L = S.lab;
  const span = Math.max(L.w, L.h) * GRID;
  const target = new THREE.Vector3(c.x, 0, c.z);
  const pos = new THREE.Vector3(c.x + span * 0.45, span * 0.85 + 3, c.z + span * 0.85 + 2.5);
  if (instant) { R.controls.target.copy(target); R.camera.position.copy(pos); R.controls.update(); }
  else R.camAnim = { t: 0, fromT: R.controls.target.clone(), toT: target, fromP: R.camera.position.clone(), toP: pos };
}
function focusOn(x, z, zoom = null) {
  const off = R.camera.position.clone().sub(R.controls.target);
  if (zoom) off.setLength(zoom);
  const toT = new THREE.Vector3(x, 0, z);
  R.camAnim = { t: 0, fromT: R.controls.target.clone(), toT, fromP: R.camera.position.clone(), toP: toT.clone().add(off) };
}

// ---------- outdoor ----------
function canvasTexture(w, h, draw, repeat = null) {
  const c = makeCanvas(w, h); draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function buildOutdoor() {
  const grass = canvasTexture(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#9ed27c'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { ctx.fillStyle = Math.random() < 0.5 ? '#93c972' : '#a9da88'; ctx.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
    for (let i = 0; i < 25; i++) { ctx.fillStyle = ['#ffffff', '#ffe066', '#ff9eb5'][i % 3]; ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, 2.2, 0, 7); ctx.fill(); }
  }, [80, 80]);
  const ground = mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: grass, roughness: 1 }), false);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.03; ground.receiveShadow = true;
  R.outdoor.add(ground);
  // road
  const roadTex = canvasTexture(256, 64, (ctx, w, h) => {
    ctx.fillStyle = '#5f6b78'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff'; for (let x = 0; x < w; x += 64) ctx.fillRect(x + 8, h / 2 - 2, 34, 4);
    ctx.fillStyle = '#d9dde2'; ctx.fillRect(0, 0, w, 5); ctx.fillRect(0, h - 5, w, 5);
  }, [60, 1]);
  R.road = mesh(new THREE.PlaneGeometry(500, 6.5), new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.9 }), false);
  R.road.rotation.x = -Math.PI / 2; R.road.position.y = -0.015; R.road.receiveShadow = true;
  R.outdoor.add(R.road);
  R.walkway = mesh(new THREE.PlaneGeometry(1.6, 1), mat('#e9e2d4', { rough: 1 }), false);
  R.walkway.rotation.x = -Math.PI / 2; R.walkway.position.y = -0.012; R.walkway.receiveShadow = true;
  R.outdoor.add(R.walkway);
  // trees
  for (let i = 0; i < 110; i++) {
    const t = new THREE.Group();
    const s = rand(0.8, 1.5);
    t.add(at(cyl(0.12 * s, 0.16 * s, 1.2 * s, '#8d6748', 8), 0, 0.6 * s, 0));
    const kind = Math.random();
    const leaf = pick(['#5fc45f', '#4cb84c', '#7fd36e', '#3fae6a', '#94d66a']);
    if (kind < 0.5) { t.add(at(sph(0.9 * s, leaf, undefined, 12), 0, 1.7 * s, 0)); t.add(at(sph(0.6 * s, shade(leaf, 0.1), undefined, 10), 0.4 * s, 2.2 * s, 0.2 * s)); }
    else { const cone = mesh(geo('treecone', () => new THREE.ConeGeometry(0.9, 2.2, 10)), mat(shade(leaf, -0.1))); cone.scale.setScalar(s); at(cone, 0, 2.1 * s, 0); t.add(cone); }
    let x, z;
    do { x = rand(-75, 85); z = rand(-70, 80); } while (Math.abs(x - 6) < 30 && Math.abs(z - 4) < 26);
    t.position.set(x, 0, z); t.rotation.y = rand(0, 6);
    R.trees.push(t);
  }
  R.treeGroup = new THREE.Group(); R.outdoor.add(R.treeGroup);
  // clouds
  for (let i = 0; i < 10; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 5; k++) { const p = sph(rand(1.4, 2.6), mat('#ffffff', { rough: 1 }), undefined, 12); p.castShadow = false; p.position.set(k * 1.6 - 3, rand(-0.3, 0.6), rand(-1, 1)); p.scale.y = 0.7; c.add(p); }
    c.position.set(rand(-90, 90), rand(22, 30), rand(-60, 40));
    c.userData.v = rand(0.3, 0.8);
    mergeStatic(c);
    R.outdoor.add(c); R.clouds.push(c);
  }
  // sign
  const signTex = canvasTexture(512, 160, (ctx, w, h) => {
    ctx.fillStyle = '#ffffff'; roundRect(ctx, 0, 0, w, h, 30); ctx.fill();
    ctx.fillStyle = '#7c5cff'; roundRect(ctx, 10, 10, w - 20, h - 20, 24); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 64px Fredoka, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🧬 NGS Fever Labs', w / 2, h / 2 + 4);
  });
  R.sign = new THREE.Group();
  R.sign.add(at(cyl(0.05, 0.05, 1.4, '#9aa6b2', 8), -1.1, 0.7, 0), at(cyl(0.05, 0.05, 1.4, '#9aa6b2', 8), 1.1, 0.7, 0));
  const board = plane(2.6, 0.82, new THREE.MeshBasicMaterial({ map: signTex, side: THREE.DoubleSide, transparent: true }));
  at(board, 0, 1.55, 0); R.sign.add(board);
  R.outdoor.add(R.sign);
  // delivery van
  const van = new THREE.Group();
  van.add(at(rb(3.2, 1.5, 1.6, '#ffffff', 0.15), -0.2, 1.05, 0));
  van.add(at(rb(1.1, 1.1, 1.58, '#ff6fa5', 0.15), 1.75, 0.85, 0));
  van.add(at(bx(0.04, 0.5, 1.3, '#bfe6ff', { rough: 0.1 }), 2.31, 1.05, 0));

function showExpandHandles(on) {
  for (const c of [...R.handles.children]) R.handles.remove(c);
  if (R.expandPreview) { R.scene.remove(R.expandPreview); R.expandPreview = null; }
  if (R.expandTag) { R.expandTag.remove(); R.expandTag = null; }
  if (!on) return;
  const L = S.lab, x0 = L.x0 * GRID, z0 = L.z0 * GRID, W = L.w * GRID, H = L.h * GRID;
  const spots = { N: [x0 + W / 2, z0 - 1.6, Math.PI], S: [x0 + W / 2, z0 + H + 1.6, 0], W: [x0 - 1.6, z0 + H / 2, -Math.PI / 2], E: [x0 + W + 1.6, z0 + H / 2, Math.PI / 2] };
  for (const side in spots) {
    const [x, z, ry] = spots[side];
    const g = new THREE.Group();
    const m = umat('#7c5cff', { emissive: '#7c5cff', ei: 0.3 });
    const cone = new THREE.Mesh(geo('arrowcone', () => new THREE.ConeGeometry(0.55, 0.9, 20)), m);
    cone.rotation.x = Math.PI / 2; cone.position.z = 0.45;
    const shaft = new THREE.Mesh(geo('arrowshaft', () => new THREE.BoxGeometry(0.4, 0.2, 0.9)), m);
    shaft.position.z = -0.35;
    g.add(cone, shaft);
    g.position.set(x, 0.5, z); g.rotation.y = ry;
    g.userData.expand = side; g.userData.mat = m;
    R.handles.add(g);
  }
}

let AC = null;
function sfx(name) {
  if (!S || S.sim || !S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const tone = (f, t0, dur, type = 'sine', vol = 0.06, f2 = null) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, now + t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + t0 + dur);
      g.gain.setValueAtTime(0.0001, now + t0); g.gain.exponentialRampToValueAtTime(vol, now + t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t0 + dur);
      o.connect(g); g.connect(AC.destination); o.start(now + t0); o.stop(now + t0 + dur + 0.02);
    };
    if (name === 'click') tone(880, 0, 0.06, 'triangle', 0.05);
    else if (name === 'place') { tone(523, 0, 0.08, 'triangle'); tone(784, 0.07, 0.12, 'triangle'); }
    else if (name === 'coin') { tone(988, 0, 0.08, 'square', 0.035); tone(1319, 0.08, 0.22, 'square', 0.035); }
    else if (name === 'error') tone(220, 0, 0.25, 'sawtooth', 0.04, 140);
    else if (name === 'ping') tone(1175, 0, 0.12, 'sine', 0.04);
    else if (name === 'chime') { tone(659, 0, 0.12); tone(880, 0.1, 0.18); }
    else if (name === 'whir') tone(300, 0, 0.35, 'triangle', 0.03, 700);
    else if (name === 'fanfare') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.2, 'triangle', 0.05)); }
  } catch { /* audio unavailable */ }
}

function notify(icon, text, kind = '', objId = null, onClick = null) {
  if (!S || S.sim) return;   // simulation-mode labs run silently
  S.log.unshift({ t: S.t, icon, text, kind });
  if (S.log.length > 80) S.log.length = 80;
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + kind + (objId || onClick ? ' click' : '');
  el.innerHTML = `<span class="ti">${icon}</span><span class="tt">${esc(text)}<span class="tdate">${fmtDate(S.t, false)} · ${fmtClock(S.t)}</span></span>`;
  el.addEventListener('click', () => {
    if (onClick) onClick();
    if (objId && S.objects[objId]) { const c = objCenter(S.objects[objId]); focusOn(c.x, c.z); select({ type: 'obj', id: objId }); }
    el.remove();
  });
  box.prepend(el);
  while (box.children.length > 5) box.lastChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, kind === 'bad' ? 9000 : 6500);
}
function confetti() {

  orders() {
    const tab = curTab('orders', 'offers');
    const offers = S.orders.filter(o => o.status === 'offer').sort((a, b) => a.expires - b.expires);
    const act = activeOrders().sort((a, b) => a.due - b.due);
    const hist = S.orders.filter(o => ['delivered', 'cancelled', 'expired', 'declined'].includes(o.status)).sort((a, b) => (b.delivered || b.expires) - (a.delivered || a.expires)).slice(0, 40);
    const tabs = tabsHtml('orders', [['offers', 'Offers', offers.length], ['active', 'Active', act.length], ['history', 'History']]);
    let body = '';
    if (tab === 'offers') {
      let evals = offers.map(o => ({ o, f: bestAssignment(o) }));
      const good = evals.filter(e => offerVerdict(e.f, e.o).cls === 'good').length;
      const keyFn = {
        profit: e => -(e.f && isFinite(e.f.ready) ? e.f.profit : -1e12),
        margin: e => -(e.f && isFinite(e.f.ready) ? e.f.margin : -1e12),
        slack: e => -(e.f && isFinite(e.f.ready) ? e.f.due - e.f.ready : -1e12),
        expiry: e => e.o.expires,
      }[UI.offerSort] || (e => e.o.expires);
      evals.sort((a, b) => keyFn(a) - keyFn(b));
      const keep = e => ['good', 'thin'].includes(offerVerdict(e.f, e.o).cls) && !(e.f && e.f.lateDays > 0);
      const hidden = UI.hideBad ? evals.filter(e => !keep(e)).length : 0;
      if (UI.hideBad) evals = evals.filter(keep);
      body = `<div class="small"><b>${offers.length}</b> offers · <b class="good">${good}</b> profitable · sample storage ${act.length}/${storageCap()} active orders</div>

          <span class="chip ${UI.hideBad ? 'on' : ''}" data-act="hide-bad">Only profitable & on time</span>${dockChip()}</div>
        <div class="list mt">${evals.map(offerCard).join('') || (hidden ? `<p class="muted">${hidden} offer(s) hidden by the filter.</p>` : '<p class="muted">No offers right now — customers send requests during working hours. ⏳</p>')}</div>`;
    } else if (tab === 'active') {
      body = `<div class="row"><span class="small muted grow">Forecasts include the library-prep backlog, sequencer queues and staff hours.</span>${canDock() ? dockChip() : '<button class="btn sm ghost" data-act="open-queue">🗓️ Sequencing queue</button>'}</div><div class="list mt">${act.map(activeCard).join('') || '<p class="muted">No active orders. Accept some offers!</p>'}</div>`;
    } else {
      body = `<div class="list">${hist.map(o => `<div class="item"><div class="title">${orderType(o).icon} ${esc(orderType(o).name)} ×${o.samples} <span class="grow"></span>${o.status === 'delivered' ? `<span class="good">${fmtMoney(o.paid)}</span>` : `<span class="tag ${o.status === 'cancelled' ? 'bad' : ''}">${o.status}</span>`}</div><div class="sub">${customer(o)[0]} ${esc(customer(o)[1])}${o.delivered ? ' · delivered ' + fmtDate(o.delivered, false) + (o.delivered > o.due ? ' (late)' : ' (on time)') : ''}</div></div>`).join('') || '<p class="muted">Nothing yet.</p>'}</div>`;
    }
    return { tabs, body };

    const tables = insts.map(inst => {
      const def = INST[inst.key];
      const rows = [];
      (inst.cslots || []).forEach(rid => { const r = rid !== null && runById(rid); if (r) rows.push(queueRow(r, sch.runs.get(r.id), 'cond')); });
      inst.slots.forEach((rid, i) => { const r = rid !== null && runById(rid); if (r) rows.push(queueRow(r, sch.runs.get(r.id), 'pos ' + (i + 1))); });
      const waiting = waitingRuns(inst.id);
      waiting.filter(r => !r.held).forEach((r, k) => rows.push(queueRow(r, sch.runs.get(r.id), '#' + (k + 1))));
      waiting.filter(r => r.held).forEach(r => rows.push(queueRow(r, sch.runs.get(r.id), '⏸')));
      const coming = activeOrders().filter(o => o.instId === inst.id && o.stage === 'prep');
      if (!rows.length && !coming.length) return '';
      return `<h3 class="row">🧬 ${esc(def.name)} <span class="small muted">${def.duo ? 'duo: conditioning unit + ' : ''}${def.slots} position${def.slots > 1 ? 's' : ''} · ${waiting.length} queued · ${cycleText(def, (waiting[0] || {}).kitIdx || 0)}</span><span class="grow"></span>${waiting.length > 1 ? `<button class="btn sm ghost" data-act="q-sort" data-id="${inst.id}">Sort by deadline</button>` : ''}</h3>
        ${rows.length ? `<div style="overflow-x:auto"><table class="t q"><tr><th></th><th>Orders</th><th>Kit</th><th class="n">Data</th><th>Status</th><th>When</th><th>Due</th><th></th></tr>${rows.join('')}</table></div>` : ''}
        ${coming.length ? `<div class="small muted mt">Libraries in prep for: ${coming.map(o => `${esc(customer(o)[1])} (${o.prepDone}/${o.prepTotal}, ready ~${fmtWhen(prepReadyAt(o))})`).join(' · ')}</div>` : ''}`;

    const prep = S.tasks.filter(t => t.kind === 'prep' || t.kind === 'qc').sort(taskCompare);
    const prepRows = prep.map((t, k) => {
      const o = orderById(t.orderId);

      return `<tr><td>${k + 1}</td><td>${esc(customer(o)[1])}${o.rush ? ' ⚡' : ''}</td><td>${TASK_LABEL[t.kind]}</td><td class="n">${t.n}</td><td>${st}</td><td>${fmtWhen(o.due)}</td><td><button class="btn sm ${o.rush ? 'pink' : 'ghost'}" data-act="rush" data-id="${o.id}" title="Rush this order">⚡</button></td></tr>`;
    }).join('');
    const body = `<div class="row wrap"><span class="small muted bold">Show</span>${[[2, '2 days'], [7, '1 week'], [14, '2 weeks'], [30, '1 month']].map(([d, l]) => `<span class="chip ${UI.qSpan === d ? 'on' : ''}" data-act="qspan" data-v="${d}">${l}</span>`).join('')}
        <span class="grow"></span><span class="chip ${S.settings.edf ? 'on' : ''}" data-act="toggle-edf" title="Queue new runs and library prep by customer deadline">Deadline-first</span><button class="btn sm ghost" data-act="q-sortall">Sort all by deadline</button></div>
      ${pvBox}
      ${noSeq || `${legend}
      <div class="ganttwrap">${ganttSvg(insts, sch)}</div>
      ${selBox}`}
      ${noSeq ? '' : tables || '<p class="muted">Nothing queued. Accepted orders appear here once their libraries are prepped.</p>'}
      <h3>🧪 Library prep & QC queue <span class="small muted">(${prep.length} batch${prep.length === 1 ? '' : 'es'}, in the order staff will pick them up)</span></h3>
      ${prepRows ? `<div style="overflow-x:auto"><table class="t q"><tr><th></th><th>Order</th><th>Step</th><th class="n">Samples</th><th>Status</th><th>Due</th><th></th></tr>${prepRows}</table></div>` : '<p class="muted small">No library prep waiting.</p>'}
      <p class="tiny muted">Each bar is one batch: the hatched part is the platform-specific conditioning, the rest is the sequencing run. On a duo the conditioning unit works on the next batch while the sequencer runs, and a grey line shows a conditioned batch waiting for a free sequencing position. Planned times assume staff load and unload runs during shift hours. ⏫ loads a run next, ▲▼ reorder it, ⏸ holds it until released, ⛔ aborts a running run. ⚡ Rush moves all of an order's prep and runs to the front.</p>`;

  help() {
    return { body: `
      <p><b>NGS Fever</b> is a tiny sequencing-core tycoon. Buy real sequencers (specs from the spreadsheet), wire them up, hire a team and turn customer samples into data — and money.</p>
      <h3>The pipeline</h3>
      <p>📋 <b>Accept</b> an order → 🧪 staff <b>prep libraries</b> on a thermal cycler / robot → 🔬 <b>QC</b> (optional but failures triple without it) → 🧬 <b>assign</b> a compatible sequencer, staff <b>load</b> a batch → ⏳ <b>platform-specific conditioning</b> (DNB making, templating, Xpandomer synthesis…) → 🧬 the kit's real <b>run time</b> → 📤 <b>unload</b> → 💻 <b>analysis</b> (server rack or paid cloud) → 💰 <b>delivered</b>.</p>
      <p>⏳ <b>Conditioning</b> times come from the sheet's <i>Platform-specific conditioning</i> column: 30 min on Illumina, 4 h on MGI, 7 h on the Roche Axelios, 13 h for Ion Torrent templating. A single instrument conditions and sequences a batch in the same position, one after the other. A <b>duo</b> system (e.g. the Axelios 1) has two units: the left one conditions the next batch while the right one sequences the current one, so a batch finishes every max(conditioning, run) hours instead of conditioning + run. Progress bars show conditioning hatched and sequencing solid.</p>
      <p>Each order needs Gb of data with a read length/Q-score requirement. The game picks the cheapest kit that fits; you can pick another. Reagent cost per run comes from the sheet — a 30× genome on a MiSeq costs a fortune, on a NovaSeq X 25B about $100. Choose wisely!</p>
      <p>📋 Each offer shows a verdict: expected profit and margin after reagents, prep and cloud costs, plus when it would be ready given your prep backlog, sequencer queues and staff hours. Late delivery costs 5% per day and reputation.</p>
      <p>🗓️ <b>Sequencing queue:</b> a Gantt chart of every sequencer position. Load a run next ⏫, reorder ▲▼, hold ⏸ or abort ⛔ it, or ⚡ rush a whole order. With <i>Deadline-first</i> on, new runs and library prep are queued by customer deadline. On a wide screen the queue opens beside 📋 Orders (<i>Queue alongside</i>): press 🗓️ <b>Preview</b> on an offer, or 🗓️ next to a sequencer and kit under <i>Compare options</i>, to see its runs as dashed bars in the queue before you accept.</p>
      <p>🤖 <b>Lab kit:</b> besides the manual thermal cycler, the shop lists the library-prep and QC instruments from the sheet's <i>NGSLibraryPrep</i> worksheet. Liquid handlers prep faster and need an operator only to set each batch up (hands-on %), then finish on their own, even overnight; walk-away NGS systems need almost no one. QC devices differ in how many run failures they prevent and how fast they are. Shearing, size-selection and clean-up instruments, robot arms and stocked kits give lab-wide bonuses to the libraries they suit (short-read DNA, long reads, RNA). Use the tabs, chips and sliders to narrow the list.</p>
      <p>🧩 <b>Multiplexing:</b> orders on the same sequencer and kit share queued flowcells, so small jobs can ride along for free. Turn on <i>Wait to fill flowcells</i> on an instrument to hold under-filled runs for up to ${HOLD_HOURS} h.</p>

// ======================= Lab kit shop (built-ins + the sheet's NGSLibraryPrep worksheet) =======================
const labPriceFromSlider = v => (v >= 100 ? Infinity : Math.round(1000 * Math.pow(10, v / 100 * 2.6)));   // $1K … $400K
const pct = x => Math.round(x * 100) + '%';
// What an item does in the game, as {short: one line for cards, long: sentences for the specs panel}.
function labEffect(d) {
  const lib = b => LIB_LABEL[b.on || 'all'];
  if (d.role === 'prep') {
    const auto = (d.handsOn ?? 1) < 1;
    return { short: `Library prep ${d.speed}× · ${pct(d.handsOn ?? 1)} hands-on`,
      long: `Library-prep station, ${d.speed}× the speed of a manual thermal cycler. ${auto ? `An operator sets each batch up (${pct(d.handsOn)} of its time), then it finishes on its own, nights included.` : 'An operator works at it for the whole batch.'}${d.bsl ? ' Required for infectious samples.' : ''}` };
  }
  if (d.role === 'qc') {
    const f = d.qcFactor;
    return { short: `QC: −${pct(1 - f)} run failures · ${d.speed}× speed${d.qcLong ? ` · long reads −${pct(1 - d.qcLong)}` : ''}`,
      long: `Library QC device. Orders checked on it have ${pct(1 - f)} fewer failed runs${d.qcLong ? ` (${pct(1 - d.qcLong)} fewer for long-read libraries)` : ''}; QC runs at ${d.speed}× speed. Each order counts its weakest QC.` };
  }
  if (d.boost) {
    const b = d.boost, bits = [];
    if (b.prep) bits.push(`+${pct(b.prep)} prep speed`);
    if (b.fail) bits.push(`−${pct(1 - b.fail)} run failures`);
    if (b.handsOn) bits.push(`−${pct(1 - b.handsOn)} hands-on time on automated prep stations`);
    const txt = bits.join(', ') + (b.handsOn ? '' : ` for ${lib(b)}`);
    return { short: txt.charAt(0).toUpperCase() + txt.slice(1),
      long: `Lab-wide bonus while it is ${d.kind === 'kit' ? 'stocked' : 'plugged in'}: ${txt}. Only the best ${LAB_KINDS[d.kind]?.name.toLowerCase() || 'one'} of this family counts; different families add up.` };
  }
  return { short: d.desc || '', long: d.desc || '' };
}
function labSheetPrice(x) {
  if (!x || x.priceEst) return '';
  return x.priceLo && x.priceHi && x.priceLo !== x.priceHi ? `${fmtMoney(x.priceLo)}–${fmtMoney(x.priceHi)}` : fmtMoney(x.priceLo || x.priceHi);
}
function labItems(tab) {
  if (tab === 'kits') return Object.values(KITS).map(k => ({ key: k.id, d: k, kit: true }));
  return Object.entries(EQUIP).filter(([, d]) => d.cat === 'equipment' && !d.hidden && (d.group || 'basics') === tab
    && (d.sheet?.status !== 'discontinued' || S.settings.showDiscontinued)).map(([key, d]) => ({ key, d }));
}

      <span class="grow"></span><span class="small muted" data-count>${list.length} of ${all.length}</span></div>`;
  const cards = list.map(({ key, d, kit }) => {
