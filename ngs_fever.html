// ======================= run progress bars =======================
// How far batch r is through one position. unit: 'both' (single instrument: conditioning then sequencing in the same
// position), 'cond' (a duo's conditioning unit) or 'seq' (a duo's sequencing unit).
function runProgress(r, def, unit) {
  const cH = condHours(def, r.kitIdx), sH = seqHours(def, r.kitIdx);
  const total = unit === 'cond' ? cH : unit === 'seq' ? sH : cH + sH;
  const cf = unit === 'cond' ? 1 : unit === 'seq' ? 0 : cH / Math.max(1e-9, total);
  let done = 0, left = total, text = '';
  if (r.status === 'queued') text = 'waiting for an operator to load it';
  else if (r.status === 'conditioning') {
    done = (S.t - r.cStart) / Math.max(1e-9, total);
    left = r.cEnd - S.t + (unit === 'both' ? sH : 0);
    text = `conditioning ${Math.round(clamp((S.t - r.cStart) / Math.max(1e-9, cH), 0, 1) * 100)}%` + (unit === 'cond' ? '' : `, then ${fmtHours(sH)} run`);
  } else if (r.status === 'conditioned') { done = 1; left = 0; text = 'conditioned — waiting for a free sequencing position'; }
  else if (r.status === 'running') {
    done = (unit === 'both' ? cH + S.t - r.start : S.t - r.start) / Math.max(1e-9, total);
    left = r.end - S.t;
    text = `sequencing ${Math.round(clamp((S.t - r.start) / Math.max(1e-9, r.end - r.start), 0, 1) * 100)}%`;
  } else if (r.status === 'done') { done = 1; left = 0; text = 'finished — waiting to be unloaded'; }
  done = clamp(done, 0, 1);
  return { done, cf, left: Math.max(0, left), text, end: S.t + Math.max(0, left), cH, sH };
}
function progressBar(pr, cls = '') {
  const c = Math.min(pr.done, pr.cf), s = Math.max(0, pr.done - pr.cf);
  return `<div class="pbar ${cls}"><i class="pc" style="width:${(pr.cf * 100).toFixed(1)}%"></i><b class="fc" style="width:${(c * 100).toFixed(1)}%"></b><b class="fs" style="left:${(pr.cf * 100).toFixed(1)}%;width:${(s * 100).toFixed(1)}%"></b></div>`;
}

// Short phrase for hover tooltips and labels: the active batch that ends soonest.

// ======================= sequencing queue (Gantt) =======================
const RUN_STATUS = { running: 'Sequencing', conditioning: 'Conditioning the sample', conditioned: 'Conditioned — waiting for a free sequencing position', queued: 'Loading — waiting for an operator', done: 'Finished — waiting to be unloaded', waiting: 'Planned', held: 'On hold' };

      if (def.duo) add('c' + b.cslot, [ghost, b, 'cond']);
      add('s' + b.slot, [ghost, b, def.duo ? 'seq' : 'both']);
    }
    rows.push({ head: true, inst });
    const keys = [...byRow.keys()].sort((a, b) => (a[0] === b[0] ? +a.slice(1) - +b.slice(1) : a[0] === 'c' ? -1 : 1));
    if (!keys.length) rows.push({ inst, key: null, bars: [] });

    <pattern id="ghatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" fill="rgba(42,120,214,.4)"/></pattern></defs>`];

// ======================= finance chart =======================
function drawFinanceChart() {
  const cv = document.getElementById('fin-chart');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const pts = S.history.length > 1 ? S.history : [{ t: S.t - 24, money: S.money, nw: netWorth() }, { t: S.t, money: S.money, nw: netWorth() }];
  const step = Math.max(1, Math.floor(pts.length / 300));
  const data = pts.filter((_, i) => i % step === 0 || i === pts.length - 1).map(p => ({ t: p.t, a: p.money, b: p.nw ?? p.money }));
  const vals = data.flatMap(d => [d.a, d.b]);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals);
  if (hi - lo < 1) hi = lo + 1;
  const niceStep = (r) => { const e = Math.pow(10, Math.floor(Math.log10(r / 4))); return [1, 2, 2.5, 5, 10].map(m => m * e).find(s => r / s <= 5); };
  const st = niceStep(hi - lo); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const L = 52, Rr = 64, T = 8, B = 22;
  const x = t => L + (t - data[0].t) / Math.max(1, data[data.length - 1].t - data[0].t) * (W - L - Rr);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  ctx.font = '600 11px Nunito, sans-serif'; ctx.fillStyle = '#6c7d92'; ctx.strokeStyle = '#e8edf3'; ctx.lineWidth = 1;
  for (let v = lo; v <= hi + 1e-6; v += st) {
    ctx.beginPath(); ctx.moveTo(L, Math.round(y(v)) + 0.5); ctx.lineTo(W - Rr, Math.round(y(v)) + 0.5); ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(fmtMoney(v), L - 6, y(v));
  }
  if (lo < 0) { ctx.strokeStyle = '#b8c4d2'; ctx.beginPath(); ctx.moveTo(L, Math.round(y(0)) + 0.5); ctx.lineTo(W - Rr, Math.round(y(0)) + 0.5); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const t0 = data[0].t, t1 = data[data.length - 1].t;
  const short = t1 - t0 < 24 * 75;
  for (let k = 0; k <= 3; k++) { const t = t0 + (t1 - t0) * k / 3; const lbl = short ? fmtDate(t, false).replace(/ \d{4}$/, '') : fmtDate(t, false).replace(/^\d+ /, ''); ctx.fillText(lbl, clamp(x(t), L + 20, W - Rr - 20), H - B + 6); }
  const line = (key, col) => { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = ctx.lineCap = 'round'; ctx.beginPath(); data.forEach((d, i) => i ? ctx.lineTo(x(d.t), y(d[key])) : ctx.moveTo(x(d.t), y(d[key]))); ctx.stroke(); };
  line('b', '#eb6834'); line('a', '#2a78d6');
  const last = data[data.length - 1];
  const ends = [[last.a, '#2a78d6', 'Balance'], [last.b, '#eb6834', 'Net worth']];
  for (const [v, col] of ends) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x(last.t), y(v), 6, 0, 7); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x(last.t), y(v), 4, 0, 7); ctx.fill(); }
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#26354a';
  const ya = y(last.a), yb = y(last.b);
  if (Math.abs(ya - yb) > 12) { ctx.fillText(fmtMoney(last.a), x(last.t) + 8, ya); ctx.fillText(fmtMoney(last.b), x(last.t) + 8, yb); }
  else ctx.fillText(fmtMoney(last.b), x(last.t) + 8, Math.min(ya, yb) - 2);
  // hover crosshair + tooltip over a cached copy of the static chart
  const base = ctx.getImageData(0, 0, cv.width, cv.height);
  const tip = document.getElementById('fin-tip');
  cv.onmousemove = (e) => {
    const mx = e.clientX - cv.getBoundingClientRect().left;
    let best = data[0];
    for (const d of data) if (Math.abs(x(d.t) - mx) < Math.abs(x(best.t) - mx)) best = d;
    ctx.putImageData(base, 0, 0);
    const bx0 = Math.round(x(best.t)) + 0.5;
    ctx.strokeStyle = '#9aa6b2'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx0, T); ctx.lineTo(bx0, H - B); ctx.stroke();
    for (const [v, col] of [[best.a, '#2a78d6'], [best.b, '#eb6834']]) {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x(best.t), y(v), 6, 0, 7); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x(best.t), y(v), 4, 0, 7); ctx.fill();
    }
    tip.classList.remove('hidden');
    tip.innerHTML = `${fmtDate(best.t, false)}<br><span style="color:#9cc4f2">■</span> Balance ${fmtMoney(best.a)}<br><span style="color:#f5a684">■</span> Net worth ${fmtMoney(best.b)}`;
    tip.style.left = clamp(x(best.t) + 10, 0, W - 150) + 'px'; tip.style.top = '6px';
  };
  cv.onmouseleave = () => { tip.classList.add('hidden'); ctx.putImageData(base, 0, 0); };
}

// ======================= event wiring =======================
function wireUI() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  window.addEventListener('pointerup', () => { UI.pointerInPanel = false; });
  window.addEventListener('resize', () => { if (UI.panel) renderPanel(true); });
  for (const panel of [$('#panel'), $('#dock')]) {
  panel.addEventListener('pointerdown', () => { UI.pointerInPanel = true; });
  // Don't rebuild a panel under the cursor: buttons would jump and hover tooltips vanish.
  panel.addEventListener('mouseenter', () => { UI.hoverPanel = true; });
  panel.addEventListener('mouseleave', () => { UI.hoverPanel = false; $('#ptip').classList.add('hidden'); });
  panel.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-tip]');
    const tip = $('#ptip');
    if (!el) { tip.classList.add('hidden'); return; }
    const [first, ...rest] = el.dataset.tip.split('|');
    tip.innerHTML = esc(first) + rest.map(l => `<div class="tt-sub">${esc(l)}</div>`).join('');
    tip.classList.remove('hidden');
    tip.style.left = Math.min(e.clientX, window.innerWidth - 280) + 'px'; tip.style.top = e.clientY + 'px';
  });
  }
  const insp = $('#inspector');
  insp.addEventListener('mouseenter', () => { UI.hoverInsp = true; });
  insp.addEventListener('mouseleave', () => { UI.hoverInsp = false; });
}

function onInput(e) {

    const k = t.dataset.labf;
    UI.lab[k] = k === 'sort' || k === 'vendor' ? t.value : +t.value;
    renderPanel();
    const again = document.querySelector(`[data-labf="${k}"]`); if (again && k !== 'sort' && k !== 'vendor') again.focus();
  } else if (t.dataset.filter) {
    const k = t.dataset.filter;
    UI.filters[k] = k === 'sort' ? t.value : +t.value;
    renderPanel();
    const again = document.querySelector(`[data-filter="${k}"]`); if (again && k !== 'sort') again.focus();
  } else if (t.dataset.slider) {
    const k = t.dataset.slider, def = SLIDERS.find(s => s.key === k);
    S.settings[k] = +t.value;
    const lab = document.getElementById('sv-' + k); if (lab) lab.textContent = def.fmt(+t.value);
  } else if (t.dataset.ng) {
    const k = t.dataset.ng;
    if (k === 'year') { NEWGAME.year = +t.value; document.getElementById('ng-year').textContent = t.value; return; }
    NEWGAME.custom = NEWGAME.custom || makeSettings(NEWGAME.diff);
    NEWGAME.custom[k] = +t.value;
    const def = SLIDERS.find(s => s.key === k);
    document.getElementById('ng-' + k).textContent = def.fmt(+t.value);
  }
}

    fr.readAsText(e.target.files[0]);

}

// ===== 55_simmode.js =====
// Simulation mode: set up two labs side by side (sequencers, lab kit, staff), feed both the same stream of customer
// orders and compare the money they make. Each lab runs the real game simulation without the 3D view or toasts.
// Decisions are automatic: offers are accepted by a policy, go to the best sequencer and kit, queues run deadline-first.

const SIM_KEY = 'ngsfever.sim.v1';
const SIM_COLORS = ['#2a78d6', '#eb6834'];         // Lab A, Lab B
const SIM_STEP = 0.1;                                // game hours per step, as in the game

const SIM_YEAR = new Date().getUTCFullYear();

// Orders per month for each type, in proportion to how often they turn up in the game.
function simMixOf(types, ids, total) {
  const w = types.filter(t => ids.includes(t.id)).reduce((a, t) => a + t.w, 0);
  return Object.fromEntries(types.map(t => [t.id, ids.includes(t.id) ? Math.round(total * t.w / w * 2) / 2 : 0]));
}

// Preferential reagent pricing: own at least `min` of an instrument (or of a vendor's instruments) and its reagents

const SIM_DEAL_LABS = { both: 'Both labs', 0: 'Lab A only', 1: 'Lab B only' };
function simDefaultDeals() { return INST.novaseqxplus ? [{ target: 'inst:novaseqxplus', min: 5, pct: 50, labs: 'both' }] : []; }
const simVendors = () => [...new Set(NGS_DATA.instruments.map(d => d.vendor))];
function simDealOk(x) {

// Reagent price factor for each sequencer model in a lab (best deal it qualifies for; deals do not stack).
function simReagentF(lab, li, c) {
  const out = {}, own = lab.inst;
  const byVendor = v => Object.entries(own).reduce((a, [k, n]) => a + (INST[k].vendor === v ? n : 0), 0);
  for (const k of Object.keys(own)) {
    let pct = 0;
    for (const x of c.deals) {
      if (x.labs !== 'both' && +x.labs !== li) continue;
      const [kind, id] = x.target.split(':');
      const have = kind === 'inst' ? (id === k ? own[k] : 0) : (INST[k].vendor === id ? byVendor(id) : 0);
      if (have && have >= x.min) pct = Math.max(pct, x.pct);
    }
    if (pct) out[k] = 1 - pct / 100;
  }
  return out;
}

// Drop sequencers and kit the spreadsheet no longer has (configs are kept in this browser between builds).
function simClean(c) {
  for (const [i, lab] of c.labs.entries()) {
    lab.name = String(lab.name || (i ? 'Lab B' : 'Lab A')).slice(0, 30);
    lab.inst = Object.fromEntries(Object.entries(lab.inst || {}).filter(([k, n]) => INST[k] && n > 0));
    lab.equip = Object.fromEntries(Object.entries(lab.equip || {}).filter(([k, n]) => EQUIP[k] && n > 0));
    lab.kits = (lab.kits || []).filter(k => KITS[k]);
    lab.staff = { tech: 0, sci: 0, bfx: 0, ...lab.staff };
    lab.hold = !!lab.hold;
  }
  const seen = new Set();
  c.types = (Array.isArray(c.types) ? c.types : simGameTypes()).map(simTypeClean).filter(t => !seen.has(t.id) && seen.add(t.id));
  c.mix = Object.fromEntries(c.types.map(t => [t.id, clamp(Math.round((+c.mix[t.id] || 0) * 10) / 10, 0, SIM_MIX_MAX)]));
  c.deals = (Array.isArray(c.deals) ? c.deals : simDefaultDeals()).filter(simDealOk).map(x => ({ target: x.target,
    min: clamp(Math.round(+x.min) || 1, 1, 60), pct: clamp(+x.pct || 0, 0, 95), labs: SIM_DEAL_LABS[x.labs] ? String(x.labs) : 'both' }));

}

const simEquipOk = key => EQUIP[key] && !SIM_AUTO.has(key) && !SIM_FREE.has(key) && (EQUIP[key].cat === 'equipment' || key === 'ups');

// ---------- prices & estimates (before running) ----------
const simInstPrice = (def, c) => def.priceK * 1000 * DIFFICULTY[c.econ].instPrice;
function simCapex(lab, c) {
  let sum = 0;
  for (const [k, n] of Object.entries(lab.inst)) sum += simInstPrice(INST[k], c) * n;
  for (const [k, n] of Object.entries(lab.equip)) sum += EQUIP[k].price * n;
  for (const k of lab.kits) sum += KITS[k].price;
  const plan = simPlan(lab);
  sum += plan.items.filter(it => it.key === 'bench').length * EQUIP.bench.price;

}
function simMonthly(lab, c, plan) {
  const d = DIFFICULTY[c.econ];
  const salaries = Object.entries(lab.staff).reduce((a, [r, n]) => a + n * ROLES[r].salary * d.salary / 12, 0);
  const service = Object.entries(lab.inst).reduce((a, [k, n]) => a + n * simInstPrice(INST[k], c) * d.servicePct / 100 / 12, 0);
  const rent = plan.w * plan.h * GRID * GRID * d.rent;

// What this set-up cannot do, given the order mix.
function simWarnings(lab, c) {
  const w = [];
  const kits = Object.keys(lab.inst).flatMap(k => INST[k].kits);
  const equip = Object.keys(lab.equip).map(k => EQUIP[k]);
  const wet = lab.staff.tech + lab.staff.sci;
  if (!kits.length) w.push(['bad', 'No sequencer: every order will be turned away.']);
  if (!equip.some(d => d.role === 'prep')) w.push(['bad', 'No library-prep station (thermal cycler, workstation or biosafety cabinet).']);
  if (!wet) w.push(['bad', 'No lab technician or scientist to prep and load samples.']);
  if (kits.length && !equip.some(d => d.role === 'qc')) w.push(['warn', 'No QC device: runs fail about three times as often.']);
  const cant = c.types.filter(t => c.mix[t.id] > 0 && kits.length && !kits.some(k => kitOk(k, t)));
  if (cant.length) w.push(['warn', `Can't sequence ${cant.map(t => t.name).join(', ')} (${cant.reduce((a, t) => a + c.mix[t.id], 0)} orders/month).`]);
  const bsl = c.types.filter(t => t.bsl && c.mix[t.id] > 0);
  if (bsl.length && !equip.some(d => d.bsl)) w.push(['warn', `${bsl.map(t => t.name).join(', ')} need${bsl.length === 1 ? 's' : ''} a biosafety cabinet.`]);
  if (lab.staff.bfx && !equip.some(d => d.role === 'compute')) w.push(['warn', 'Bioinformaticians halve cloud costs; with a compute server they also double its throughput.']);
  return w;
}

// ---------- automatic lab layout ----------
// Rows of floor-standing kit and lab benches with 1 m aisles between them, a 1 m corridor along the west wall down
// to the door, and the break corner. Benchtop kit is packed onto 2 m benches (two deep for big instruments).
function simPlan(lab) {
  const floor = [], bench = [];
  const add = (kind, key, n) => { const def = kind === 'inst' ? INST[key] : EQUIP[key]; for (let i = 0; i < n; i++) (def.form === 'bench' ? bench : floor).push({ kind, key, def }); };
  for (const [k, n] of Object.entries(lab.inst)) add('inst', k, n);
  for (const [k, n] of Object.entries(lab.equip)) add('equip', k, n);
  for (const k of SIM_FREE) add('equip', k, 1);
  const fit = it => { const { fw, fd } = footprintOf(it.def, 0); return fw >= fd ? { rot: 0, fw, fd } : { rot: 1, fw: fd, fd: fw }; };
  const X0 = 2;
  const all = [...floor, ...bench];
  const area = all.reduce((a, it) => { const f = fit(it); return a + (f.fw + 1) * (f.fd + 2); }, 0);
  const longFloor = Math.max(0, ...floor.map(it => fit(it).fw)), longBench = Math.max(0, ...bench.map(it => Math.ceil(fit(it).fw / 4) * 4));
  const W = clamp(Math.max(X0 + longFloor + 1, X0 + longBench, Math.ceil(Math.sqrt(area * 1.6))), 24, MAX_LAB_CELLS);
  const out = [];
  let z = 2, x = X0, rowD = 0;
  const byDepth = (a, b) => fit(b).fd - fit(a).fd || fit(b).fw - fit(a).fw;
  for (const it of floor.sort(byDepth)) {
    const f = fit(it);
    if (x + f.fw > W) { z += rowD + 2; x = X0; rowD = 0; }
    out.push({ kind: it.kind, key: it.key, cx: x, cz: z, rot: f.rot });
    x += f.fw + 1; rowD = Math.max(rowD, f.fd);
  }
  if (rowD) z += rowD + 2;
  const maxLen = Math.floor((W - X0) / 4) * 4;
  const strips = new Map();
  for (const it of bench.sort(byDepth)) { const d = Math.max(2, Math.ceil(fit(it).fd / 2) * 2); if (!strips.has(d)) strips.set(d, []); strips.get(d).push(it); }
  for (const [depth, items] of strips) {
    let cur = [], len = 0;
    const flush = () => {
      if (!cur.length) return;
      for (let b = 0; b < Math.ceil(len / 4); b++) for (let j = 0; j < depth; j += 2) out.push({ kind: 'equip', key: 'bench', cx: X0 + 4 * b, cz: z + j, rot: 0 });
      for (const c of cur) out.push({ ...c, cz: z });
      z += depth + 2; cur = []; len = 0;
    };
    for (const it of items) {
      const f = fit(it);
      if (len + f.fw > maxLen) flush();
      cur.push({ kind: it.kind, key: it.key, cx: X0 + len, rot: f.rot });
      len += f.fw;
    }
    flush();
  }
  return { items: out, w: W, h: Math.max(18, z + 2) };
}

// ---------- the order stream (the same for both labs) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function simPoisson(lambda, rng) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= rng(); } while (p > L);
  return k - 1;
}
const simEndT = months => (Date.UTC(SIM_YEAR, months, 1) - Date.UTC(SIM_YEAR, 0, 1)) / 3600e3;
// Customers send orders in working hours; each type arrives at its own rate. Prices and deadlines follow the game's
// rules for a lab with an average (3★) reputation.
function simOrderStream(c, seed) {
  const rng = mulberry32(seed * 7919 + 17);
  const d = DIFFICULTY[c.econ], end = simEndT(c.months), sizeF = SIM_SIZES[c.size][1];
  const priceF = d.orderPrice * c.orderPrice, dlF = d.deadline * c.deadline;
  const types = c.types.filter(t => c.mix[t.id] > 0);
  const out = [];
  for (let h = 0; h < end; h++) {
    const dt = new Date(Date.UTC(SIM_YEAR, 0, 1) + h * 3600e3), hod = dt.getUTCHours(), dow = dt.getUTCDay();
    if (hod < 8 || hod >= 18 || dow === 0 || dow === 6) continue;
    if ((dt.getUTCMonth() === 0 && dt.getUTCDate() === 1) || (dt.getUTCMonth() === 11 && dt.getUTCDate() === 25)) continue;
    for (const t of types) {
      for (let n = simPoisson(c.mix[t.id] / SIM_WORK_HOURS, rng); n > 0; n--) {
        const u = Math.min(1, Math.pow(rng(), 1.5) * sizeF);
        let samples = Math.round(lerp(t.samples[0], t.samples[1], u));
        if (samples > 24) samples = Math.round(samples / 8) * 8;
        const pps = lerp(t.price[0], t.price[1], rng()) * priceF;
        out.push({ h: h + 1, type: t.id, cust: Math.floor(rng() * CUSTOMERS.length), samples, price: Math.round(samples * pps / 10) * 10,
          days: Math.max(2, Math.round(t.days * dlF * lerp(0.9, 1.3, rng()))), sampleDays: t.sampleDays ? Math.max(0.25, t.sampleDays * dlF) : 0 });
      }
    }
  }
  out.forEach((o, i) => { o.si = i; });
  return out;
}

// ---------- running one lab (S is that lab while these run) ----------
function simBuildLab(job, c) {
  const lab = c.labs[job.li];
  const settings = { ...makeSettings(c.econ), startCash: 0, loanMax: 0, starter: 'none', startYear: SIM_YEAR,
    autoAssign: true, autoPlug: true, weekendShifts: c.weekend, edf: true, trainOffers: false, sound: false };
  newGame(settings);
  S.sim = { policy: c.policy, stream: job.stream, next: 0, offered: 0, offeredValue: 0, accepted: 0, acceptedValue: 0,
    declined: {}, declinedValue: 0, util: {}, series: [], day: -1, hours: 0,
    types: Object.fromEntries(c.types.map(t => [t.id, t])), reagentF: simReagentF(lab, job.li, c), byType: {}, paid: {},
    projects: {}, open: [], events: [], done: { delivered: 0, onTime: 0, late: 0, cancelled: 0 }, pen: { project: 0, sample: 0 },
    samples: { n: 0, ok: 0, late: 0, cancelled: 0, tat: [] }, tat: [] };
  S.objects = {}; S.orders = []; S.candidates = []; S.history = []; S.log = []; S.ledger = {}; S.money = 0; S.tutorialHidden = true;
  const plan = simPlan(lab);

  for (const it of plan.items) {
    const o = addObjectRaw(it.kind, it.key, it.cx, it.cz, it.rot, SIM_FREE.has(it.key) ? { price: 0 } : {});
    if (o.price) addMoney(-o.price, it.kind === 'inst' ? 'instruments' : 'equipment');
    if (needsPower(o)) o.plug = { socketId: 0, idx: 0 };   // sockets are wired for you
    if (o.kind === 'inst') o.hold = lab.hold;
  }
  rebuildOcc();
  // electrical upgrades and floor space beyond the game's starter lab are paid for, as they would be in the game
  const upgrades = Math.max(0, Math.ceil((peakLoad() - S.lab.powerCap) / 15));
  if (upgrades) { addMoney(-upgrades * settings.upgradeCost, 'construction'); S.lab.powerCap += 15 * upgrades; S.lab.upgrades = upgrades; }
  const extraM2 = Math.max(0, plan.w * plan.h - 24 * 18) * GRID * GRID;
  if (extraM2) addMoney(-Math.round(extraM2 * BUILD_COST_M2), 'construction');
  for (const k of lab.kits) { S.kits[k] = S.t; addMoney(-KITS[k].price, 'kits'); }
  for (const [role, n] of Object.entries(lab.staff)) for (let i = 0; i < n; i++) {
    const cand = makeCandidate(role);
    // average people, so the two labs differ only in their set-up
    cand.traits = { speed: role === 'sci' ? 1.25 : 1, care: role === 'sci' ? 0.7 : 1, stamina: 1 };
    cand.salaryBase = ROLES[role].salary;
    S.candidates.push(cand);
    hireCandidate(cand.id, true);
    addMoney(-Math.round(salaryOf(cand) / 12), 'hiring');
  }
  S.candidates = [];
}

    minQ: t.minQ || 0, bsl: !!t.bsl, price, days, created: S.t, expires: S.t + 48, status: 'offer',
    instId: null, kitIdx: null, accepted: null, due: null, prepTotal: Math.ceil(samples / t.batch), prepDone: 0, qcDone: 0, qcSkipped: 0, qcF: 1,
    gbDone: 0, gbAnalysed: 0, runsDone: 0, cost: 0, paid: 0, warned: false };

// Projects in storage: ordinary active orders plus projects whose samples are still coming in.
const simStored = () => activeOrders().filter(o => !o.parent).length + S.sim.open.length;
// When a project's samples arrive: the first lot now, then on working days (every `shipEvery`) until the last
// sample can still make the project deadline; samples are shared out evenly.
function simShipments(sp, t) {
  const until = S.t + (sp.days - sp.sampleDays) * 24, when = [S.t];
  for (let d = Math.floor(S.t / 24) + 1, k = 0; d * 24 + 9 <= until; d++) {
    const h = d * 24 + 9, dow = new Date(Date.UTC(SIM_YEAR, 0, 1) + h * 3600e3).getUTCDay();
    if (dow === 0 || dow === 6 || isHoliday(h)) continue;
    if (++k % t.shipEvery === 0) when.push(h);
  }
  const n = Math.min(sp.samples, when.length), out = [];
  for (let i = 0; i < n; i++) {
    const at = when[Math.round(i * (when.length - 1) / Math.max(1, n - 1))];
    out.push({ t: at, n: Math.floor(sp.samples * (i + 1) / n) - Math.floor(sp.samples * i / n) });
  }
  return out;
}
// Why the lab would turn this offer down (or '' to take it). Projects with a per-sample deadline are judged on a
// typical shipment: its profit after the late-sample penalty, times the number of shipments.
function simRefusal(o, sp) {
  if (!compatibleInstalled(o)) return 'nosequencer';
  if (simStored() >= storageCap()) return 'storage';
  if (S.sim.policy === 'all') return '';
  if (!sp.sampleDays) {
    const f = bestAssignment(o);
    if (!f || !isFinite(f.ready)) return 'blocked';
    if (f.profit <= 0) return 'loss';
    if (S.sim.policy === 'ontime' && f.lateDays > 0) return 'late';
    return '';
  }

// Called every game hour: offers that arrived are accepted or declined straight away; samples of accepted

  while (sim.next < sim.stream.length && sim.stream[sim.next].h <= S.t + 1e-6) {
    const sp = sim.stream[sim.next++];
    const o = simMakeOrder(sp);
    const bt = sim.byType[o.type] ||= { offered: 0, accepted: 0 };
    sim.offered++; sim.offeredValue += o.price; bt.offered++;
    let why = simRefusal(o, sp);
    if (!why && sp.sampleDays) {

      const p = { id: o.id, si: sp.si, type: sp.type, sp, samples: sp.samples, price: sp.price, billed: 0, accepted: S.t, due: S.t + sp.days * 24,
        ships: simShipments(sp, sim.types[sp.type]), next: 0, left: 0, paid: 0, lastT: 0, cancelled: false };
      sim.projects[p.id] = p; sim.open.push(p);

      const price = last ? p.price - p.billed : Math.round(p.price * sh.n / p.samples);

    if (o.kind !== 'inst') continue;
    let busy = 0;
    for (const rid of o.slots) if (rid !== null && ACTIVE_RUN.has(runById(rid)?.status)) busy++;
    sim.util[o.id] = (sim.util[o.id] || 0) + dt * busy / o.slots.length;

// Swap in a simulated lab's state (and its random numbers), run fn, then put the game back.
function simWith(job, fn) {

// ---------- running the comparison ----------
function simStart() {
  const c = SIMV.cfg;
  if (!Object.values(c.mix).some(v => v > 0)) return;
  const jobs = [];
  for (let rep = 0; rep < c.repeats; rep++) {
    const seed = c.seed + rep, stream = simOrderStream(c, seed);
    for (let li = 0; li < 2; li++) jobs.push({ li, rep, seed, stream, S: null, rng: mulberry32(seed), done: false, summary: null });
  }
  SIMV.run = { jobs, endT: simEndT(c.months), cfg: JSON.parse(JSON.stringify(c)), cancelled: false, t0: performance.now() };
  simRender();
  setTimeout(simPump, 20);
}
function simPump() {
  const run = SIMV.run;
  if (!run) return;
  if (run.cancelled) { SIMV.run = null; simRender(); return; }
  const t0 = performance.now();
  try {
    while (performance.now() - t0 < 50) {
      // advance whichever lab is furthest behind, so both progress bars move together
      const job = run.jobs.filter(j => !j.done).sort((a, b) => (a.S ? a.S.t : -1) - (b.S ? b.S.t : -1))[0];
      if (!job) break;
      simWith(job, () => {
        if (!S) { simBuildLab(job, run.cfg); return; }
        const stop = Math.min(run.endT + 0.5, S.t + 24);
        while (S.t < stop) stepSim(SIM_STEP);
        if (S.t >= run.endT + 0.5) { job.summary = simSummary(job); job.done = true; }
      });
    }
  } catch (err) {
    console.error(err);
    SIMV.run = null; simRender();
    $('#simview .sim-body')?.insertAdjacentHTML('afterbegin', `<div class="errbox">The simulation stopped: ${esc(err.message)}</div>`);
    return;
  }
  if (run.jobs.every(j => j.done)) {
    SIMV.result = simAggregate(run);
    SIMV.runIdx = SIMV.result.n === 1 ? 0 : -1;
    SIMV.run = null; SIMV.view = 'results';
    simRender();
    return;
  }
  simProgress();
  setTimeout(simPump, 0);
}
function simAggregate(run) {
  const n = run.cfg.repeats;
  const labs = [0, 1].map(li => run.jobs.filter(j => j.li === li).sort((a, b) => a.rep - b.rep).map(j => j.summary));
  const wins = [0, 0];
  for (let r = 0; r < n; r++) { const d = labs[1][r].nw - labs[0][r].nw; if (Math.abs(d) >= 1) wins[d > 0 ? 1 : 0]++; }
  // the chart shows the average day by day (every run has the same calendar)
  const series = labs.map(runs => runs[0].series.map((p, i) => [p[0], ...[1, 2].map(k => runs.reduce((a, s) => a + (s.series[i] || s.series[s.series.length - 1])[k], 0) / runs.length)]));
  // each run's orders (type, samples, price), to name the marks on the chart
  const streams = [...Array(n)].map((_, r) => run.jobs.find(j => j.rep === r).stream.map(sp => [sp.type, sp.samples, sp.price]));
  return { cfg: run.cfg, labs, wins, n, series, streams, secs: (performance.now() - run.t0) / 1000 };
}

// Which reagent deals a lab gets (or nearly gets) with its current sequencers.
function simLabDeals(lab, li) {
  const c = SIMV.cfg, f = simReagentF(lab, li, c), out = [];
  for (const [k, x] of Object.entries(f)) out.push(`<div class="small good">💸 ${esc(INST[k].name)} reagents −${Math.round((1 - x) * 100)}%</div>`);
  for (const x of c.deals) {
    if (x.labs !== 'both' && +x.labs !== li) continue;
    const [kind, id] = x.target.split(':');
    const have = Object.entries(lab.inst).reduce((a, [k, n]) => a + (kind === 'inst' ? (k === id ? n : 0) : (INST[k].vendor === id ? n : 0)), 0);
    if (have && have < x.min) out.push(`<div class="tiny muted">💸 ${x.min - have} more ${esc(simDealName(x))} for −${x.pct}% on reagents</div>`);
  }
  return out.join('');
}

// ---------- drawing: results ----------
const simMean = (runs, f) => runs.reduce((a, s) => a + f(s), 0) / runs.length;
function simCell(runs, f, fmt) {
  const m = simMean(runs, f);
  if (runs.length < 2) return fmt(m);
  const v = runs.map(f), lo = Math.min(...v), hi = Math.max(...v);
  return `${fmt(m)}${hi - lo > 1e-9 ? `<div class="tiny muted">${fmt(lo)} – ${fmt(hi)}</div>` : ''}`;
}
function simResultsHtml() {
  const R0 = SIMV.result, c = R0.cfg, [A, B] = R0.labs, names = c.labs.map(l => l.name);
  const nwA = simMean(A, s => s.nw), nwB = simMean(B, s => s.nw), diff = nwB - nwA;
  const tie = Math.abs(diff) < Math.max(1000, 0.01 * Math.max(Math.abs(nwA), Math.abs(nwB)));
  const w = diff > 0 ? 1 : 0;
  const banner = tie ? `<div class="sim-banner"><div class="sim-trophy">🤝</div><div><h2>It's a tie</h2><p>The two labs end within ${fmtMoney(Math.abs(diff))} of each other after ${c.months} months.</p></div></div>`
    : `<div class="sim-banner" style="--lab:${SIM_COLORS[w]}"><div class="sim-trophy">🏆</div><div><h2><span class="sim-swatch" style="background:${SIM_COLORS[w]}"></span> ${esc(names[w])} wins</h2>
      <p><b>${fmtMoney(Math.abs(diff))}</b> more net worth after ${c.months} month${c.months === 1 ? '' : 's'}${R0.n > 1 ? ` (average of ${R0.n} runs; ahead in <b>${R0.wins[w]} of ${R0.n}</b>)` : ''}.</p></div></div>`;
  const pct = x => Math.round(x * 100) + '%';
  const num = x => Math.round(x).toLocaleString('en-US');
  const perSample = [...A, ...B].some(s => s.samples.n > 0);
  const rows = [
    ['Net worth at the end', s => s.nw, fmtMoney, 1, 'Cash plus the depreciated value of everything the lab bought'],
    ['Cash at the end', s => s.money, fmtMoney, 1],
    ['Revenue', s => s.revenue, fmtMoney, 1],
    ['Running costs', s => s.opex, fmtMoney, -1, 'Salaries, rent, service, reagents, prep, power, cloud, repairs, hiring'],
    ['Operating profit', s => s.opProfit, fmtMoney, 1, 'Revenue minus running costs'],
    ['Up-front spend', s => s.capex, fmtMoney, -1, 'Sequencers, lab kit, benches, floor space, electrics, kits'],
    ['Orders received', s => s.offered, num, 0],
    ['Orders accepted', s => s.accepted, num, 1],
    ['Delivered on time', s => s.onTime, num, 1, 'Projects delivered by their project deadline'],
    ['Delivered late', s => s.late, num, -1],
    ['Cancelled (far too late)', s => s.cancelled, num, -1],
    ['Late-delivery penalties', s => s.pen.project + s.pen.sample, fmtMoney, -1, 'Payment lost to late projects and late samples'],
    ...(perSample ? [
      ['Samples within their per-sample deadline', s => s.samples.n ? s.samples.ok / s.samples.n : 0, pct, 1, 'Share of delivered or cancelled samples of projects with a per-sample deadline'],
      ['Per-sample penalties', s => s.pen.sample, fmtMoney, -1, 'Payment lost to samples delivered after their per-sample deadline'],
      ['Average sample turnaround', s => simWMean(s.samples.tat), x => x.toFixed(1) + ' d', -1, 'From a sample arriving to its data being delivered'],
    ] : []),
    ['Average project turnaround', s => simWMean(s.tat.map(x => [x, 1])), x => x.toFixed(1) + ' d', -1, 'From accepting a project to delivering all of it'],
    ['Still in progress at the end', s => s.wip, num, 0, 'Accepted orders not delivered yet (not paid, not counted as revenue)'],
    ['Value of orders turned away', s => s.declinedValue, fmtMoney, -1],
    ['Data sequenced', s => s.gb, fmtGb, 1],
    ['Failed or aborted runs', s => s.runsFailed, num, -1],
    ['Reputation', s => s.rep, x => x.toFixed(1) + '★', 1],
    ['Lab floor area', s => s.area, x => Math.round(x) + ' m²', 0],
  ];
  const kpi = rows.map(([label, f, fmt, dir, tip]) => {
    const a = simMean(A, f), b = simMean(B, f), d = b - a;
    const best = dir && Math.abs(d) > 1e-6 ? ((d > 0) === (dir > 0) ? 1 : 0) : -1;
    const delta = Math.abs(d) < 1e-6 ? '—' : (d > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(d)).replace('−', '');
    return `<tr${tip ? ` title="${esc(tip)}"` : ''}><td>${label}</td><td class="n ${best === 0 ? 'sim-best' : ''}">${simCell(A, f, fmt)}</td><td class="n ${best === 1 ? 'sim-best' : ''}">${simCell(B, f, fmt)}</td><td class="n muted">${delta}</td></tr>`;
  }).join('');
  const cats = Object.keys(LEDGER_CATS).filter(k => [...A, ...B].some(s => s.ledger[k]));

// Weighted mean of [value, weight] pairs.
const simWMean = xs => { const w = xs.reduce((a, x) => a + x[1], 0); return w ? xs.reduce((a, x) => a + x[0] * x[1], 0) / w : 0; };
// Per run: what each lab did with each order (1 taken, 0 turned away) and which projects ended late or cancelled.
function simDecisions(R0, r) {
  return R0.labs.map(runs => {
    const d = { took: new Map(), late: new Set(), cancelled: new Set() };
    for (const e of runs[r].events) {
      if (e[2] < 2) d.took.set(e[1], e[2]); else (e[2] === 2 ? d.late : d.cancelled).add(e[1]);

    return d;
  });
}
// Where the gap in net worth comes from (money category by category, plus what the equipment is still worth),

function simDiffHtml(R0, names) {
  const [A, B] = R0.labs;
  const items = Object.keys(LEDGER_CATS).filter(k => [...A, ...B].some(s => s.ledger[k]))
    .map(k => [LEDGER_CATS[k], simMean(B, s => s.ledger[k] || 0) - simMean(A, s => s.ledger[k] || 0)]);
  items.push(['Equipment value at the end', simMean(B, s => s.assets) - simMean(A, s => s.assets)]);
  const rows = items.filter(x => Math.abs(x[1]) >= 1).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const total = simMean(B, s => s.nw) - simMean(A, s => s.nw);
  const max = Math.max(1, ...rows.map(x => Math.abs(x[1])));
  const who = d => d > 0 ? names[1] : names[0];
  const bar = ([label, d], cls = '') => `<div class="sim-dbar ${cls}" title="${esc(label)}: ${fmtMoney(Math.abs(d))} in favour of ${esc(who(d))}"><span class="sim-dlabel">${esc(label)}</span>
    <span class="sim-dtrack"><b style="${d > 0 ? 'left:50%' : `right:50%`};width:${(Math.abs(d) / max * 50).toFixed(1)}%;background:${SIM_COLORS[d > 0 ? 1 : 0]}"></b></span>
    <span class="sim-dval">${Math.abs(d) < 1 ? '—' : `${fmtMoney(Math.abs(d))} <span class="muted">${esc(who(d))}</span>`}</span></div>`;
  // orders handled differently, averaged over the runs
  const agg = { onlyA: [0, 0], onlyB: [0, 0], both: [0, 0], neither: [0, 0], lateA: 0, lateB: 0, lateOnlyA: 0, lateOnlyB: 0 };
  for (let r = 0; r < R0.n; r++) {
    const [a, b] = simDecisions(R0, r), st = R0.streams[r];
    for (const [si, ta] of a.took) {
      const tb = b.took.get(si), k = ta && tb ? 'both' : ta ? 'onlyA' : tb ? 'onlyB' : 'neither';
      agg[k][0]++; agg[k][1] += st[si][2];
    }
    const badA = new Set([...a.late, ...a.cancelled]), badB = new Set([...b.late, ...b.cancelled]);
    agg.lateA += badA.size; agg.lateB += badB.size;
    agg.lateOnlyA += [...badA].filter(si => !badB.has(si) && b.took.get(si)).length;
    agg.lateOnlyB += [...badB].filter(si => !badA.has(si) && a.took.get(si)).length;

  const n = R0.n, f1 = x => String(Math.round(x / n * 10) / 10), fm = x => fmtMoney(x / n);
  const top = rows.slice(0, 3).map(([l, d]) => `${l.toLowerCase()} (${fmtMoney(Math.abs(d))} for ${esc(who(d))})`).join(', ');
  return `<section class="sim-card mt2"><h2>🔍 What made the difference</h2>
    <p class="small">${Math.abs(total) < 1 ? 'The two labs end level.' : `<b>${esc(who(total))}</b> ends ${fmtMoney(Math.abs(total))} ahead${R0.n > 1 ? ' on average' : ''}. Biggest gaps: ${top}.`}</p>
    <div class="sim-dbars">${rows.map(x => bar(x)).join('')}${bar(['Net worth', total], 'total')}</div>
    <div class="tiny muted">Each bar is one money category: how much better off it leaves the lab it points to. They add up to the net worth gap. Spending shows here too: a lab that bought more pays more up front but keeps more equipment value.</div>
    <div class="sim-two mt">
      <div><h3>🤝 Orders handled differently</h3><ul class="sim-list">
        <li>Only <b>${esc(names[0])}</b> took <b>${f1(agg.onlyA[0])}</b> (${fm(agg.onlyA[1])})</li>
        <li>Only <b>${esc(names[1])}</b> took <b>${f1(agg.onlyB[0])}</b> (${fm(agg.onlyB[1])})</li>
        <li>Both took ${f1(agg.both[0])} (${fm(agg.both[1])}); neither took ${f1(agg.neither[0])} (${fm(agg.neither[1])})</li></ul></div>
      <div><h3>⏰ Late or cancelled projects</h3><ul class="sim-list">
        <li><b>${esc(names[0])}</b>: ${f1(agg.lateA)}${agg.lateOnlyA ? `, of which ${f1(agg.lateOnlyA)} the other lab delivered on time` : ''}; penalties ${fmtMoney(simMean(A, s => s.pen.project + s.pen.sample))}</li>
        <li><b>${esc(names[1])}</b>: ${f1(agg.lateB)}${agg.lateOnlyB ? `, of which ${f1(agg.lateOnlyB)} the other lab delivered on time` : ''}; penalties ${fmtMoney(simMean(B, s => s.pen.project + s.pen.sample))}</li></ul></div>
    </div>${R0.n > 1 ? '<div class="tiny muted">Counts and amounts are averages per run.</div>' : ''}</section>`;
}
// Line chart of the two labs' net worth (or cash), with marks for the orders of one run and a hover read-out.
function simChartSvg() {
  const R0 = SIMV.result, k = SIMV.metric === 'nw' ? 2 : 1, names = R0.cfg.labs.map(l => l.name), r = SIMV.runIdx;
  const W = 900, H = 320, L = 70, Rm = 120, T = 14, Bm = 28;
  const ser = (r >= 0 ? R0.labs.map(runs => runs[r].series) : R0.series).map(s => s.map(p => [p[0], p[k]]));
  const xs = ser[0].map(p => p[0]), x0 = xs[0], x1 = xs[xs.length - 1];
  let lo = Math.min(0, ...ser.flat().map(p => p[1])), hi = Math.max(0, ...ser.flat().map(p => p[1]));
  if (hi - lo < 1) hi = lo + 1;
  const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4))), m = (hi - lo) / 4 / step;
  const tick = step * (m > 5 ? 10 : m > 2 ? 5 : m > 1 ? 2 : 1);
  lo = Math.floor(lo / tick) * tick; hi = Math.ceil(hi / tick) * tick;
  const X = t => L + (t - x0) / Math.max(1, x1 - x0) * (W - L - Rm), Y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const g = [];
  for (let v = lo; v <= hi + 1e-6; v += tick) g.push(`<line x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="${Math.abs(v) < 1e-6 ? '#c3c2b7' : '#e1e0d9'}" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmtMoney(v)}</text>`);
  for (let mth = 0; mth <= R0.cfg.months; mth++) {
    const t = (Date.UTC(SIM_YEAR, mth, 1) - Date.UTC(SIM_YEAR, 0, 1)) / 3600e3;
    if (t < x0 - 24 || t > x1 + 1) continue;
    const every = R0.cfg.months > 12 ? 3 : 1;
    if (mth % every === 0) g.push(`<text x="${X(Math.max(t, x0))}" y="${H - 8}" text-anchor="middle">${MONTHS[mth % 12]}${mth % 12 === 0 && mth ? " '" + String(SIM_YEAR + mth / 12).slice(2) : ''}</text>`);
  }
  // end labels, nudged apart when the lines finish close together
  const ends = ser.map((s, i) => ({ i, y: Y(s[s.length - 1][1]), v: s[s.length - 1][1] }));
  if (Math.abs(ends[0].y - ends[1].y) < 30) { const mid = (ends[0].y + ends[1].y) / 2, up = ends[0].y <= ends[1].y ? 0 : 1; ends[up].y = mid - 15; ends[1 - up].y = mid + 15; }
  ser.forEach((s, i) => g.push(`<polyline fill="none" stroke="${SIM_COLORS[i]}" stroke-width="2" stroke-linejoin="round" points="${s.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>`));
  // the value of a line at any hour (the series is daily)
  const at = (s, t) => {
    let j = 1;
    while (j < s.length - 1 && s[j][0] < t) j++;
    const [ta, va] = s[j - 1], [tb, vb] = s[j];
    return tb > ta ? va + (vb - va) * clamp((t - ta) / (tb - ta), 0, 1) : vb;
  };
  const events = [[], []];
  if (r >= 0) {
    const dec = simDecisions(R0, r), mk = SIMV.marks;
    R0.labs.forEach((runs, li) => {
      const other = dec[1 - li];
      for (const e of runs[r].events) {
        const kind = e[2];
        if (kind === 1 && !mk.ok || kind === 0 && !mk.no || kind >= 2 && !mk.late) continue;
        if (mk.diff && (kind < 2 ? other.took.get(e[1]) === kind : (kind === 2 ? other.late : other.cancelled).has(e[1]))) continue;
        const x = X(e[0]).toFixed(1), y = Y(at(ser[li], e[0])).toFixed(1), c = SIM_COLORS[li];
        g.push(kind === 1 ? `<circle cx="${x}" cy="${y}" r="4" fill="${c}" stroke="#fff" stroke-width="1.5"/>`
          : kind === 0 ? `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="${c}" stroke-width="1.5"/>`
          : kind === 2 ? `<path d="M${x - 5},${y - 9}h10l-5,7z" fill="${c}" stroke="#fff" stroke-width="1.2"/>`
          : `<path d="M${x - 4},${y - 4}l8,8M${x - 4},${y + 4}l8,-8" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>`);

  g.push(`<line id="sim-cross" x1="0" x2="0" y1="${T}" y2="${H - Bm}" stroke="#26354a" stroke-width="1" visibility="hidden"/>`);
  ser.forEach((s, i) => g.push(`<circle id="sim-dot${i}" r="4.5" fill="${SIM_COLORS[i]}" stroke="#fff" stroke-width="2" visibility="hidden"/>`));
  g.push(`<rect id="sim-hit" x="${L}" y="${T}" width="${W - L - Rm}" height="${H - T - Bm}" fill="transparent"/>`);
  SIMV.chart = { X, Y, ser, xs, names, events, stream: r >= 0 ? R0.streams[r] : null, types: Object.fromEntries(R0.cfg.types.map(t => [t.id, t])) };

// What happened on one day of the shown run: each order that arrived with what both labs did, and late projects.
function simDayEvents(ch, t0) {

  const offers = new Map(), bad = [];
  ch.events.forEach((evs, li) => evs.filter(day).forEach(e => {

  }));

function simWireChart() {
  const svg = document.querySelector('#sim-chart svg'), ch = SIMV.chart;
  if (!svg || !ch) return;
  const hit = svg.querySelector('#sim-hit'), cross = svg.querySelector('#sim-cross'), tip = $('#ptip');
  const hide = () => { cross.setAttribute('visibility', 'hidden'); ch.ser.forEach((_, i) => svg.querySelector('#sim-dot' + i).setAttribute('visibility', 'hidden')); tip.classList.add('hidden'); };

  if (mode === 'expand') { showExpandHandles(true); hint(`🏗️ <b>Expand the lab</b><span class="hint-how">${tapWord()} an arrow to add a 2 m strip on that side</span>`, ['done']); }
  else if (mode === 'sell') hint(`🚜 <b>Sell mode</b><span class="hint-how">${tapWord()} something to sell it for 60% of its current value</span>`, ['done']);
  else if (mode === 'select') hint(null);
}
function itemName(kind, key) { return kind === 'inst' ? INST[key].vendor + ' ' + INST[key].name : EQUIP[key].name; }
function itemPrice(kind, key) { return kind === 'inst' ? instPrice(INST[key]) : EQUIP[key].price; }
function startBuild(kind, key) {
  const price = itemPrice(kind, key);
  if (S.money < price) { notify('💸', `${itemName(kind, key)} costs ${fmtMoney(price)} — you have ${fmtMoney(S.money)}. Borrow in 💰 Finances?`, 'warn', null, () => openPanel('finance')); sfx('error'); return; }
  setMode('build');
  UI.build = { kind, key, rot: UI.lastRot || 0 };
  setGhost(UI.build); hideGhost();
  buildHint();
  if (window.innerWidth < 860) closePanel();
  sfx('click');
}
function buildHint(reason = '') {
  if (!UI.build) return;
  const { kind, key } = UI.build;
  const def = kind === 'inst' ? INST[key] : EQUIP[key];
  const verb = UI.mode === 'move' ? 'Moving' : 'Placing';
  const where = def.form === 'bench' ? ' on a bench' : def.form === 'wall' ? ' against a wall' : '';
  const how = TOUCH.active ? 'Tap a spot to preview, tap it again or ✓ to place · press &amp; hold to cancel' : 'Click to place · <b>R</b> rotate · <b>Esc</b> or right-click to stop';
  const canPlaceNow = TOUCH.active && UI.ghostTgt && UI.ghostOk;
  hint(`${verb} <b>${esc(itemName(kind, key))}</b>${UI.mode === 'build' ? ' · ' + fmtMoney(itemPrice(kind, key)) : ''}${where}${reason ? ` · <span class="bad">${esc(reason)}</span>` : ''}<span class="hint-how">${how}</span>`,
    canPlaceNow ? ['rotate', 'place', 'done'] : ['rotate', 'done']);
}
function startMove(o) {
  if (o.kind === 'inst' && instBusy(o)) { notify('⚠️', 'Wait until its runs are unloaded before moving it.', 'warn'); return; }
  if (o.busy) { notify('⚠️', 'Someone is using it right now.', 'warn'); return; }
  setMode('move');
  UI.moving = o.id;
  UI.build = { kind: o.kind, key: o.key, rot: o.rot };
  setGhost(UI.build); hideGhost();
  buildHint();
}

// Work out where the ghost would go for the current cursor position.
function ghostTarget() {
  const { kind, key, rot } = UI.build;
  const def = kind === 'inst' ? INST[key] : EQUIP[key];
  if (def.form === 'wall') {
    const p = groundAt(MOUSE.x, MOUSE.y, 1.08);
    if (!p) return null;
    const L = S.lab;
    const x0 = L.x0 * GRID, z0 = L.z0 * GRID, X1 = (L.x0 + L.w) * GRID, Z1 = (L.z0 + L.h) * GRID;
    const cands = [['N', Math.abs(p.z - z0), p.x > x0 && p.x < X1], ['S', Math.abs(p.z - Z1), p.x > x0 && p.x < X1], ['W', Math.abs(p.x - x0), p.z > z0 && p.z < Z1], ['E', Math.abs(p.x - X1), p.z > z0 && p.z < Z1]]
      .filter(c => c[2]).sort((a, b) => a[1] - b[1]);
    const c = worldToCell(p.x, p.z);
    if (!cands.length || cands[0][1] > 1.2) return { cx: c.cx, cz: c.cz, rot, wall: null };
    const wall = cands[0][0];
    let cx = clamp(c.cx, L.x0, L.x0 + L.w - 1), cz = clamp(c.cz, L.z0, L.z0 + L.h - 1);
    if (wall === 'N') cz = L.z0; if (wall === 'S') cz = L.z0 + L.h - 1; if (wall === 'W') cx = L.x0; if (wall === 'E') cx = L.x0 + L.w - 1;
    return { cx, cz, rot, wall };
  }
  const p = groundAt(MOUSE.x, MOUSE.y, def.form === 'bench' ? BENCH_H : 0);
  if (!p) return null;
  const { fw, fd } = footprintOf(def, rot);
  return { cx: Math.round(p.x / GRID - fw / 2), cz: Math.round(p.z / GRID - fd / 2), rot, wall: null };
}
function updateBuildGhost() {
  if (!UI.build || !MOUSE.over) { hideGhost(); return; }
  const tgt = ghostTarget();
  if (!tgt) { hideGhost(); return; }
  const k = [tgt.cx, tgt.cz, tgt.rot, tgt.wall, OCC.version, S.money > 0].join(',');
  if (k !== UI.ghostKey) {
    UI.ghostKey = k;
    const chk = canPlace(UI.build.kind, UI.build.key, tgt.cx, tgt.cz, tgt.rot, tgt.wall, UI.moving);
    let ok = chk.ok, reason = chk.reason || '';
    if (ok && UI.mode === 'build' && S.money < itemPrice(UI.build.kind, UI.build.key)) { ok = false; reason = 'Not enough money'; }
    UI.ghostOk = ok; UI.ghostTgt = tgt;
    buildHint(ok ? '' : reason);
  }
  updateGhost(tgt.cx, tgt.cz, tgt.rot, tgt.wall, UI.ghostOk);
}
function rotateBuild() {
  if (!UI.build) return;
  UI.build.rot = (UI.build.rot + 1) % 4;
  UI.lastRot = UI.build.rot;
  UI.ghostKey = '';
  sfx('click');
}

// ---------- clicks ----------
function handleWorldClick(x, y, shift) {
  if (UI.mode === 'build' || UI.mode === 'move') {
    const tgt = ghostTarget();
    if (!tgt) return;
    if (UI.mode === 'build') {
      const r = placeObject(UI.build.kind, UI.build.key, tgt.cx, tgt.cz, tgt.rot, tgt.wall);
      if (!r.ok) { notify('⚠️', r.reason, 'warn'); sfx('error'); return; }
      sfx('place'); markDirty();
      floatText(objCenter(r.obj), '−' + fmtMoney(r.obj.price).replace('−', ''), 'cost', 1);
      UI.ghostKey = '';
      checkAchievements();
      if (UI.build.kind === 'inst' && !shift) { setMode('select'); select({ type: 'obj', id: r.obj.id }); }
      else if (S.money < itemPrice(UI.build.kind, UI.build.key)) setMode('select');
      refreshAll();
    } else {
      const o = S.objects[UI.moving];
      const r = moveObject(o, tgt.cx, tgt.cz, tgt.rot, tgt.wall);
      if (!r.ok) { notify('⚠️', r.reason, 'warn'); sfx('error'); return; }
      sfx('place'); markDirty(); poof(objCenter(o));
      setMode('select'); select({ type: 'obj', id: o.id });
    }
    return;
  }
  if (UI.mode === 'expand') {
    const side = pickHandle(x, y);
    if (!side) return;
    const r = expandLab(side);
    if (!r.ok) { notify('⚠️', r.reason, 'warn'); sfx('error'); return; }
    sfx('place'); markDirty(); syncWorld();
    notify('🏗️', `Lab expanded to ${(S.lab.w * S.lab.h * GRID * GRID).toFixed(0)} m². New rent ${fmtMoney(S.lab.w * S.lab.h * GRID * GRID * S.settings.rent)}/month.`, 'good');
    showExpandHandles(true);
    refreshAll();
    return;
  }
  const hit = pickAt(x, y);
  if (UI.mode === 'sell') {
    if (hit?.type !== 'obj') return;
    const o = S.objects[hit.id];
    const value = Math.round(assetValue(o) * 0.6);
    if (o.kind === 'inst' && !confirm(`Sell ${defName(o)} for ${fmtMoney(value)}?`)) return;
    const pos = objCenter(o);
    const r = removeObject(o);
    if (!r.ok) { notify('⚠️', r.reason, 'warn'); sfx('error'); return; }
    sfx('coin'); markDirty(); poof(pos); floatText(pos, '+' + fmtMoney(r.value), 'money', 0.8);
    if (UI.sel?.id === hit.id) select(null);
    refreshAll();
    return;
  }
  select(hit);
  if (hit) sfx('click');
}

// ---------- hover ----------
function updateHover() {
  const tip = $('#tooltip');
  if (!MOUSE.over || UI.mode === 'build' || UI.mode === 'move') { tip.classList.add('hidden'); if (UI.mode === 'build' || UI.mode === 'move') updateBuildGhost(); return; }
  if (UI.mode === 'expand') { previewExpand(pickHandle(MOUSE.x, MOUSE.y)); tip.classList.add('hidden'); return; }
  MOUSE.hoverT = (MOUSE.hoverT || 0) + 1;
  if (!MOUSE.moved && MOUSE.hoverT % 10) return;
  MOUSE.moved = false;
  const hit = pickAt(MOUSE.x, MOUSE.y);
  let html = null;
  if (hit?.type === 'obj' && S.objects[hit.id]) {
    const o = S.objects[hit.id], st = objStatus(o);
    let stTxt = { running: 'sequencing', conditioning: 'conditioning a sample', done: 'run complete', queued: 'waiting to be loaded', idle: 'idle', busy: 'in use', broken: 'broken', unplugged: 'not plugged in', cut: 'no power' }[st];
    const pr = o.kind === 'inst' && (st === 'running' || st === 'conditioning') ? instProgressShort(o) : null;
    if (pr) stTxt = `${esc(pr.text)} · ${fmtHours(pr.left)} left`;
    const until = o.kind === 'inst' && st !== 'idle' ? busyUntil(o) : 0;
    html = `${esc(defName(o))}<div class="tt-sub">${stTxt}${until > S.t + 0.1 && isFinite(until) ? ` · busy until ${fmtWhen(until)}` : ''}${UI.mode === 'sell' ? ' · sell for ' + fmtMoney(Math.round(assetValue(o) * 0.6)) : ''}</div>${pr ? progressBar(pr, 'tt') : ''}`;
  } else if (hit?.type === 'staff') {
    const p = staffById(hit.id);
    if (p) html = `${esc(p.name)} · ${ROLES[p.role].name}<div class="tt-sub">${esc(staffStateText(p))} · ⚡${Math.round(p.energy)}%</div>`;
  }
  CANVAS.style.cursor = hit ? 'pointer' : (UI.mode === 'sell' ? 'crosshair' : '');
  if (!html) { tip.classList.add('hidden'); return; }
  tip.innerHTML = html; tip.classList.remove('hidden');
  tip.style.left = MOUSE.x + 'px'; tip.style.top = MOUSE.y + 'px';
}
let SELBOX = null;
function updateSelectionBox() {
  if (!SELBOX) {
    SELBOX = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: '#7c5cff', transparent: true, opacity: 0.9 }));
    R.scene.add(SELBOX);
  }
  let m = null;
  if (UI.sel?.type === 'obj') m = R.objMeshes.get(UI.sel.id);
  else if (UI.sel?.type === 'staff') { m = R.staffMeshes.get(UI.sel.id); if (m && !m.visible) m = null; }
  if (!m) { SELBOX.visible = false; return; }
  const box = new THREE.Box3();
  m.updateMatrixWorld(true);
  m.traverse(c => { if (c.isMesh && c.visible) box.expandByObject(c); });
  if (box.isEmpty()) { SELBOX.visible = false; return; }
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  SELBOX.scale.set(size.x + 0.06, size.y + 0.06, size.z + 0.06);
  SELBOX.position.copy(c);
  SELBOX.material.opacity = 0.6 + 0.35 * Math.sin(R.time * 5);
  SELBOX.visible = true;
}

// ---------- cancel / long-press ----------
// Esc, right-click, ✕ Done and long-press all do this: leave the current mode, or else clear the selection.
function cancelMode() {
  if (UI.mode !== 'select') setMode('select');
  else select(null);
}
function longPress(x, y) {
  const hit = UI.mode === 'expand' ? null : pickAt(x, y);
  if (UI.mode !== 'select') setMode('select');
  select(hit);
  sfx('click');
  if (hit?.type === 'obj') notify('👆', `Selected ${defName(S.objects[hit.id])}: use ↻ Rotate, ✥ Move or Sell in the side panel.`, '');
}
// The ring that fills under the finger while a long-press is building up.
function pressRing(x, y) {
  let el = document.getElementById('pressring');
  if (x === 'armed') { if (el) el.classList.add('armed'); return; }
  if (x === null || x === undefined) { if (el) el.classList.remove('on', 'armed'); return; }
  if (!el) { el = document.createElement('div'); el.id = 'pressring'; document.getElementById('app').appendChild(el); }
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.classList.remove('on', 'armed'); void el.offsetWidth; el.classList.add('on');
}

// ---------- input wiring ----------
function wireInput() {
  let down = null;
  const cancelLong = () => { clearTimeout(TOUCH.timer); TOUCH.timer = null; pressRing(null); };
  CANVAS.addEventListener('pointerdown', e => {
    ensureAudio();
    const touchy = e.pointerType !== 'mouse';
    if (touchy !== TOUCH.active) { TOUCH.active = touchy; document.body.classList.toggle('touch', touchy); if (UI.build) buildHint(); }
    TOUCH.pointers.set(e.pointerId, true);
    if (TOUCH.pointers.size > 1) { TOUCH.multi = true; cancelLong(); down = null; return; }   // pinch / two-finger pan
    TOUCH.multi = false;
    down = { x: e.clientX, y: e.clientY, b: e.button, t: e.timeStamp, touch: touchy };
    // Long-press = right-click. The ring fills while the finger is held; the action runs on release, timed from the
    // events' own timestamps so a slow frame rate cannot turn a quick tap into a long-press.
    if (touchy) {
      pressRing(e.clientX, e.clientY);
      TOUCH.timer = setTimeout(() => { TOUCH.timer = null; pressRing('armed'); if (navigator.vibrate) try { navigator.vibrate(15); } catch { /* not allowed */ } }, LONG_PRESS_MS);
    }
  });
  const endPointer = e => { TOUCH.pointers.delete(e.pointerId); cancelLong(); };
  CANVAS.addEventListener('pointerup', e => {
    endPointer(e);
    if (TOUCH.multi) { if (!TOUCH.pointers.size) TOUCH.multi = false; down = null; return; }
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), b = down.b, held = e.timeStamp - down.t, touch = down.touch;
    const at0 = { x: down.x, y: down.y };
    down = null;
    if (moved > (touch ? 12 : 6)) return;
    if (touch && held >= LONG_PRESS_MS) { longPress(at0.x, at0.y); return; }
    if (b === 2) { cancelMode(); return; }
    if (b !== 0) return;
    MOUSE.x = e.clientX; MOUSE.y = e.clientY; MOUSE.over = true; MOUSE.moved = true;
    // On touch screens the first tap previews the ghost; a second tap on the same spot (or ✓ Place) places it.
    if (touch && UI.build) {
      const tgt = ghostTarget();
      const key = tgt ? [tgt.cx, tgt.cz, tgt.rot, tgt.wall].join(',') : '';
      if (key !== UI.touchKey) { UI.touchKey = key; UI.ghostKey = ''; updateBuildGhost(); return; }
      UI.touchKey = '';
    }
    handleWorldClick(e.clientX, e.clientY, e.shiftKey);
  });
  CANVAS.addEventListener('pointercancel', e => { endPointer(e); down = null; if (!TOUCH.pointers.size) TOUCH.multi = false; });
  CANVAS.addEventListener('pointermove', e => {
    if (down && down.touch && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) cancelLong();
    if (e.pointerType !== 'mouse' && !down) return;   // keep the last tap position as the build preview spot
    if (e.pointerType !== 'mouse' && UI.build) return; // dragging pans the camera; the preview stays where it was tapped
    MOUSE.x = e.clientX; MOUSE.y = e.clientY; MOUSE.moved = true; MOUSE.over = true;
  });
  // a lifted finger "leaves" the canvas: keep the preview where it was tapped
  CANVAS.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse') return; MOUSE.over = false; $('#tooltip').classList.add('hidden'); });
  CANVAS.addEventListener('contextmenu', e => e.preventDefault());
  $('#buildhint').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'mode-done') cancelMode();
    else if (b.dataset.act === 'mode-rotate') { rotateBuild(); updateBuildGhost(); buildHint(); }
    else if (b.dataset.act === 'mode-place' && UI.ghostTgt) { UI.touchKey = ''; MOUSE.over = true; handleWorldClick(MOUSE.x, MOUSE.y, false); }
  });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (SIMV.open) { if (e.key === 'Escape' && !SIMV.run) closeSimMode(); return; }
    if (!$('#modal').classList.contains('hidden')) return;
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'q', 'e'].includes(k)) { KEYS.add(k); if (k.startsWith('arrow')) e.preventDefault(); return; }
    if (k === 'escape') { if (UI.mode !== 'select' || UI.sel) cancelMode(); else closePanel(); return; }
    if (k === 'r') { if (UI.build) rotateBuild(); else if (UI.sel?.type === 'obj') { const o = S.objects[UI.sel.id]; if (o && instDef(o).form !== 'wall') { const r = moveObject(o, o.cx, o.cz, (o.rot + 1) % 4); if (!r.ok) notify('⚠️', r.reason, 'warn'); markDirty(); } } return; }
    if (k === ' ') { e.preventDefault(); setSpeed(S.speed ? 0 : lastSpeed); return; }
    if ('1234'.includes(k) && k.length === 1) { setSpeed(+k); return; }
    if ((k === 'delete' || k === 'backspace') && UI.sel?.type === 'obj') { const btn = document.querySelector('#inspector [data-act="sell"]'); if (btn) btn.click(); return; }
    const panels = { o: 'orders', u: 'queue', h: 'staff', f: 'finance', b: 'sequencers', l: 'equipment', p: 'power', c: 'comfort', g: 'goals' };
    if (panels[k]) { openPanel(panels[k]); return; }
    if (k === 'x') setMode(UI.mode === 'expand' ? 'select' : 'expand');
  });
  window.addEventListener('keyup', e => KEYS.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => KEYS.clear());
  document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.gameOver) saveGame(true); });
}
function ensureAudio() { if (S?.settings.sound && !AC) sfx('none'); }
function keyboardCamera(dt) {
  if (!KEYS.size) return;
  const c = R.controls, cam = R.camera;
  const fwd = new THREE.Vector3().subVectors(c.target, cam.position); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const dist = cam.position.distanceTo(c.target);
  const sp = dt * Math.max(4, dist * 0.9);
  const mv = new THREE.Vector3();
  if (KEYS.has('w') || KEYS.has('arrowup')) mv.add(fwd);
  if (KEYS.has('s') || KEYS.has('arrowdown')) mv.sub(fwd);
  if (KEYS.has('d') || KEYS.has('arrowright')) mv.add(right);
  if (KEYS.has('a') || KEYS.has('arrowleft')) mv.sub(right);
  if (mv.lengthSq()) { mv.normalize().multiplyScalar(sp); c.target.add(mv); cam.position.add(mv); R.camAnim = null; }
  const rot = (KEYS.has('q') ? 1 : 0) - (KEYS.has('e') ? 1 : 0);
  if (rot) {
    const off = cam.position.clone().sub(c.target);
    off.applyAxisAngle(new THREE.Vector3(0, 1, 0), rot * dt * 1.6);
    cam.position.copy(c.target).add(off);
  }
}

// ---------- main loop ----------
let lastFrame = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  frame(dt);
}
function frame(dt) {
  if (!S || SIMV.open) return;   // the game pauses (and stops drawing) while simulation mode is open
  try {
    if (!S.gameOver && $('#modal').classList.contains('hidden')) {
      let mult = SPEEDS[S.speed] || 0;
      if (mult > 0 && S.settings.fastNights && S.staff.length && S.staff.every(p => p.state === 'off')) mult *= 4;
      if (mult > 0) simulate(dt * mult / S.settings.secPerHour);
    }
    keyboardCamera(dt);
    R.controls.update();
    updateHover();
    updateWorld(dt);
    updateSelectionBox();
    R.renderer.render(R.scene, R.camera);
    uiTick(dt);
  } catch (err) {
    console.error(err);
    if (!frame.reported) { frame.reported = true; notify('🐛', 'Oops, something went wrong: ' + err.message, 'bad'); }
  }
}

// ---------- start-up ----------
function resetWorldForLoad() {
  setMode('select'); UI.sel = null; renderInspector(); closePanel();
  if (!R.renderer) return;
  for (const m of R.objMeshes.values()) R.objGroup.remove(m);
  for (const m of R.staffMeshes.values()) R.staffGroup.remove(m);
  for (const m of R.cables.values()) R.fxGroup.remove(m);
  for (const m of R.engineers.values()) R.staffGroup.remove(m);
  for (const l of R.labels.values()) l.remove();
  R.objMeshes.clear(); R.staffMeshes.clear(); R.cables.clear(); R.engineers.clear(); R.labels.clear();
  R.labSig = ''; R.syncVersion = -1;
}
function afterLoad() {
  if (!R.renderer) initWorld(CANVAS);
  else { syncWorld(); frameCamera(true); }
  updateTopBar();
  updateTutorial();
}
function startNewGame() {
  const s = NEWGAME.custom ? { ...NEWGAME.custom } : makeSettings(NEWGAME.diff);
  s.difficulty = NEWGAME.diff;
  s.starter = DIFFICULTY[NEWGAME.diff].starter;
  s.startYear = NEWGAME.year;
  resetWorldForLoad();
  newGame(s);
  afterLoad();
  closeModal();
  S.tutorialHidden = false;
  setSpeed(1);
  notify('🎉', `Happy New Year! ${fmtDate(S.t)} — your lab opens today (staff start tomorrow; it's a holiday).`, 'good');
  if (s.difficulty === 'easy') notify('🐣', 'Easy mode: a bench, thermal cycler, fluorometer, centrifuge and a technician are ready. Buy a sequencer next!', 'good');
  saveGame(true);
}
function init() {
  window.__ngsStarted = true;
  try {
    wireUI();
    wireInput();
    const save = readSave();
    if (save && save.objects && save.lab) {
      loadState(save);
      afterLoad();
      showContinueModal(save);
      newsletterNews();
    } else {
      newGame(makeSettings('medium'));
      S.preview = true;
      afterLoad();
      showNewGameModal(false);
      newsletterNews();
    }
    document.getElementById('loading')?.remove();
    requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    const m = document.getElementById('loading-msg');
    if (m) m.textContent = 'Failed to start: ' + err.message;
  }
}
// Small console/debug handle (also used by automated tests).
window.NGS = {
  get S() { return S; }, simulate, placeObject, acceptOrder, assignOrder, hireCandidate, plugIn, kitOptions, bestAssignment,
  expandLab, canPlace, removeObject, openPanel, setSpeed, startNewGame, NEWGAME, generateOrder, select, markDirty, focusOn,
  frames(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) frame(dt); },
  get R() { return R; }, get UI() { return UI; }, SIMV, openSimMode, TOUCH, longPress, cancelMode, thumbnail, INST, pickAt, loadState, EQUIP, KITS, stockKit, labBoost,
};
init();

</script>
