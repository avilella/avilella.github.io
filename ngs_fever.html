<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NGS Fever</title>
<meta name="description" content="NGS Fever: build, power and run your own sequencing wet-lab. A cute 3D tycoon game built on real NGS instrument specs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root {
  --ink: #26354a;
  --muted: #6c7d92;
  --line: #e2e9f2;
  --panel: rgba(255, 255, 255, 0.94);
  --panel-solid: #ffffff;
  --soft: #f3f7fc;
  --accent: #7c5cff;
  --accent-soft: #efeaff;
  --mint: #19b394;
  --mint-soft: #e2f8f2;
  --pink: #ff6fa5;
  --yellow: #ffc23d;
  --red: #f0505a;
  --red-soft: #ffe9ea;
  --green: #1fae5b;
  --blue: #2f8cff;
  --shadow: 0 10px 30px rgba(38, 53, 74, 0.18), 0 2px 6px rgba(38, 53, 74, 0.08);
  --radius: 16px;
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Fredoka', 'Nunito', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; color: var(--ink); font-family: var(--font); }
button { font-family: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.bold { font-weight: 800; }
.good { color: var(--green); }
.bad { color: var(--red); }
.warn { color: #d98a00; }
.right { text-align: right; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.mt { margin-top: 10px; }
.mt2 { margin-top: 18px; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(160deg, #c9ecff, #fff3e0); font-family: var(--font-display); font-size: 22px; z-index: 100; text-align: center; padding: 20px; }
#loading .spinner { font-size: 64px; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- top bar ---------- */
#topbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; z-index: 20; pointer-events: none; flex-wrap: wrap; }
#topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 6px 14px 6px 8px; border-radius: 999px; box-shadow: var(--shadow); font-family: var(--font-display); font-size: 19px; }
.brand .logo { font-size: 22px; display: inline-block; animation: wobble 3s ease-in-out infinite; }
.brand b { color: var(--pink); }
@keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.pill { display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow); font-weight: 800; font-size: 14px; white-space: nowrap; }
.pill[data-open] { cursor: pointer; }
.pill[data-open]:hover { background: #fff; transform: translateY(-1px); }
.pill .ico { font-size: 16px; }
.pill.icon-only { font-size: 17px; padding: 6px 11px; }
.date-pill { gap: 8px; }
.date-pill .shift { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.date-pill .shift.on { background: var(--mint-soft); color: var(--mint); }
.speed-pill { padding: 4px; gap: 2px; }
.speed-pill button { border: 0; background: transparent; border-radius: 999px; padding: 5px 9px; font-size: 12px; cursor: pointer; font-weight: 800; letter-spacing: -2px; }
.speed-pill button:hover { background: var(--soft); }
.speed-pill button.on { background: var(--accent); color: #fff; }
.money-pill .delta { font-size: 12px; font-weight: 700; }
.spacer { flex: 1; }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }

/* ---------- toolbar ---------- */
#toolbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); z-index: 20; max-width: calc(100vw - 20px); overflow-x: auto; }
.tb-group { display: flex; gap: 4px; }
.tb-sep { width: 2px; align-self: stretch; background: var(--line); margin: 4px 4px; border-radius: 2px; }
#toolbar button { position: relative; border: 0; background: transparent; border-radius: 14px; width: 62px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 1px; transition: background .15s, transform .15s; flex: 0 0 auto; }
#toolbar button span { font-size: 22px; line-height: 1; }
#toolbar button small { font-size: 10.5px; font-weight: 800; color: var(--muted); }
#toolbar button:hover { background: var(--soft); transform: translateY(-2px); }
#toolbar button.on { background: var(--accent-soft); }
#toolbar button.on small { color: var(--accent); }
.badge { position: absolute; top: 3px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 11px; font-style: normal; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.badge:empty { display: none; }

/* ---------- panels ---------- */
.panel { position: absolute; z-index: 25; background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(8px); }
#panel { left: 10px; top: 64px; bottom: 86px; width: 410px; }
#inspector { right: 10px; top: 64px; width: 350px; max-height: calc(100% - 150px); }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; flex: 1; }
.panel-head .x { border: 0; background: var(--soft); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
.panel-head .x:hover { background: var(--line); }
.panel-body { padding: 12px 14px 16px; overflow-y: auto; flex: 1; }
.panel-tabs { display: flex; gap: 4px; padding: 8px 12px 0; flex-wrap: wrap; }
.tab { border: 0; background: var(--soft); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.tab.on { background: var(--accent); color: #fff; }
.tab .n { opacity: .8; margin-left: 3px; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 14px 0 8px; }
h3:first-child { margin-top: 2px; }
p { line-height: 1.45; margin: 6px 0; }

/* ---------- buttons, chips, inputs ---------- */
.btn { border: 0; background: var(--accent); color: #fff; font-weight: 800; border-radius: 12px; padding: 8px 14px; cursor: pointer; font-size: 13px; transition: transform .1s, filter .1s; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 10px; }
.btn.ghost { background: var(--soft); color: var(--ink); }
.btn.mint { background: var(--mint); }
.btn.pink { background: var(--pink); }
.btn.red { background: var(--red); }
.btn.yellow { background: var(--yellow); color: #4a3500; }
.btn:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; transform: none; filter: grayscale(.4); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 800; cursor: pointer; color: var(--muted); user-select: none; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; background: var(--soft); color: var(--muted); white-space: nowrap; }
.tag.est { background: #fff4d6; color: #a06c00; }
.tag.long { background: #fde7f1; color: #c2185b; }
.tag.short { background: #e3f1ff; color: #1565c0; }
.tag.bench { background: #eaf7ee; color: #2e7d32; }
.tag.floor { background: #efe9ff; color: #5e35b1; }
.tag.plus { background: #fff0e0; color: #c25e00; }
.tag.bad { background: var(--red-soft); color: var(--red); }
.tag.good { background: var(--mint-soft); color: var(--mint); }
.vendor-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(0,0,0,.15); }
.field { margin: 10px 0; }
.field label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; margin-bottom: 4px; }
.field label .v { color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
select, input[type=number], input[type=text] { font-family: inherit; font-size: 13px; padding: 6px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 13px; font-weight: 700; cursor: pointer; }
.toggle .sw { width: 38px; height: 22px; border-radius: 11px; background: #d5dde8; position: relative; flex: 0 0 auto; transition: background .15s; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on .sw { background: var(--mint); }
.toggle.on .sw::after { left: 19px; }
.toggle .desc { display: block; font-weight: 600; font-size: 11.5px; color: var(--muted); }

/* ---------- cards ---------- */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(38,53,74,.12); border-color: var(--accent); }
.card.cant { opacity: .55; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card .pic { height: 96px; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid var(--line); }
.card .pic img { max-width: 92%; max-height: 90px; object-fit: contain; }
.card .pic .emoji { font-size: 44px; }
.card .pic .flag { position: absolute; top: 5px; left: 5px; }
.card .body { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.card.kit { cursor: default; }
.card.kit .pic { height: 46px; }
.card.kit .pic .emoji { font-size: 28px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.fgrid .field { margin: 4px 0; }
.card .name { font-weight: 800; font-size: 13px; line-height: 1.2; }
.card .vendor { font-size: 11px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 5px; }
.card .spec { font-size: 11px; color: var(--muted); line-height: 1.35; }
.card .price { margin-top: auto; font-weight: 800; color: var(--accent); font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.item.hl { border-color: var(--accent); }
.item .title { font-weight: 800; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; font-weight: 800; text-align: right; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { text-align: left; color: var(--muted); font-weight: 800; padding: 4px 4px; border-bottom: 1.5px solid var(--line); position: sticky; top: 0; background: #fff; }
table.t td { padding: 4px 4px; border-bottom: 1px solid var(--line); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.total td { font-weight: 800; border-top: 1.5px solid var(--line); }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--soft); }
.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--mint); border-radius: 4px; }
.bar.energy > i { background: linear-gradient(90deg, #ffb340, #7ed957); }
.bar.red > i { background: var(--red); }
.pipeline { display: flex; gap: 3px; margin-top: 8px; }
.pipeline span { flex: 1; text-align: center; font-size: 10.5px; font-weight: 800; padding: 3px 0; border-radius: 6px; background: var(--soft); color: var(--muted); }
.pipeline span.done { background: var(--mint-soft); color: var(--mint); }
.pipeline span.now { background: var(--accent); color: #fff; }
.warnbox { background: #fff6dc; color: #8a5a00; border-radius: 10px; padding: 7px 10px; font-size: 12px; font-weight: 700; margin-top: 8px; }
.errbox { background: var(--red-soft); color: #b0222b; border-radius: 10px; padding: 7px 10px; font-size: 12px; font-weight: 700; margin-top: 8px; }
.okbox { background: var(--mint-soft); color: #0b7a63; border-radius: 10px; padding: 7px 10px; font-size: 12px; font-weight: 700; margin-top: 8px; }
.photo { width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 12px; border: 1.5px solid var(--line); overflow: hidden; }
.photo img { max-width: 100%; max-height: 146px; object-fit: contain; }
.slots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.slot { font-size: 11px; font-weight: 800; padding: 4px 7px; border-radius: 8px; background: var(--soft); color: var(--muted); min-width: 48px; }
.slot.running { background: var(--mint-soft); color: var(--mint); }
.slot.loading, .slot.reserved { background: #fff4d6; color: #a06c00; }
.slot.done { background: var(--accent-soft); color: var(--accent); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
canvas.chart { width: 100%; height: 170px; display: block; }

/* ---------- inspector ---------- */
#inspector .panel-body { padding-top: 10px; }

/* ---------- tutorial ---------- */
#tutorial { position: absolute; right: 10px; top: 64px; width: 270px; background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 15; padding: 10px 12px; font-size: 12.5px; }
#tutorial h4 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
#tutorial h4 button { margin-left: auto; border: 0; background: var(--soft); border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 800; padding: 3px 7px; }
#tutorial ol { margin: 0; padding-left: 0; list-style: none; }
#tutorial li { padding: 3px 0; display: flex; gap: 6px; align-items: flex-start; font-weight: 700; }
#tutorial li .ck { width: 17px; height: 17px; border-radius: 50%; border: 2px solid #c9d4e2; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 10px; margin-top: 1px; }
#tutorial li.done { color: var(--muted); text-decoration: line-through; }
#tutorial li.done .ck { background: var(--mint); border-color: var(--mint); color: #fff; }
#tutorial li.next { color: var(--accent); }
#tutorial li.next .ck { border-color: var(--accent); }
#tutorial.collapsed ol { display: none; }
body.has-inspector #tutorial { display: none; }

/* ---------- toasts, tooltip, hints ---------- */
#toasts { position: absolute; left: 10px; bottom: 90px; display: flex; flex-direction: column-reverse; gap: 6px; z-index: 30; max-width: 360px; pointer-events: none; }
body.has-panel #toasts { left: 430px; }
.toast { pointer-events: auto; background: var(--panel-solid); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 12px; font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; align-items: flex-start; animation: toastIn .3s cubic-bezier(.2,1.4,.4,1); border-left: 4px solid var(--accent); cursor: default; }
.toast.click { cursor: pointer; }
.toast .ti { font-size: 17px; line-height: 1; }
.toast .tt { flex: 1; line-height: 1.35; }
.toast .tdate { display: block; font-size: 10.5px; color: var(--muted); font-weight: 700; }
.toast.good { border-left-color: var(--green); }
.toast.bad { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--yellow); }
.toast.out { animation: toastOut .4s forwards; }
@keyframes toastIn { from { transform: translateX(-30px) scale(.9); opacity: 0; } }
@keyframes toastOut { to { transform: translateX(-30px); opacity: 0; } }
#tooltip, #ptip { position: absolute; z-index: 40; pointer-events: none; background: rgba(38,53,74,.92); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; max-width: 260px; line-height: 1.35; transform: translate(14px, 14px); }
#tooltip .tt-sub, #ptip .tt-sub { color: #c9d6e6; font-weight: 600; font-size: 11.5px; }
#buildhint { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 22; background: rgba(38,53,74,.92); color: #fff; padding: 6px 8px 6px 14px; border-radius: 22px; font-size: 12.5px; font-weight: 700; max-width: calc(100vw - 20px); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; width: max-content; }
#buildhint .hint-text { flex: 1 1 auto; min-width: 0; }
#buildhint .hint-how { display: block; font-size: 11.5px; font-weight: 600; color: #c9d6e6; }
@media (min-width: 861px) {
  body.has-panel #buildhint { left: calc(50% + 210px); max-width: calc(100vw - 450px); }
  body.has-panel.has-inspector #buildhint { left: calc(50% + 30px); max-width: calc(100vw - 810px); }
}
#buildhint .hint-btns { display: inline-flex; gap: 5px; flex: none; }
#buildhint .btn.ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
body.touch #buildhint .btn { padding: 8px 13px; font-size: 13px; }
#pressring { position: absolute; z-index: 30; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: conic-gradient(rgba(124,92,255,.85) var(--p, 0%), rgba(124,92,255,.15) 0); -webkit-mask: radial-gradient(circle, transparent 54%, #000 56%); mask: radial-gradient(circle, transparent 54%, #000 56%); }
#pressring.on { opacity: 1; animation: pressfill .55s linear forwards; }
#pressring.armed { transform: scale(1.15); transition: transform .12s; }
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
@keyframes pressfill { from { --p: 0%; } to { --p: 100%; } }
body.touch #view, body.touch #buildhint { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#buildhint b { color: var(--yellow); }
#buildhint .bad { color: #ff9ca1; }

/* ---------- floating world texts ---------- */
#floaters { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.floater { position: absolute; font-family: var(--font-display); font-weight: 700; font-size: 17px; white-space: nowrap; transform: translate(-50%, -50%); text-shadow: 0 2px 0 #fff, 0 0 8px #fff; }
.floater.money { color: var(--green); }
.floater.cost { color: var(--red); font-size: 14px; }
.floater.info { color: var(--accent); font-size: 14px; }
.wlabel { position: absolute; transform: translate(-50%, -100%); background: rgba(255,255,255,.92); border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.wlabel.has-bar { border-radius: 10px; padding: 2px 8px 3px; text-align: center; }
.wlabel .wl-p { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 10px; color: var(--muted); }

/* ---------- run progress: hatched = conditioning, solid = sequencing ---------- */
.pbar { position: relative; height: 10px; border-radius: 5px; background: #e6ebf2; overflow: hidden; margin-top: 4px; }
.pbar i.pc { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(42,120,214,.2) 0 3px, transparent 3px 6px); border-right: 2px solid #fff; box-sizing: border-box; }
.pbar i.pc[style^="width:0"] { border: 0; }
.pbar b { position: absolute; top: 0; bottom: 0; }
.pbar b.fc { left: 0; background: repeating-linear-gradient(135deg, #2a78d6 0 3px, #8db8ee 3px 6px); }
.pbar b.fs { background: #2a78d6; }
.pbar.idle { opacity: .55; }
.pbar.mini { width: 58px; height: 6px; margin: 0; border-radius: 3px; }
.pbar.tt { margin-top: 5px; background: rgba(255,255,255,.22); }
.plegend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 2px 0 4px; }
.plegend span { display: inline-flex; align-items: center; gap: 4px; }
.plegend i { width: 14px; height: 8px; border-radius: 2px; display: inline-block; }
.plegend i.lc, .glegend i.cond { background: repeating-linear-gradient(135deg, #2a78d6 0 3px, #8db8ee 3px 6px); }

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function poisson(lambda) {
  let L = Math.exp(-lambda), k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}
function weightedPick(items, weightFn) {
  const ws = items.map(weightFn);
  let tot = ws.reduce((a, b) => a + b, 0);
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

function fmtMoney(n, plus = false) {
  const s = n < 0 ? '−' : (plus ? '+' : '');
  const a = Math.abs(n);
  let body;
  if (a >= 1e6) body = (a / 1e6).toFixed(a >= 1e8 ? 0 : 2) + 'M';
  else if (a >= 1e4) body = (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
  else body = Math.round(a).toLocaleString('en-US');
  return s + '$' + body;
}
function fmtK(k) { return fmtMoney(k * 1000); }
function fmtGb(gb) {
  if (gb >= 1e6) return (gb / 1e6).toFixed(2) + ' Pb';
  if (gb >= 1000) return (gb / 1000).toFixed(gb >= 1e4 ? 0 : 1) + ' Tb';
  if (gb >= 10) return Math.round(gb) + ' Gb';
  if (gb >= 1) return gb.toFixed(1) + ' Gb';
  return Math.round(gb * 1000) + ' Mb';
}
function fmtLen(bp) {
  if (bp >= 1e6) return (bp / 1e6).toFixed(1) + ' Mb';
  if (bp >= 1000) return Math.round(bp / 1000) + ' kb';
  return bp + ' bp';
}
function fmtDays(d) {
  if (d < 1) return Math.max(1, Math.round(d * 24)) + ' h';
  return (d < 10 ? d.toFixed(1) : Math.round(d)) + ' d';
}
function fmtHours(h) {
  if (h < 1) return Math.round(h * 60) + ' min';
  if (h < 48) return h.toFixed(h < 10 ? 1 : 0) + ' h';
  return (h / 24).toFixed(1) + ' d';
}

// ---------- geometry of objects ----------
function defDims(def) { return def.dims ? def.dims : [def.w || 50, def.d || 50, def.h || 50]; }
function cellsFor(cm) { return Math.max(1, Math.ceil(cm / 50 - 0.15)); }
function footprintOf(def, rot) {
  const [w, d] = defDims(def);
  let fw = cellsFor(w), fd = cellsFor(d);
  if (rot % 2) [fw, fd] = [fd, fw];
  return { fw, fd };
}
function objCells(o, cx = o.cx, cz = o.cz, rot = o.rot) {
  const def = instDef(o);
  if (def.form === 'wall') return [];
  const { fw, fd } = footprintOf(def, rot);
  const out = [];
  for (let i = 0; i < fw; i++) for (let j = 0; j < fd; j++) out.push([cx + i, cz + j]);
  return out;
}
function objCenter(o) {
  const def = instDef(o);
  if (def.form === 'wall') return wallItemPos(o);
  const { fw, fd } = footprintOf(def, o.rot);
  const y = def.form === 'bench' ? BENCH_H : 0;
  return { x: (o.cx + fw / 2) * GRID, y, z: (o.cz + fd / 2) * GRID };
}
function wallItemPos(o) {
  const L = S.lab, y = 1.08;
  const cxw = (o.cx + 0.5) * GRID, czw = (o.cz + 0.5) * GRID;
  const onWall = isOnWall(o.cx, o.cz, o.wall);
  if (!onWall) return { x: cxw, y, z: czw, free: true };
  if (o.wall === 'N') return { x: cxw, y, z: L.z0 * GRID + 0.03 };
  if (o.wall === 'S') return { x: cxw, y, z: (L.z0 + L.h) * GRID - 0.03 };
  if (o.wall === 'W') return { x: L.x0 * GRID + 0.03, y, z: czw };
  return { x: (L.x0 + L.w) * GRID - 0.03, y, z: czw };
}
function isOnWall(cx, cz, wall) {
  const L = S.lab;
  if (!inLab(cx, cz)) return false;
  return (wall === 'N' && cz === L.z0) || (wall === 'S' && cz === L.z0 + L.h - 1) || (wall === 'W' && cx === L.x0) || (wall === 'E' && cx === L.x0 + L.w - 1);
}
function inLab(cx, cz) { const L = S.lab; return cx >= L.x0 && cz >= L.z0 && cx < L.x0 + L.w && cz < L.z0 + L.h; }
const cellToWorld = (cx, cz) => ({ x: (cx + 0.5) * GRID, z: (cz + 0.5) * GRID });
const worldToCell = (x, z) => ({ cx: Math.floor(x / GRID), cz: Math.floor(z / GRID) });

// ---------- door ----------
function doorInfo() {
  const L = S.lab, d = L.door;
  let cells, outside, inside, normal;
  if (d.side === 'S') {
    const z = L.z0 + L.h - 1;
    cells = [[L.x0 + d.off, z], [L.x0 + d.off + 1, z], [L.x0 + d.off, z - 1], [L.x0 + d.off + 1, z - 1]];
    const x = (L.x0 + d.off + 1) * GRID;
    inside = { x, z: (z + 0.5) * GRID }; outside = { x, z: (L.z0 + L.h) * GRID + 1.6 }; normal = { x: 0, z: 1 };
  } else if (d.side === 'N') {

    for (const ord of S.orders) if (ord.instId === o.id) { ord.instId = null; ord.kitIdx = null; }
    addMoney(Math.round(assetValue(o)), 'sales');
    delete S.objects[o.id];
    notify('📦', `A sequencer (${o.key}) is no longer in the spreadsheet, so it was refunded at its current value.`, 'warn');
  }
}
// Saves from older builds may hold an instrument whose placement changed in the spreadsheet (e.g. floor-standing ->
// benchtop). Move it to the nearest spot that fits, or refund it if the lab has none.
function relocateMisplaced() {
  for (const o of Object.values(S.objects)) {
    if (o.kind !== 'inst') continue;
    const def = INST[o.key];
    const cells = new Set(objCells(o).map(([x, z]) => ck(x, z)));
    const ok = def.form === 'bench' ? [...cells].every(k => { const b = OCC.floor.get(k); return b && EQUIP[S.objects[b]?.key]?.surface; })
      : !Object.values(S.objects).some(b => b !== o && instDef(b).form !== 'wall' && instDef(b).form !== 'bench' && objCells(b).some(([x, z]) => cells.has(ck(x, z))));
    if (ok) continue;
    let best = null;
    const L = S.lab;
    for (let x = L.x0; x < L.x0 + L.w; x++) for (let z = L.z0; z < L.z0 + L.h; z++) for (const rot of [o.rot, (o.rot + 1) % 4]) {
      const d = Math.abs(x - o.cx) + Math.abs(z - o.cz);
      if (best && d >= best.d) continue;
      if (canPlace('inst', o.key, x, z, rot, null, o.id).ok) best = { x, z, rot, d };
    }
    const name = defName(o);
    if (best) {
      o.cx = best.x; o.cz = best.z; o.rot = best.rot; o.plug = null;
      rebuildOcc();
      autoPlug(o, true);
      notify('📦', `${name} is now ${def.form === 'bench' ? 'benchtop' : 'floor-standing'} (spreadsheet Form Factor) and was moved to fit.`, 'warn', o.id);
    } else if (!instBusy(o)) {
      addMoney(Math.round(assetValue(o)), 'sales');
      for (const ord of S.orders) if (ord.instId === o.id && isActiveOrder(ord)) unassignOrder(ord);
      delete S.objects[o.id];
      rebuildOcc();
      notify('📦', `${name} is now ${def.form === 'bench' ? 'benchtop' : 'floor-standing'} (spreadsheet Form Factor) and did not fit anywhere, so it was refunded at full value.`, 'warn');
    }
  }
}

// ===== 20_sim.js =====
// Simulation: calendar, customer orders, the wet-lab task pipeline, staff AI, runs, analysis, events, bills.

// ======================= orders =======================
const ACTIVE = 'active';
function isActiveOrder(o) { return o.status === ACTIVE; }
function activeOrders() { return S.orders.filter(isActiveOrder); }
// Simulation mode can edit the order types and give reagent discounts; the game uses the defaults.
function orderType(o) { return (S.sim && S.sim.types[o.type]) || ORDER_TYPE[o.type]; }
const kitCost = (instKey, k) => k.cost * (S.sim ? S.sim.reagentF[instKey] ?? 1 : 1);
function customer(o) { return CUSTOMERS[o.cust] || CUSTOMERS[0]; }
function storageCap() {
  let cap = 3;
  for (const o of Object.values(S.objects)) if (EQUIP[o.key]?.storage && powered(o)) cap += EQUIP[o.key].storage;
  return cap;
}
function runById(id) { return S.runs.find(r => r.id === id); }
function orderById(id) { return S.orders.find(o => o.id === id); }

function generateOrder(initial = false) {
  const types = ORDER_TYPES.filter(t => !t.minRep || S.rep >= t.minRep);
  const insts = Object.values(S.objects).filter(o => o.kind === 'inst');
  const t = weightedPick(types, ty => ty.w * (insts.some(o => INST[o.key].kits.some(k => kitOk(k, ty))) ? 2.5 : 1) * (initial && ty.gb > 50 ? 0.3 : 1));
  const sizeF = clamp(0.45 + S.rep * 0.15, 0.4, 1.2);
  const u = Math.min(1, Math.pow(Math.random(), 1.5) * sizeF);
  let samples = Math.round(lerp(t.samples[0], t.samples[1], u));
  if (samples > 24) samples = Math.round(samples / 8) * 8;
  const pps = rand(t.price[0], t.price[1]) * S.settings.orderPrice * (0.85 + S.rep * 0.05);
  const o = {
    id: S.nextId++, type: t.id, cust: Math.floor(Math.random() * CUSTOMERS.length), samples,
    gb: +(samples * t.gb).toFixed(2), tech: t.tech, minLen: t.minLen, minQ: t.minQ || 0, bsl: !!t.bsl,
    price: Math.round(samples * pps / 10) * 10,
    days: Math.max(2, Math.round(t.days * S.settings.deadline * rand(0.9, 1.3))),
    created: S.t, expires: S.t + (initial ? 24 * 7 : rand(48, 130)), status: 'offer',
    instId: null, kitIdx: null, accepted: null, due: null,
    prepTotal: Math.ceil(samples / t.batch), prepDone: 0, qcDone: 0, qcSkipped: 0, qcF: 1,
    gbDone: 0, gbAnalysed: 0, runsDone: 0, cost: 0, paid: 0, warned: false,
  };
  S.orders.push(o);
  if (!initial) { notify(t.icon, `New order: ${t.name} ×${samples} from ${customer(o)[1]} (${fmtMoney(o.price)})`, '', null, () => openPanel('orders')); sfx('ping'); }
  return o;
}

function kitOk(kit, req) {
  if (req.tech === 'long' && !kit.long) return false;
  if (req.tech === 'short' && kit.long) return false;
  const len = kit.long ? kit.lenTypical : kit.len;
  if (len < req.minLen) return false;
  if (req.minQ && kit.q < req.minQ) return false;
  return true;
}
// A run (one flowcell / position) can carry libraries from several orders: run.parts = [{orderId, gb, orphan}]
const runGb = r => r.parts.reduce((a, p) => a + p.gb, 0);
const runHas = (r, o) => r.parts.some(p => p.orderId === o.id);
const partGb = (r, o) => r.parts.reduce((a, p) => a + (p.orderId === o.id ? p.gb : 0), 0);
function runOrders(r) { return [...new Set(r.parts.filter(p => !p.orphan).map(p => p.orderId))].map(orderById).filter(x => x && isActiveOrder(x)); }
function gbInFlight(o) { return S.runs.filter(r => r.status !== 'waiting').reduce((a, r) => a + partGb(r, o), 0); }
function gbToSequence(o) { return Math.max(0, o.gb - o.gbDone - gbInFlight(o)); }
// Every batch is conditioned first (sheet column "Platform-specific conditioning", e.g. DNB making, templating,
// Xpandomer synthesis), then sequenced. A single instrument does both in the same position, one after the other.
// A "duo" system conditions on unit 1 while unit 2 sequences the previous batch, so the two overlap.
const condHours = (def, kitIdx) => (def.kits[kitIdx].condDays || 0) * 24;
const seqHours = (def, kitIdx) => def.kits[kitIdx].runDays * 24;
// Hours each position is tied up per batch, i.e. the steady-state time between batches.
function batchCycle(def, kitIdx) {
  const c = condHours(def, kitIdx), s = seqHours(def, kitIdx);
  return def.duo ? Math.max(c, s) : c + s;
}
const ACTIVE_RUN = new Set(['conditioning', 'conditioned', 'running']);   // reagents loaded; powering off aborts it
function instBusy(o) { return o.slots.some(s => s !== null) || (o.cslots || []).some(s => s !== null); }
function freePosition(o, rid) {
  if (!o) return;
  o.slots = o.slots.map(s => s === rid ? null : s);
  if (o.cslots) o.cslots = o.cslots.map(s => s === rid ? null : s);
}
function queuedHoursOn(inst) {
  const def = INST[inst.key];
  let h = 0;
  for (const r of S.runs) if (r.instId === inst.id) h += batchCycle(def, r.kitIdx);
  return h / def.slots;
}
// All workable kit options for order o on instrument object inst, best first.
function kitOptions(o, inst) {
  const def = INST[inst.key];
  const gb = o.status === 'offer' ? o.gb : gbToSequence(o);
  const out = [];
  def.kits.forEach((k, i) => {
    if (!kitOk(k, o)) return;
    // spare room on runs already queued with the same kit is free (multiplexing)
    let spare = 0;
    for (const r of S.runs) if (r.status === 'waiting' && r.instId === inst.id && r.kitIdx === i) spare += Math.max(0, k.yieldGb - (runGb(r) - partGb(r, o)));
    const pooled = Math.min(gb, spare);
    const runs = Math.max(0, Math.ceil((gb - pooled) / k.yieldGb - 1e-9));
    if (runs > 600) return;
    const reagent = runs * kitCost(inst.key, k);
    const waves = Math.max(1, Math.ceil(runs / def.slots));
    const etaH = waves * batchCycle(def, i) + (def.duo ? Math.min(condHours(def, i), seqHours(def, i)) : 0) + queuedHoursOn(inst);
    out.push({ kitIdx: i, kit: k, runs, pooled, reagent, etaH });
  });
  out.sort((a, b) => a.reagent - b.reagent || a.etaH - b.etaH);
  return out;
}
function orderCostEstimate(o, opt) {
  const t = orderType(o);
  const prep = o.prepDone >= o.prepTotal ? 0 : o.samples * t.prepCost;
  const servers = Object.values(S.objects).filter(x => x.key === 'server').length;
  const cloud = servers ? 0 : o.gb * S.settings.cloudPerGb * (S.staff.some(p => p.role === 'bfx') ? 0.5 : 1);
  return { prep, cloud, reagent: opt ? opt.reagent : 0, profit: o.price - prep - cloud - (opt ? opt.reagent : 0) };
}
// Best (instrument, kit) for o by forecast expected profit, preferring options that finish at all.
function bestAssignment(o) {
  const all = allOptions(o, 2);
  return all.find(f => isFinite(f.ready)) || all[0] || null;
}
function compatibleInstalled(o) {
  return Object.values(S.objects).some(i => i.kind === 'inst' && INST[i.key].kits.some(k => kitOk(k, o)));
}

function acceptOrder(o) {
  if (o.status !== 'offer') return { ok: false, reason: 'Not available' };
  if (!o.parent && activeOrders().length >= storageCap()) return { ok: false, reason: `Sample storage full (${storageCap()} active orders) — buy a fridge or −80 °C freezer` };
  const t = orderType(o);
  o.status = ACTIVE; o.stage = 'prep'; o.accepted = S.t; o.due = S.t + o.days * 24;
  for (let b = 0; b < o.prepTotal; b++) {
    const n = Math.min(t.batch, o.samples - b * t.batch);
    addTask({ kind: 'prep', orderId: o.id, hours: t.prepH * (0.6 + 0.4 * n / t.batch), n });
  }
  S.everAccepted = true;
  sfx('click');
  if (S.settings.autoAssign) {
    const best = bestAssignment(o);
    if (best) assignOrder(o, best.inst.id, best.opt.kitIdx, true);
  }
  return { ok: true };
}
function declineOrder(o) { if (o.status === 'offer') o.status = 'declined'; }

function assignOrder(o, instId, kitIdx, silent = false) {
  const inst = S.objects[instId];
  if (!inst || inst.kind !== 'inst') return { ok: false, reason: 'No such instrument' };
  if (!kitOk(INST[inst.key].kits[kitIdx], o)) return { ok: false, reason: 'Kit not compatible' };
  if (o.instId) unassignOrder(o);
  o.instId = instId; o.kitIdx = kitIdx;
  S.everAssigned = true;
  if (o.stage === 'seq') createRuns(o);
  if (!silent) notify('🧬', `${orderType(o).name} for ${customer(o)[1]} → ${defName(inst)} (${INST[inst.key].kits[kitIdx].label})`, 'good', instId);
  return { ok: true };
}
// Take order o's libraries off runs that have not started loading; empty runs disappear.
function dropPendingParts(o) {
  for (const r of S.runs.filter(r => runHas(r, o) && (r.status === 'waiting' || r.status === 'queued'))) {
    const task = r.status === 'queued' && S.tasks.find(t => t.runId === r.id && t.kind === 'load');
    if (task && task.progress > 0) continue;
    r.parts = r.parts.filter(p => p.orderId !== o.id);
    if (r.parts.length) continue;
    if (task) removeTask(task);
    freePosition(S.objects[r.instId], r.id);
    S.runs.splice(S.runs.indexOf(r), 1);
  }
}
function unassignOrder(o) {
  dropPendingParts(o);
  o.instId = null; o.kitIdx = null;
}
function addPart(r, orderId, gb) {
  const p = r.parts.find(p => p.orderId === orderId && !p.orphan);
  if (p) p.gb += gb; else r.parts.push({ orderId, gb });
}
function createRuns(o) {
  if (!o.instId) return;
  const inst = S.objects[o.instId];
  const kit = INST[inst.key].kits[o.kitIdx];
  let left = gbToSequence(o) - S.runs.filter(r => r.status === 'waiting').reduce((a, r) => a + partGb(r, o), 0);
  let pooled = 0;
  for (const r of S.runs) {
    if (left <= 1e-6) break;
    if (r.status !== 'waiting' || r.instId !== o.instId || r.kitIdx !== o.kitIdx || runHas(r, o)) continue;
    const g = Math.min(kit.yieldGb - runGb(r), left);
    if (g > 1e-6) { addPart(r, o.id, g); left -= g; pooled += g; }
  }
  while (left > 1e-6) {
    const gb = Math.min(kit.yieldGb, left);
    const r = { id: S.nextId++, instId: o.instId, kitIdx: o.kitIdx, status: 'waiting', slot: null, cslot: null, parts: [{ orderId: o.id, gb }], cStart: 0, cEnd: 0, start: 0, end: 0, failP: 0, created: S.t };
    S.runs.push(r);
    insertInQueue(r);
    left -= gb;
  }
  if (pooled > 0) notify('🧩', `Pooled ${fmtGb(pooled)} of ${customer(o)[1]}'s libraries onto a queued ${INST[inst.key].name} flowcell — free sequencing!`, 'good', inst.id);
}
function libsReady(o) {
  o.stage = 'seq';
  if (o.instId) createRuns(o);
  else notify('📦', `Libraries ready for ${customer(o)[1]} — assign a sequencer in 📋 Orders`, 'warn', null, () => openPanel('orders'));
}

function deliverOrder(o) {
  // a shipment of a project with a per-sample deadline (simulation mode) owes both deadlines
  const lateH = S.t - (o.projectDue ?? o.due);
  const lateDays = Math.max(0, lateH / 24);
  const factor = lateDays > 0 ? Math.max(0.5, 1 - 0.05 * Math.ceil(lateDays)) : 1;
  if (o.sampleDue != null) o.sampleF = Math.max(0, 1 - o.samplePen / 100 * Math.max(0, S.t - o.sampleDue) / 24);
  const pay = Math.round(o.price * factor * (o.sampleF ?? 1));
  addMoney(pay, 'revenue');
  o.paid = pay; o.status = 'delivered'; o.delivered = S.t;
  const t = orderType(o);
  if (lateDays > 0) {
    S.rep = clamp(S.rep - Math.min(0.4, 0.12 + 0.02 * lateDays), 0, 5);
    S.stats.late++;
  } else {
    S.rep = clamp(S.rep + 0.06 + (-lateH > o.days * 24 * 0.25 ? 0.04 : 0), 0, 5);
    S.stats.onTime++;
  }
  S.stats.delivered++; S.stats.samples += o.samples; S.stats.revenue += pay;
  if (S.sim) simOnDeliver(o, pay, factor);
  if (['wgs', 'lr', 'nicu', 'biobank', 'methyl'].includes(o.type)) S.stats.genomes += o.samples;
  const di = doorInfo();
  floatText({ x: di.inside.x, y: 2.2, z: di.inside.z }, '+' + fmtMoney(pay).replace('$', '$'), 'money');
  notify(lateDays > 0 ? '🐢' : '🎉', `Delivered ${t.name} ×${o.samples} to ${customer(o)[1]}: ${fmtMoney(pay)}${lateDays > 0 ? ` (${Math.ceil(lateDays)} d late, −${Math.round((1 - factor) * 100)}%)` : ' — on time!'}`, lateDays > 0 ? 'warn' : 'good');
  sfx('coin');
  checkAchievements();
}
function cancelOrder(o, reason) {
  for (const task of S.tasks.filter(t => t.orderId === o.id && !t.assignee)) removeTask(task);
  dropPendingParts(o);
  for (const r of S.runs) for (const p of r.parts) if (p.orderId === o.id) p.orphan = true;
  S.analysis = S.analysis.filter(j => j.orderId !== o.id);
  o.status = 'cancelled';
  S.rep = clamp(S.rep - 0.4, 0, 5);
  S.stats.cancelled++;
  if (S.sim) simOnCancel(o);
  notify('💔', `${customer(o)[1]} cancelled their ${orderType(o).name} order: ${reason}`, 'bad');
  sfx('error');
}
function maybeFinishOrder(o) {
  if (!isActiveOrder(o) || o.stage === 'prep') return;
  const pending = S.runs.some(r => runHas(r, o));
  if (o.gbDone + 1e-6 >= o.gb && !pending) {
    o.stage = 'analysis';
    if (o.gbAnalysed + 1e-6 >= o.gbDone && !S.analysis.some(j => j.orderId === o.id)) deliverOrder(o);
  }
}

// ======================= tasks =======================
const TASK_PRIO = { unload: 0, load: 1, qc: 2, prep: 3 };
const TASK_LABEL = { prep: 'Library prep', qc: 'Library QC', load: 'Loading run', unload: 'Unloading' };
const TASK_ICON = { prep: '🧪', qc: '🔬', load: '🧬', unload: '📤' };
function addTask(t) {
  const task = { id: S.nextId++, kind: t.kind, orderId: t.orderId || null, runId: t.runId || null, stationId: t.stationId || null,
    hours: t.hours, progress: 0, assignee: null, created: S.t, n: t.n || 0, blocked: '', started: false };
  S.tasks.push(task);
  return task;
}
function removeTask(task) {
  const i = S.tasks.indexOf(task);
  if (i >= 0) S.tasks.splice(i, 1);
  if (task.stationId && S.objects[task.stationId]?.busy === task.id) S.objects[task.stationId].busy = null;
  if (task.assignee) { const op = staffById(task.assignee); if (op && op.taskId === task.id) { op.taskId = null; op.state = 'idle'; op.path = []; } }
}
function releaseTask(task) {
  if (task.stationId && S.objects[task.stationId]?.busy === task.id) S.objects[task.stationId].busy = null;
  if (task.kind === 'prep' || task.kind === 'qc') task.stationId = null;
  task.assignee = null;
}
function completeTask(task, op) {
  const o = orderById(task.orderId);
  const station = S.objects[task.stationId];
  if (station && station.busy === task.id) station.busy = null;
  S.tasks.splice(S.tasks.indexOf(task), 1);
  if (task.kind === 'prep') {
    if (!o || !isActiveOrder(o)) return;
    o.prepDone++;
    const qcExists = Object.values(S.objects).some(x => EQUIP[x.key]?.role === 'qc');
    if (qcExists) addTask({ kind: 'qc', orderId: o.id, hours: 0.6 + 0.4 * task.n / orderType(o).batch, n: task.n });
    else { o.qcSkipped++; o.qcF = Math.max(o.qcF, 3); checkLibsReady(o); }
  } else if (task.kind === 'qc') {
    if (!o || !isActiveOrder(o)) return;
    o.qcDone++;
    o.qcF = Math.max(o.qcF === 1 && !o.qcSkipped ? 0 : o.qcF, qcFactorFor(station, o));
    checkLibsReady(o);
  } else if (task.kind === 'load') {
    const r = runById(task.runId);
    if (!r) return;
    const inst = S.objects[r.instId];
    const def = INST[inst.key], kit = def.kits[r.kitIdx];
    const cost = kitCost(inst.key, kit);
    addMoney(-cost, 'reagents');
    floatText(objCenter(inst), '−' + fmtMoney(cost).replace('−', ''), 'cost', 1.6);
    // conditioning first; the sequencing times are provisional on a duo until unit 2 takes the batch
    r.status = 'conditioning'; r.cStart = S.t; r.cEnd = S.t + condHours(def, r.kitIdx);
    r.start = r.cEnd; r.end = r.start + seqHours(def, r.kitIdx);
    const qcF = Math.max(0.3, ...runOrders(r).map(x => x.qcF || 1));
    const libF = Math.max(0.35, ...runOrders(r).map(x => labBoost('fail', x)));   // shearing, size selection, kits
    r.failP = clamp(S.settings.runFail / 100 * Math.max(0.3, qcF) * libF * (op ? op.traits.care : 1) * (op && op.energy < 35 ? 1.5 : 1), 0, 0.9);
    sfx('whir');
  } else if (task.kind === 'unload') {
    const r = runById(task.runId);
    if (!r) return;
    const inst = S.objects[r.instId];
    freePosition(inst, r.id);
    if (Math.random() < r.failP) {
      S.stats.runsFailed++;
      requeueRun(r);
      if (S.runs.includes(r)) notify('😵', `Run on ${defName(inst)} failed QC metrics (low cluster density). Re-queued — reagents lost.`, 'bad', inst?.id);
      sfx('error');
      return;
    }
    S.runs.splice(S.runs.indexOf(r), 1);
    S.stats.runs++; S.stats.gb += runGb(r);
    floatText(objCenter(inst), '🧬 ' + fmtGb(runGb(r)), 'info', 1.4);
    for (const p of r.parts) {
      const ord = orderById(p.orderId);
      if (p.orphan || !ord || !isActiveOrder(ord)) continue;
      ord.gbDone += p.gb; ord.runsDone++;
      S.analysis.push({ orderId: ord.id, gb: p.gb, left: p.gb, cloudEnd: null });
      maybeFinishOrder(ord);
    }
  }
}
function checkLibsReady(o) { if (o.qcDone + o.qcSkipped >= o.prepTotal && o.stage === 'prep') libsReady(o); }

// Which station can serve this task (nearest by BFS distance)?
function stationsFor(task) {
  const o = orderById(task.orderId);
  if (task.kind === 'load' || task.kind === 'unload') {
    const r = runById(task.runId);
    return r ? [S.objects[r.instId]].filter(Boolean) : [];
  }
  const role = task.kind === 'prep' ? 'prep' : 'qc';
  return Object.values(S.objects).filter(x => {
    const d = EQUIP[x.key];
    if (!d || d.role !== role) return false;
    if (task.kind === 'prep' && o && o.bsl && !d.bsl) return false;
    return true;
  });
}
function taskBlockReason(task, stations) {
  const o = orderById(task.orderId);
  if (!stations.length) {
    if (task.kind === 'prep') return o && o.bsl ? 'Needs a biosafety cabinet 🛡️' : 'Needs a prep station (thermal cycler 🔥 or robot 🤖)';
    if (task.kind === 'qc') return 'Needs a QC device';
    return 'Instrument missing';
  }
  if (stations.every(s => !powered(s))) return S.powerCut ? 'Power cut ⚡' : `${defName(stations[0])} is not plugged in 🔌`;
  if (stations.every(s => s.broken)) return `${defName(stations[0])} is broken 🔧`;
  return '';
}

// ======================= staff =======================
function staffById(id) { return S.staff.find(p => p.id === id); }
function makeCandidate(role) {
  const r = ROLES[role];
  const q = Math.random();
  const traits = {
    speed: +(rand(0.8, 1.2) * (role === 'sci' ? 1.25 : 1)).toFixed(2),

    traits, salaryBase: Math.round(r.salary * (0.75 + 0.3 * quality + 0.1 * q) / 500) * 500,
    look: { skin: pick(SKIN), hair: pick(HAIR), style: pick(HAIR_STYLES), shirt: pick(SHIRT), glasses: Math.random() < 0.35, goggles: Math.random() < 0.3 },
  };
}
function refreshCandidates() {
  S.candidates = [makeCandidate('tech'), makeCandidate('tech'), makeCandidate('tech'), makeCandidate('sci'), makeCandidate('sci'), makeCandidate('bfx')];
}
function salaryOf(p) { return p.salaryBase * S.settings.salary; }
function hireCandidate(id, free = false) {
  const c = S.candidates.find(c => c.id === id);

  if (S.staff.length >= 40) return { ok: false, reason: 'The lab is full of people already!' };

  if (!free && S.money < fee) return { ok: false, reason: 'Not enough money for the hiring fee' };

    taskId: null, jitter: rand(0, 0.6), stateT: 0, hasCup: false, workedDay: -1, breakSpot: null, idleT: 0 });
  if (!free) { notify(ROLES[c.role].icon, `${c.name} joined the lab as ${ROLES[c.role].name}!`, 'good'); sfx('chime'); }
  S.candidates.push(makeCandidate(c.role));

}
function fireStaff(id) {
  const p = staffById(id);
  if (!p) return;
  if (p.taskId) { const t = S.tasks.find(t => t.id === p.taskId); if (t) releaseTask(t); }
  addMoney(-Math.round(salaryOf(p) / 12), 'salaries');
  S.staff = S.staff.filter(x => x !== p);
  notify('👋', `${p.name} left the lab (one month severance paid).`, '');
}
function isWorkday(t) { return !isHoliday(t) && (S.settings.weekendShifts || !isWeekend(t)); }
function onSite(p) { return !['off'].includes(p.state); }
function inLabNow(p) { return !['off', 'enter', 'exit'].includes(p.state); }
function comfortScore() {
  let c = 0;
  for (const o of Object.values(S.objects)) if (EQUIP[o.key]?.comfort && (!needsPower(o) || powered(o))) c += EQUIP[o.key].comfort;
  return Math.min(12, c);
}
function breakSpots(kind) {
  const nav = navGrid(), taken = new Set(S.staff.filter(p => p.breakSpot).map(p => p.breakSpot.k));
  const out = [];
  for (const o of Object.values(S.objects)) {
    const d = EQUIP[o.key];
    if (!d) continue;
    if (kind === 'coffee' ? d.role !== 'coffee' : d.role !== 'seat') continue;
    if (needsPower(o) && !powered(o)) continue;
    for (const [x, z] of accessCells(o, nav)) { const k = ck(x, z); if (!taken.has(k)) out.push({ x, z, k, objId: o.id }); }
  }
  return out;
}
function setPath(p, goalCells) {
  const path = findPath(p.x, p.z, goalCells);
  p.path = path || [];
  return !!path;
}
function goBreak(p) {
  p.taskId = null;
  if (!p.hasCup) {
    const spots = breakSpots('coffee');
    if (spots.length) {
      const sp = pick(spots);
      if (setPath(p, [[sp.x, sp.z]])) { p.state = 'toCoffee'; p.breakSpot = sp; p.stateT = 0; return; }
    }
  }
  const seats = breakSpots('seat');
  let target = seats.length ? pick(seats) : null;
  if (!target) {
    // wander somewhere free near the middle of the lab
    const L = S.lab;
    for (let k = 0; k < 20 && !target; k++) {
      const x = L.x0 + randi(1, L.w - 2), z = L.z0 + randi(1, L.h - 2);
      if (walkable(x, z) && !isDoorCell(x, z)) target = { x, z, k: ck(x, z) };
    }
  }
  if (target && setPath(p, [[target.x, target.z]])) { p.state = 'toBreak'; p.breakSpot = target; }
  else { p.state = 'break'; p.breakSpot = null; }
  p.stateT = 0;
}
function goLeave(p) {
  if (p.taskId) { const t = S.tasks.find(t => t.id === p.taskId); if (t) releaseTask(t); p.taskId = null; }
  p.breakSpot = null; p.hasCup = false;
  const di = doorInfo();
  setPath(p, [[di.insideCell.cx, di.insideCell.cz]]);
  p.path.push({ x: di.outside.x, z: di.outside.z });
  p.state = 'exit';
}
function moveAlong(p, dt) {
  let dist = WALK_SPEED * dt;
  p.walking = p.path.length > 0;
  while (dist > 0 && p.path.length) {
    const tgt = p.path[0];
    const dx = tgt.x - p.x, dz = tgt.z - p.z, d = Math.hypot(dx, dz);
    if (d > 1e-4) p.heading = Math.atan2(dx, dz);
    if (d <= dist) { p.x = tgt.x; p.z = tgt.z; p.path.shift(); dist -= d; }
    else { p.x += dx / d * dist; p.z += dz / d * dist; dist = 0; }
  }
  return p.path.length === 0;
}
function faceObject(p, o) {
  if (!o) return;
  const c = objCenter(o);
  p.heading = Math.atan2(c.x - p.x, c.z - p.z);
}
function workSpeed(p, task) {
  return p.traits.speed * (p.energy < 30 ? 0.75 : 1) * stationSpeed(task);
}
// How fast a station works on a task without the operator's own speed: station speed × lab-wide prep boosts.
function stationSpeed(task) {
  const st = S.objects[task.stationId];
  let s = (st && EQUIP[st.key]?.speed) || 1;
  if (task.kind === 'prep') s *= labBoost('prep', orderById(task.orderId));
  return s;
}
// Share of a prep batch an operator must spend at the station; automated stations finish the rest alone.
function handsOnShare(st) {
  const h = (st && EQUIP[st.key]?.handsOn) ?? 1;
  return h >= 1 ? 1 : Math.max(0.05, h * labBoost('handsOn'));
}

// ======================= lab-wide boosts (centrifuge, shearing, size selection, robot arms, kits) =======================
// Which kinds of library an order makes: long reads, short-read DNA, RNA.
function orderLib(o) {
  const t = o && orderType(o);
  if (!t) return { all: true };
  const inst = o.instId && S.objects[o.instId];
  const kit = inst && o.kitIdx !== null ? INST[inst.key].kits[o.kitIdx] : null;
  const long = t.tech === 'long' || !!(kit && kit.long);
  const rna = t.id === 'rna' || t.id === 'sc';
  return { all: true, long, rna, dna: !rna, short: !long && !rna };
}
let _boostSrc = null;
function boostSources() {
  const key = S.t + '|' + OCC.version + '|' + Object.keys(S.kits).length + '|' + (S.powerCut ? 1 : 0);
  if (_boostSrc && _boostSrc.key === key) return _boostSrc.list;
  const list = [];
  const seen = new Set();
  for (const o of Object.values(S.objects)) {
    const d = EQUIP[o.key];
    if (!d?.boost || seen.has(o.key) || o.broken || !powered(o)) continue;
    seen.add(o.key); list.push({ boost: d.boost, name: d.name });
  }
  for (const id of Object.keys(S.kits)) if (KITS[id]?.boost) list.push({ boost: KITS[id].boost, name: KITS[id].name });
  _boostSrc = { key, list };
  return list;
}
// Combined multiplier of one effect for order o: the best source per family, families multiply.
function labBoost(effect, o = null) {
  const lib = orderLib(o), best = new Map();
  for (const { boost: b } of boostSources()) {
    if (b[effect] === undefined || !lib[b.on || 'all']) continue;
    const cur = best.get(b.family);
    if (cur === undefined || (effect === 'prep' ? b[effect] > cur : b[effect] < cur)) best.set(b.family, b[effect]);
  }
  let m = 1;
  if (effect === 'prep') { for (const v of best.values()) m *= 1 + v; return Math.min(m, 2.2); }
  for (const v of best.values()) m *= v;
  return Math.max(m, effect === 'fail' ? 0.35 : 0.3);
}
function stockKit(id) {
  const k = KITS[id];
  if (!k) return { ok: false, reason: 'No such kit' };
  if (S.kits[id]) return { ok: false, reason: 'Already stocked' };
  if (S.money < k.price) return { ok: false, reason: 'Not enough money' };
  addMoney(-k.price, 'kits');
  S.kits[id] = S.t;
  return { ok: true };
}
// Run-failure multiplier a QC device gives an order (long-read libraries use the long-read figure when there is one).
function qcFactorFor(station, o) {
  const d = station && EQUIP[station.key];
  if (!d) return 0.55;
  return (orderLib(o).long && d.qcLong) || d.qcFactor || 0.55;
}

function updateStaff(dt) {
  const h = hourOfDay(S.t), day = Math.floor(S.t / 24);
  const workday = isWorkday(S.t);
  const comfort = comfortScore();
  const di = doorInfo();
  for (const p of S.staff) {
    const shouldWork = workday && h >= S.settings.shiftStart + p.jitter && h < S.settings.shiftEnd;
    p.stateT += dt;
    if (updateTraining(p, dt, shouldWork)) continue;
    if (p.state === 'off') {
      if (shouldWork) {
        p.x = di.outside.x + rand(-0.4, 0.4); p.z = di.outside.z;
        p.path = [{ x: di.inside.x, z: di.inside.z }];
        p.state = 'enter'; p.energy = 100; p.tired = false; p.hasCup = false; p.workedDay = day;
      }
      continue;
    }
    if (p.state === 'enter') { if (moveAlong(p, dt)) { p.state = 'idle'; p.idleT = 0; } continue; }
    if (p.state === 'exit') { if (moveAlong(p, dt)) { p.state = 'off'; p.walking = false; } continue; }

    // Shift over? Finish short jobs, otherwise hand them back and go home.
    if (!shouldWork) {
      const task = p.taskId && S.tasks.find(t => t.id === p.taskId);
      const left = task ? (task.hours - task.progress) / workSpeed(p, task) : 0;
      if (!(p.state === 'working' && left < 1) && !(p.state === 'analysing' && h < S.settings.shiftEnd + 1)) { goLeave(p); continue; }
    }

    if (p.walking || p.path.length) p.energy -= 3 * p.traits.stamina * dt;
    switch (p.state) {
      case 'idle':
        p.idleT += dt;
        if (p.idleT > 0.05) goBreak(p);
        break;
      case 'toTask': {
        const task = S.tasks.find(t => t.id === p.taskId);
        if (!task) { p.state = 'idle'; p.idleT = 0; break; }
        if (moveAlong(p, dt)) { p.state = 'working'; p.hasCup = false; faceObject(p, S.objects[task.stationId]); }
        break;
      }
      case 'working': {
        const task = S.tasks.find(t => t.id === p.taskId);
        if (!task) { p.state = 'idle'; p.idleT = 0; break; }
        const st = S.objects[task.stationId];
        if (st && (!powered(st) || st.broken) && task.kind !== 'unload') {
          releaseTask(task); p.taskId = null; p.state = 'idle'; p.idleT = 0; break;
        }
        if (!task.started) {
          task.started = true;
          if (task.kind === 'prep') {
            const o = orderById(task.orderId);
            const cost = task.n * orderType(o).prepCost;
            addMoney(-cost, 'prep');
            if (st) floatText(objCenter(st), '−' + fmtMoney(cost).replace('−', ''), 'cost', 1.2);
          }
        }
        task.progress += dt * workSpeed(p, task);
        p.energy -= 10 * p.traits.stamina * dt;
        if (task.progress >= task.hours) { p.taskId = null; completeTask(task, p); p.state = 'idle'; p.idleT = 0; }
        else if (task.kind === 'prep' && task.progress >= task.hours * handsOnShare(st)) {
          // set up and walk away: the automated station finishes the batch on its own
          task.auto = true; task.assignee = null; p.taskId = null; p.state = 'idle'; p.idleT = 0;
        }
        break;
      }
      case 'analysing':
        p.energy -= 4 * p.traits.stamina * dt;
        if (!S.analysis.length || p.stateT > 3) { p.state = 'idle'; p.idleT = 0; }
        break;
      case 'toCoffee':
        if (moveAlong(p, dt)) { p.state = 'coffee'; p.stateT = 0; faceObject(p, S.objects[p.breakSpot?.objId]); }
        break;
      case 'coffee':
        p.energy += 20 * dt;
        if (p.stateT > 0.3) { p.hasCup = true; p.breakSpot = null; goBreak(p); }
        break;
      case 'toBreak':
        if (moveAlong(p, dt)) { p.state = 'break'; p.stateT = 0; if (p.breakSpot?.objId) faceObject(p, S.objects[p.breakSpot.objId]); }
        break;
      case 'break':
        p.energy += (8 + (comfort > 0 ? 18 + comfort * 4 : 0)) * dt;
        if (p.tired && p.energy >= 75) p.tired = false;
        // bioinformaticians wander to the servers when there's data
        if (ROLES[p.role].wet === false && S.analysis.length && p.stateT > 0.3) {
          const srv = Object.values(S.objects).find(o => o.key === 'server' && powered(o));
          if (srv) {
            const acc = accessCells(srv);
            if (acc.length && setPath(p, acc)) { p.state = 'toDesk'; p.breakSpot = null; p.hasCup = false; }
          }
        }
        break;
      case 'toDesk':
        if (moveAlong(p, dt)) { p.state = 'analysing'; p.stateT = 0; faceObject(p, Object.values(S.objects).find(o => o.key === 'server')); }
        break;
    }
    p.energy = clamp(p.energy, 0, 100);
    if (p.energy < 20) p.tired = true;
  }
}

// Automated prep stations working through a batch on their own (paused while unpowered or broken).
function updateAutoTasks(dt) {
  for (const task of S.tasks.slice()) {
    if (!task.auto) continue;
    const st = S.objects[task.stationId];
    if (!st) { task.auto = false; task.stationId = null; continue; }
    if (!powered(st) || st.broken) continue;
    task.progress += dt * stationSpeed(task);
    if (task.progress >= task.hours) completeTask(task, null);
  }
}

// Assign open tasks to available wet-lab staff; create load tasks for free sequencer slots.
function dispatch() {
  // 1) waiting runs -> load tasks on free positions (on a duo: free positions of the conditioning unit)
  for (const inst of Object.values(S.objects)) {
    if (inst.kind !== 'inst' || inst.broken || !powered(inst)) continue;
    const def = INST[inst.key];
    const positions = def.duo ? inst.cslots : inst.slots;
    let free = [];
    positions.forEach((s, i) => { if (s === null) free.push(i); });
    if (!free.length) continue;
    for (const r of waitingRuns(inst.id)) {
      if (!free.length) break;
      if (r.held) continue;
      if (!r.go && inst.hold && runGb(r) < def.kits[r.kitIdx].yieldGb * 0.9 && S.t - (r.created || 0) < HOLD_HOURS) continue;
      const slot = free.shift();
      r.status = 'queued'; positions[slot] = r.id;
      if (def.duo) r.cslot = slot; else r.slot = slot;
      addTask({ kind: 'load', runId: r.id, stationId: inst.id, hours: def.model === 'usb' ? 0.25 : def.form === 'bench' ? 0.5 : 0.75 });
    }
  }
  // 2) free operators pick up tasks
  const free = S.staff.filter(p => ROLES[p.role].wet && !p.taskId && !p.tired && !p.training &&
    (p.state === 'idle' || ((p.state === 'break' || p.state === 'toBreak' || p.state === 'coffee' || p.state === 'toCoffee') && p.stateT > 0.15)));
  const open = S.tasks.filter(t => !t.assignee && !t.auto).sort(taskCompare);
  for (const t of open) t.blocked = '';
  if (!open.length) return;
  const nav = navGrid();
  for (const p of free) {
    const st = nearestWalkable(Math.floor(p.x / GRID), Math.floor(p.z / GRID), nav);
    const field = bfs(st.cx, st.cz, nav);
    let chosen = null;
    for (const task of open) {
      if (task.assignee) continue;
      const stations = stationsFor(task);
      const why = taskBlockReason(task, stations);
      if (why) { task.blocked = why; continue; }
      let best = null;
      for (const s of stations) {
        if (s.broken || !powered(s)) continue;
        if (s.busy && s.busy !== task.id) continue;
        for (const [x, z] of accessCells(s, nav)) {
          const d = field.dist[(z - nav.z0) * nav.w + (x - nav.x0)];
          if (d >= 0 && (!best || d < best.d)) best = { s, x, z, d };
        }
      }
      if (!best) { task.blocked = task.blocked || 'Station busy'; continue; }
      chosen = { task, ...best };
      break;
    }
    if (!chosen) continue;
    const { task, s } = chosen;
    task.assignee = p.id; task.stationId = s.id; task.blocked = '';
    s.busy = task.id;
    p.taskId = task.id; p.breakSpot = null;
    if (!setPath(p, [[chosen.x, chosen.z]])) { releaseTask(task); p.taskId = null; continue; }
    p.state = 'toTask'; p.stateT = 0;
  }
}

// ======================= scheduling =======================
// Waiting runs carry a queue key r.q (lower = sooner). Rush orders jump the line, held runs are skipped.
function orderDue(o) { return o ? (o.due ?? S.t + o.days * 24) : 1e12; }
function runDue(r) {
  let d = 1e12;
  for (const p of r.parts) { const o = orderById(p.orderId); if (o && !p.orphan && isActiveOrder(o)) d = Math.min(d, o.due); }
  return d;
}
const runRush = r => r.parts.some(p => orderById(p.orderId)?.rush);
function waitingByQ(instId) { return S.runs.filter(r => r.instId === instId && r.status === 'waiting').sort((a, b) => a.q - b.q); }
// The order the dispatcher will load them in.
function waitingRuns(instId) { return waitingByQ(instId).sort((a, b) => (runRush(b) - runRush(a)) || (a.q - b.q)); }
function insertInQueue(r) {
  const others = waitingByQ(r.instId).filter(x => x !== r);
  if (!others.length) { r.q = 1; return; }
  const last = others[others.length - 1].q;
  if (!S.settings.edf) { r.q = last + 1; return; }
  const due = runDue(r), i = others.findIndex(x => runDue(x) > due);
  r.q = i < 0 ? last + 1 : i === 0 ? others[0].q - 1 : (others[i - 1].q + others[i].q) / 2;
}
// Player controls from the Sequencing queue panel.
function queueRunNext(r) {
  if (r.status !== 'waiting') return;
  const w = waitingByQ(r.instId).filter(x => x !== r);
  r.q = (w.length ? w[0].q : 1) - 1; r.held = false; r.go = true;
}
function queueMove(r, dir) {
  const w = waitingByQ(r.instId), i = w.indexOf(r), j = i + dir;
  if (i < 0 || j < 0 || j >= w.length) return;
  [r.q, w[j].q] = [w[j].q, r.q];
}
function queueSortByDeadline(instId) {
  waitingByQ(instId).sort((a, b) => runDue(a) - runDue(b)).forEach((r, i) => { r.q = i + 1; });
}
function queueToggleHold(r) {
  if (r.status === 'queued') {   // not loaded yet: give the position back
    const task = S.tasks.find(t => t.runId === r.id && t.kind === 'load');
    if (task && task.progress > 0) return { ok: false, reason: 'Already being loaded' };
    if (task) removeTask(task);
    freePosition(S.objects[r.instId], r.id);
    r.status = 'waiting'; r.slot = null; r.cslot = null; r.held = true;
    return { ok: true };
  }
  if (r.status !== 'waiting') return { ok: false, reason: 'Only queued runs can be held' };
  r.held = !r.held;
  if (!r.held) r.go = false;
  return { ok: true };
}
function queueAbort(r) {
  if (!ACTIVE_RUN.has(r.status)) return { ok: false, reason: 'Only conditioning or running batches can be aborted' };
  abortRun(r, 'stopped by you');
  return { ok: true };
}
function toggleRush(o) { o.rush = !o.rush; }
// Library prep / QC: unloads & loads first, then rush orders, then deadline (or first come first served).
function taskKey(t) {
  const o = orderById(t.orderId);
  if (!o) return t.created;
  return (o.rush ? -1e7 : 0) + (S.settings.edf ? o.due : o.accepted);
}
function taskCompare(a, b) { return TASK_PRIO[a.kind] - TASK_PRIO[b.kind] || taskKey(a) - taskKey(b) || a.created - b.created; }

// ======================= runs & analysis =======================
const HOLD_HOURS = 24;   // 'wait to fill flowcells' holds under-filled runs this long
// Put a failed run back in the queue (only the libraries that still belong to live orders).
function requeueRun(r) {
  freePosition(S.objects[r.instId], r.id);
  r.status = 'waiting'; r.slot = null; r.cslot = null;
  r.parts = r.parts.filter(p => !p.orphan && isActiveOrder(orderById(p.orderId) || {}));
  if (!r.parts.length) S.runs.splice(S.runs.indexOf(r), 1);
}
function abortRun(r, why) {
  const inst = S.objects[r.instId];
  S.stats.runsFailed++;
  requeueRun(r);
  notify('💥', `Run aborted on ${inst ? defName(inst) : 'a sequencer'}: ${why}. Reagents lost, run re-queued.`, 'bad', inst?.id);
}
function updateRuns() {
  // oldest conditioned batch moves to the sequencer first
  const active = S.runs.filter(r => ACTIVE_RUN.has(r.status)).sort((a, b) => a.cEnd - b.cEnd);
  for (const r of active) {
    const inst = S.objects[r.instId];
    if (!inst) { S.runs.splice(S.runs.indexOf(r), 1); continue; }
    if (inst.broken) { abortRun(r, 'instrument breakdown'); continue; }
    if (!powered(inst)) { abortRun(r, S.powerCut ? 'power cut (no UPS cover)' : 'unplugged'); sfx('error'); continue; }
    const def = INST[inst.key];
    if (r.status === 'conditioning' && S.t >= r.cEnd) {
      if (def.duo) r.status = 'conditioned';
      else { r.status = 'running'; r.start = r.cEnd; r.end = r.start + seqHours(def, r.kitIdx); }
    }
    if (r.status === 'conditioned') {
      // duo: unit 2 takes the batch as soon as a sequencing position is free; until then it blocks unit 1
      const j = inst.slots.indexOf(null);
      if (j < 0) continue;
      inst.cslots[r.cslot] = null; r.cslot = null;
      inst.slots[j] = r.id; r.slot = j;
      r.status = 'running'; r.start = S.t; r.end = S.t + seqHours(def, r.kitIdx);
    }
    if (r.status === 'running' && S.t >= r.end) {
      r.status = 'done';
      addTask({ kind: 'unload', runId: r.id, stationId: inst.id, hours: 0.25 });
    }
  }
}
// Fraction of the last week each unit was busy (positions conditioning / sequencing), for the inspector.
function trackUtilisation(dt) {
  const day = Math.floor(S.t / 24);
  for (const o of Object.values(S.objects)) {
    if (o.kind !== 'inst') continue;
    const def = INST[o.key];
    const u = o.util || (o.util = { day, cur: [0, 0], days: [] });
    if (u.day !== day) { u.days.unshift({ seq: u.cur[0], cond: u.cur[1] }); u.days.length = Math.min(u.days.length, 7); u.cur = [0, 0]; u.day = day; }
    let seq = 0, cond = 0;
    for (const rid of o.slots) { const r = rid !== null && runById(rid); if (r) { if (r.status === 'running') seq++; else if (r.status === 'conditioning') cond++; } }
    for (const rid of o.cslots || []) { const r = rid !== null && runById(rid); if (r && (r.status === 'conditioning' || r.status === 'conditioned')) cond++; }
    if (def.duo) { u.cur[0] += dt * seq / def.slots; u.cur[1] += dt * cond / o.cslots.length; }
    else { u.cur[0] += dt * seq / def.slots; u.cur[1] += dt * cond / def.slots; }
  }
}
function utilisation(o) {
  const u = o.util;
  if (!u) return null;
  const hours = Math.min(7 * 24, u.days.length * 24 + hourOfDay(S.t));
  if (hours < 1) return null;
  const sum = k => u.days.reduce((a, d) => a + d[k], 0);
  return { seq: (sum('seq') + u.cur[0]) / hours, cond: (sum('cond') + u.cur[1]) / hours, hours };
}
function computeCapacity() {
  const servers = Object.values(S.objects).filter(o => o.key === 'server' && powered(o));
  const bfx = S.staff.filter(p => p.role === 'bfx').length;
  return servers.reduce((a, o) => a + EQUIP.server.gbPerHour, 0) * (1 + Math.min(bfx, servers.length));
}
function updateAnalysis(dt) {
  if (!S.analysis.length) return;
  const capH = computeCapacity();
  let cap = capH * dt;
  const bfx = S.staff.some(p => p.role === 'bfx');
  for (const j of S.analysis) {
    if (cap > 0 && j.cloudEnd === null) {
      const take = Math.min(cap, j.left);
      j.left -= take; cap -= take;
    } else if (capH === 0 || j.cloudEnd !== null) {
      if (j.cloudEnd === null) {
        j.cloudEnd = S.t + 12;
        const cost = j.gb * S.settings.cloudPerGb * (bfx ? 0.5 : 1);
        if (cost > 0) addMoney(-cost, 'cloud');
      }
      if (S.t >= j.cloudEnd) j.left = 0;
    }
  }
  const done = S.analysis.filter(j => j.left <= 1e-6);
  S.analysis = S.analysis.filter(j => j.left > 1e-6);
  for (const j of done) {
    const o = orderById(j.orderId);
    if (!o || !isActiveOrder(o)) continue;
    o.gbAnalysed += j.gb;
    maybeFinishOrder(o);
  }
}

function updatePowerCut(dt) {
  if (S.powerCut) {
    if (S.t >= S.powerCut.until) { S.powerCut = null; notify('💡', 'Power restored.', 'good'); }
    return;
  }
  const p = S.settings.powerCut / 100 / (30 * 24) * dt;
  if (Math.random() < p) {
    let cap = upsCoverage();
    const covered = [];
    const insts = Object.values(S.objects).filter(o => o.plug && o.kind === 'inst')
      .sort((a, b) => b.slots.filter(s => s !== null).length - a.slots.filter(s => s !== null).length);
    for (const o of insts) { const kw = INST[o.key].power; if (kw <= cap) { covered.push(o.id); cap -= kw; } }
    S.powerCut = { until: S.t + rand(1, 4), covered };
    notify('⚡', `Power cut! ${covered.length ? covered.length + ' instrument(s) kept alive by UPS.' : 'No UPS cover — running runs are lost.'}`, 'bad');
    sfx('error');
  }
}
function dailyBreakdowns() {
  for (const o of Object.values(S.objects)) {
    if (o.kind !== 'inst' || o.broken) continue;
    const age = (S.t - o.built) / (24 * 365);
    if (Math.random() < S.settings.breakdown / 100 / 30 * (1 + age * 0.25)) {
      o.broken = true;
      if (o.service) {
        o.repairAt = S.t + rand(24, 72);
        notify('🔧', `${defName(o)} broke down. Service engineer booked (covered by contract).`, 'warn', o.id);
      } else {
        const cost = Math.round(o.price * 0.06);
        addMoney(-cost, 'repairs');
        o.repairAt = S.t + rand(72, 168);
        notify('🔧', `${defName(o)} broke down! No service contract: repair costs ${fmtMoney(cost)} and takes longer.`, 'bad', o.id);
      }
      sfx('error');
    }
  }
}
function hourlyRepairs() {
  for (const o of Object.values(S.objects)) if (o.broken && S.t >= o.repairAt) {
    o.broken = false;
    notify('✅', `${defName(o)} repaired and back online.`, 'good', o.id);

// ======================= calendar ticks =======================
function onHour() {
  const h = Math.floor(hourOfDay(S.t));
  hourlyRepairs();
  for (const o of S.orders) if (o.status === 'offer' && S.t > o.expires) o.status = 'expired';
  if (h === 9) trainingOffer();
  const workHours = h >= 8 && h < 18;
  if (S.sim) simOrderArrivals();   // simulation mode: the same pre-drawn orders for both labs
  else if (workHours && !isHoliday(S.t)) {
    const lambda = S.settings.orderRate / 10 * (0.55 + S.rep * 0.15) * (isWeekend(S.t) ? 0.15 : 1);
    const n = poisson(lambda);
    const offers = S.orders.filter(o => o.status === 'offer').length;
    for (let i = 0; i < n && offers + i < 14; i++) generateOrder();
  }
}
function onNewDay(prevT) {
  const prevKey = monthKey(prevT);
  // electricity for the day that just ended
  const kwh = S.elecAcc; S.elecAcc = 0;
  if (kwh > 0) addMoney(-kwh * S.settings.elecPrice, 'electricity', prevKey);
  // weekend premium
  if (isWeekend(prevT) && S.settings.weekendShifts) {
    const day = Math.floor(prevT / 24);
    let extra = 0;
    for (const p of S.staff) if (p.workedDay === day) extra += salaryOf(p) / 260 * 1.5;
    if (extra) addMoney(-extra, 'salaries', prevKey);
  }
  dailyBreakdowns();
  // deadlines & stuck work
  for (const o of activeOrders()) {
    const stuck = S.tasks.find(t => t.orderId === o.id && t.blocked && !t.assignee && t.blocked !== 'Station busy');
    if (stuck && !o.blockWarned && S.t - o.accepted > 12) {
      o.blockWarned = true;
      notify('⚠️', `${customer(o)[1]}'s ${orderType(o).name} is stuck: ${stuck.blocked}`, 'warn', null, () => openPanel('orders'));
    }
    if (!o.warned && S.t > o.due - 48 && S.t < o.due) { o.warned = true; notify('⏰', `${customer(o)[1]}'s ${orderType(o).name} is due in 2 days!`, 'warn'); }
    if (S.t > o.due + Math.max(o.days * 24, 7 * 24)) cancelOrder(o, 'far too late');
  }
  // tidy old orders
  const keep = S.orders.filter(o => o.status === 'offer' || isActiveOrder(o) || S.t - (o.delivered || o.expires || o.created) < 24 * 45);
  if (keep.length < S.orders.length) S.orders = keep;
  if (gameDate(S.t).getUTCDay() === 1) refreshCandidates();
  S.history.push({ t: S.t, money: Math.round(S.money), nw: Math.round(netWorth()) });
  if (S.history.length > 4000) S.history.splice(0, S.history.length - 4000);
  checkAchievements();
}
function monthlyBills(key) {
  const salaries = S.staff.reduce((a, p) => a + salaryOf(p) / 12, 0);
  if (salaries) addMoney(-salaries, 'salaries', key);
  const area = S.lab.w * S.lab.h * GRID * GRID;
  addMoney(-area * S.settings.rent, 'rent', key);
  let service = 0;
  for (const o of Object.values(S.objects)) if (o.kind === 'inst' && o.service) service += o.price * S.settings.servicePct / 100 / 12;
  if (service) addMoney(-service, 'service', key);
  if (S.loan > 0) addMoney(-S.loan * S.settings.apr / 100 / 12, 'interest', key);
}
function onNewMonth(prevKey) {
  monthlyBills(prevKey);
  if (S.sim) return;   // no bankruptcy, goal check or autosave in simulation mode
  const tot = monthTotals(prevKey);
  notify('📅', `${monthLabel(prevKey)} closed: income ${fmtMoney(tot.inc)}, costs ${fmtMoney(-tot.exp)}, ${tot.net >= 0 ? 'profit' : 'loss'} ${fmtMoney(Math.abs(tot.net))}.`, tot.net >= 0 ? 'good' : 'warn', null, () => openPanel('finance'));
  if (S.money < 0) {
    S.debtMonths++;
    if (S.debtMonths >= 3) { S.gameOver = true; showGameOver(); return; }
    notify('🚨', `Your balance is negative! Take a loan or sell assets — bankruptcy in ${3 - S.debtMonths} month(s).`, 'bad', null, () => openPanel('finance'));
  } else S.debtMonths = 0;
  const y = gameDate(S.t).getUTCFullYear();
  if (!S.won && !S.goalChecked && y >= S.startYear + 5) { S.goalChecked = true; showTimeUpModal(); }
  saveGame(true);
}

function stepSim(dt) {
  const t0 = S.t;
  S.t += dt;
  if (Math.floor(S.t) !== Math.floor(t0)) onHour();
  if (Math.floor(S.t / 24) !== Math.floor(t0 / 24)) onNewDay(t0);
  if (S.gameOver) return;
  if (monthKey(t0) !== monthKey(S.t)) onNewMonth(monthKey(t0));
  if (S.gameOver) return;
  updatePowerCut(dt);
  updateRuns();
  trackUtilisation(dt);
  updateAnalysis(dt);
  updateStaff(dt);
  updateAutoTasks(dt);
  dispatch();
  S.elecAcc += currentLoad() * dt;
  if (S.sim) simTrack(dt);
}
function simulate(dtH) {
  if (!S || S.gameOver) return;
  let rem = Math.min(dtH, 3);
  while (rem > 1e-9) {
    const st = Math.min(rem, 0.1);
    stepSim(st);
    rem -= st;
    if (S.gameOver) break;
  }
}

const EXPAND_CELLS = 4;          // 2 m strips
const BUILD_COST_M2 = 900;       // fit-out cost per m²
function expandInfo(side) {
  const L = S.lab;
  const along = side === 'N' || side === 'S' ? L.w : L.h;
  const across = side === 'N' || side === 'S' ? L.h : L.w;
  const m2 = along * EXPAND_CELLS * GRID * GRID;
  const ok = across + EXPAND_CELLS <= MAX_LAB_CELLS;
  return { m2, cost: Math.round(m2 * BUILD_COST_M2), rentDelta: m2 * S.settings.rent, ok };
}
function expandLab(side) {
  const info = expandInfo(side);
  if (!info.ok) return { ok: false, reason: 'The lab cannot grow any further this way' };
  if (S.money < info.cost) return { ok: false, reason: 'Not enough money' };
  const L = S.lab;
  if (side === 'N') { L.z0 -= EXPAND_CELLS; L.h += EXPAND_CELLS; if (L.door.side === 'E' || L.door.side === 'W') L.door.off += EXPAND_CELLS; }
  if (side === 'S') L.h += EXPAND_CELLS;
  if (side === 'W') { L.x0 -= EXPAND_CELLS; L.w += EXPAND_CELLS; if (L.door.side === 'N' || L.door.side === 'S') L.door.off += EXPAND_CELLS; }
  if (side === 'E') L.w += EXPAND_CELLS;
  addMoney(-info.cost, 'construction');
  rebuildOcc();
  checkAchievements();
  return { ok: true };
}
function upgradePower() {
  const cost = S.settings.upgradeCost;
  if (S.money < cost) return { ok: false, reason: 'Not enough money' };
  addMoney(-cost, 'construction');
  S.lab.powerCap += 15; S.lab.upgrades++;
  return { ok: true };
}
function takeLoan(amount) {
  amount = Math.min(amount, availableCredit());
  if (amount <= 0) return { ok: false, reason: 'Credit line exhausted' };
  S.loan += amount; S.money += amount;
  return { ok: true };
}
function repayLoan(amount) {
  amount = Math.min(amount, S.loan, Math.max(0, S.money));
  if (amount <= 0) return { ok: false, reason: 'Nothing to repay (or no cash)' };
  S.loan -= amount; S.money -= amount;
  if (S.loan === 0) S.stats.repaid = true;
  checkAchievements();
  return { ok: true };
}
